name: ExcelEMFixes
version: v27
main: excelemfixes.ExcelEMFixes
api-version: '1.13'
softdepend: [EliteMobs, Geyser-Spigot, floodgate, Jobs, ExcelItems, Vault, mcMMO]
description: Community workarounds for EliteMobs defects, packaged as toggleable modules (EliteMobs' own files are never edited). Module quest-destinations (/questwhere) gives players the destination for quests whose EliteMobs tracker shows none (instanced-boss quests; upstream EliteMobs issue #241). Module jobs-dummy-gate vetoes Jobs payments for EliteMobs' guild training dummies (Jobs is a softdepend; the module idles without it). Module field-medic adds the Field Bandage, an in-combat heal-over-time consumable whose item registers through ExcelItems (a softdepend; the module stays off without it), and the Strong Healing Potion (registry ID 7), sold through the ExcelShops special-products listing and the guild vendor via the module's /fieldmedic and /guildvendor review/confirm buy flows (Vault is needed only for the purchases). Module summon-mount (/mountcharm) is the interim mount product — a buyable Mount Charm in the ExcelItems registry (ExcelItems is a softdepend of the pack and a hard requirement of that module only; without ExcelItems the module stands down and the rest of the pack is unaffected; Vault is needed only for its purchases). Since 0.8.0 the same module also carries the premium flying tier (/ghastcharm): the Ghast Charm (registry ID 9), a carry-and-toggle charm for a rideable happy ghast, sold only to players who have finished at least half the quests of one configured quest package (the gate reads EliteMobs quest data and fails closed when it cannot). Module mcmmo-xp-connector rebalances mcMMO XP for EliteMobs content — per-damage XP from EliteMobs entities is replaced by fixed kill awards under an hourly ceiling (mcMMO is a softdepend; the module stands down without it). Module quest-beacon (/questbeacon) adds a per-player pillar of light at a tracked quest's destination (particle packets only to that player — no blocks are placed; it reads the quest-destinations resolution through the pack's destination API — a table row, or a destination derived from the tracked quest's current incomplete dialog objective when the table has no row for it and stands down when that module or EliteMobs is absent). Module quest-giver-glow (no commands — a background fix) lights up each EliteMobs quest NPC that has a quest the looking player can pick up right now — per player, through per-viewer metadata packets, so an NPC glows only on the screen of a player it has a quest for (a second color marks an NPC a finished quest is turned in at); availability is EliteMobs' own accept check read from its own data, and the module idles when EliteMobs is absent or the packet bridge is unavailable. Module clarity-menus (/emguide) is the pack's plain-language front door for EliteMobs itself, built after an experienced player could not find how to claim his skill bonuses in EliteMobs' screens: it explains skill bonuses (including the click-the-skill claiming step EliteMobs never states), quests (including the safe way to check a quest), shops and Elite Coins, and the gear tools, and opens the matching EliteMobs screen for the player at each step; all of its wording lives in clarity-menus.yml (bundled; a data-folder copy overrides it). Module food-stack-normalize (no commands — a background fix) finishes the restore EliteMobs' Advanced Combat food system starts: EliteMobs stamps food items with a combat form (backing the real values up in its advanced_combat_food data keys) and restores them at combat end, but copies that slip past its restore passes — stored mid-combat, saved in a logout, picked up at the wrong moment — keep the stamp forever and refuse to stack with resting copies of the same food (a player's Fresh Rats sat in four piles). The module returns any stamped stack to its resting form, replicating EliteMobs' own restore step for step, when the stack spawns, is picked up, its owner joins, or a container closes, and merges identical copies in the swept inventory. Module skills-menu (/skillmenu, alias /skills) is our native screen for EliteMobs' skill bonuses, built after a player found EliteMobs' normal /em Skills page is a view-only text list with no way to switch a bonus on (the working screen was EliteMobs' alt chest menu, a clunky container for Bedrock players): one menu definition rendered as a Java chest GUI or a Bedrock form by the pack's shared renderer, listing every skill with its level and bonuses and switching bonuses on and off through EliteMobs' own selection calls and activation hooks, so the state is EliteMobs' own; if EliteMobs' classes ever refuse, the menu degrades to EliteMobs' own claim screens instead of erroring. Module quest-chain-clarity (no commands — a background fix) explains EliteMobs' generic chain-lock refusal: when a player clicks a quest NPC whose quest sits behind earlier quests, EliteMobs only says "finish the quests that come before them first" without naming any, so the module adds one line per locked chain naming the next quest the player can actually do — the deepest unfinished link — with the NPC who gives it and the place the quest itself names, all computed live from EliteMobs' loaded quest data and the player's own completion markers (the same markers EliteMobs' accept check reads); it never alters EliteMobs' message or the click, stays silent for quests refused for any other reason, and idles when EliteMobs is absent. Module caster-xp-sharing (/classxp, alias /casterxp) answers a player whose class sat paused at the level of its lagging foundation skill: EliteMobs sets every class form's level to the lower of its two foundation skills (Spellcaster WANDS and STAVES, Paladin ARMOR and SWORDS, Berserker AXES and MACES — the pair changes per form), the two tracks earn XP only from their own weapon, and overflow class XP is discarded, with no EliteMobs setting for any of it; the module lets each player pick how their selected form's two tracks share XP (stock / shared pool / main weapon carries) from a row on every page of /skillmenu or by command, grants the offsetting XP through EliteMobs' own PlayerData calls driven by EliteMobs' own skill-XP-gain event (EliteMobs' formula is never edited), and closes a player's existing gap once per class tree, recorded per player, the first time they pick a non-stock mode. Module commands are registered dynamically at runtime, so a disabled module's commands do not exist; only /emfixes is declared here. Module quest-xp (/questxp) is the fold of the standalone ExcelEMQuestXP 1.1.0 (ruling D244): EliteMobs quests pay no skill XP natively (its QuestReward handles items and currency only), so this module listens to EliteMobs' quest completion event and pays the quest's table amount into the player's chosen weapon skill (a pinned skill, or their highest by default) plus Armor at 1/3, and pays the staged exactly-once backpay for quests completed before the system existed; its state lives in the quest-xp subfolder of the data folder, migrated byte-verified from the standalone's data folder at install. Module wither-skulls (/witherskulls) is the fold of the standalone ExcelEMWitherSkulls 0.1.0 (consolidation programme Wave 2, ruling D245): elite wither skeletons killed by a player get their skull chance topped up toward a configured target (shipped default 25 percent) because EliteMobs neither suppresses nor boosts vanilla drops for natural elites, leaving them at the vanilla 2.5 percent rate (Jester's Oct 21, 2026 feedback: elite rewards aren't worth it). Module party-drops (/partydrops) is the fold of the standalone ExcelEMPartyDrops 0.1.0 (consolidation programme Wave 3, ruling D245): when a natural EliteMobs elite dies, the players present at the death (alive, same world, within 50 blocks - the ExcelTogether party range definition, copied not called, so there is no Together dependency) scale its vanilla drop list by 1 + 0.5 per extra participant, capped at 3x, with exact-in-expectation rounding; solo is exactly vanilla. Module bedrock-abilities (/abilities, alias /classabilities) is the fold of the standalone ExcelEMAbilityBedrockBridge 0.2.0 (consolidation programme Wave 4, ruling D245): EliteMobs fires class abilities only from its Java F-key gesture layer, which hard-returns false for Bedrock players, so this module gives Bedrock players a Cumulus form whose buttons call EliteMobs' own ability entry point (EliteMobs still enforces class, cost, targeting and threat; the module adds no costs, cooldowns or targeting of its own, and Java players keep the native F-key flow untouched). Geyser/Floodgate access is reflection-only and presence-guarded (softdepends only); if EliteMobs' class system cannot be reached the module leg stands down and the rest of the pack is unaffected.
commands:
  emfixes:
    description: ExcelEMFixes status and reload.
    usage: /emfixes [reload]
    permission: excelemfixes.admin
permissions:
  excelemfixes.admin:
    description: Reload ExcelEMFixes and its modules.
    default: op
  excelquestxp.admin:
    description: Reload the quest XP table and pay staged quest backpay (quest-xp module; node name kept from ExcelEMQuestXP 1.1.0 so existing grants carry over).
    default: op
  excelwitherskulls.admin:
    description: Run /witherskulls status and reload (wither-skulls module; node name kept from ExcelEMWitherSkulls 0.1.0 so existing grants carry over).
    default: op
  exceleitemobsabilitybedrockbridge.admin:
    description: View bedrock-abilities global status from console or in game (/abilities status) (bedrock-abilities module; node name kept from ExcelEliteMobsAbilityBedrockBridge 0.2.0 so existing grants carry over).
    default: op
  excelpartydrops.admin:
    description: Run /partydrops status and reload (party-drops module; node name kept from ExcelEMPartyDrops 0.1.0 so existing grants carry over).
    default: op
  excelquestxp.target:
    description: Choose where your own quest XP goes (/questxp target, /questxp menu) (quest-xp module; node name kept from ExcelEMQuestXP 1.1.0).
    default: true

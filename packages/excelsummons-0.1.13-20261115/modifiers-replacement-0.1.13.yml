# Summoning tree — Magic modifiers.yml REPLACEMENT for ExcelSummons
# 0.1.13 (P-SUMMONS-MANA-25, +25% hold table, Nov 15, 2026).
#
# INSTALL: in Magic's modifiers.yml, REPLACE the 18 existing
# wrv_summon_reserve_* template blocks with the 18 blocks below
# (same keys, new boosts + description text), in the same window
# as the ExcelSummons 0.1.13 jar + config. One number, two readers:
# if only the bridge config changes, the bridge COMPUTES with the
# new percents while Magic APPLIES the old boosts — a silent
# desync. Boost = -(new percent x count) as a mana_max_boost
# fraction. Percentages mirror summon-reserve-percent in the
# 0.1.13 bridge config (D64 holds x 1.25, halves-up; Mike adopted
# the draft table Nov 15, 2026, ~12:28 PM CST). Wolf4 (-0.76) and
# wolf5 (-0.95) are nominal stack totals only — the ReservePolicy
# ceiling clamp governs what is actually applied (3 wolves, 57%).
#
# Excel — Wink Reyes Valley (Iris / Mike).


#
# Wink Reyes Valley - Magic Phase 1 (HEALER RELEASE) curated spells.
# WRV-070. This file is the COMPLETE spell set for Phase 1.
#
# Paired with config.yml: load_default_spells: false
# -> defaults/spells.defaults.yml is NOT loaded. Only the spells below exist.
#
# Every block below is copied VERBATIM from Magic 11.2.5
# defaults/spells.defaults.yml (the exact build scratch-tested Oct 17, 2026),
# so parameters, costs, cooldowns and upgrade requirements are the author's
# shipped values - with ONE documented exception, added Oct 17, 2026:
# `worth` (the SP learn price) is re-scaled per rank band for the ~2-day
# hybrid ladder pace (the math is in LADDER.md, same folder). Only the
# SELECTION and those prices are ours.
#
# Phase 1 list (13 player spells + 1 inherited base template):
#   healer core : heal, cure, blessing, boon
#   utility     : superheal, feed, extinguish, aqualung, gills, shell,
#                 recall, recall_death
#   custom      : stormshackle (Storm Shackle - OUR spell, bottom of this
#                 file; NOT one of the verbatim blocks above. Mike's design
#                 change, Oct 17, 2026: a chain-lightning variant with
#                 token damage that slows what it arcs to. The raw
#                 lightning / chainlightning spells stay OUT of Phase 1;
#                 they remain Phase 2 per the roadmap.)
#   base_passive is NOT a castable spell: it is the passive template that
#   aqualung inherits from (inherit: base_passive) and recall_death inherits
#   from recall. Both inheritance targets are inside this file.
#
# Locked shelf (lava, grenade, wither, vengeance, nuke, shops, ...) is
# absent by construction: those keys are not in this file and the defaults
# file is never loaded.
#

heal:
  icon: heal
  category: light
  tags: noduel
  upgrade_required_path: student
  upgrade_required_casts: 50
  worth: 1200
  earns: 2
  actions:
    cast:
    - class: Repeat
      actions:
      - class: Delay
      - class: Heal
  effects:
    cast:
    - sound: entity_generic_drink
      sound_pitch: 0.1
      sound_volume: 0.4
    - sound: block_beacon_activate
      sound_pitch: 0.1
      sound_volume: 1.4
    - sound: entity_generic_drink
      sound_pitch: 0.3
      sound_volume: 0.2
      location: target
    - class: EffectSingle
      sound: magic.shimmer
      effectlib:
        class: ConeEffect
        iterations: 5
        lengthGrow: 0.12
        particle: heart
    - class: EffectSingle
      sound: magic.shimmer
      location: target
      effectlib:
        class: Modified
        period: 16
        duration: $total_duration
        parameters:
          radius: (t/i) * 1.5 + 1.5
          rings: (1 - (t/i)) * 3 + 1
        effect:
          class: WarpEffect
          particle: heart
          particles: 8
          grow: 0.5
    - class: EffectSingle
      location: target
      effectlib:
        class: Modified
        period: 2
        duration: $total_duration
        parameters:
          radius: (t/i) * 0.5 + 1
          rings: (1 - (t/i)) * 11 + 1
        effect:
          class: WarpEffect
          particle: end_rod
          particles: 7
    - class: EffectSingle
      effectlib:
        class: LineEffect
        particle: end_rod
        duration: 500
        particles: 10
        particle_count: 4
        particle_offset_x: 0.1
        particle_offset_y: 0.1
        particle_offset_z: 0.1
    - class: EffectSingle
      effectlib:
        class: LineEffect
        particle: heart
        duration: 1000
        particles: 4
        particle_count: 2
        particle_offset_x: 0.1
        particle_offset_y: 0.1
        particle_offset_z: 0.1
        period: 4
    cast_self:
    - sound: entity_generic_drink
      sound_pitch: 0.1
      sound_volume: 0.4
    - sound: block_beacon_activate
      sound_pitch: 0.1
      sound_volume: 1.4
    - class: EffectSingle
      sound: magic.shimmer
      location: target
      effectlib:
        class: Modified
        period: 16
        duration: $total_duration
        parameters:
          radius: (t/i) * 1.5 + 1.5
          rings: (1 - (t/i)) * 3 + 1
        effect:
          class: WarpEffect
          particle: heart
          particles: 8
          grow: 0.5
    - class: EffectSingle
      location: target
      effectlib:
        class: Modified
        period: 2
        duration: $total_duration
        parameters:
          radius: (t/i) * 0.5 + 1
          rings: (1 - (t/i)) * 11 + 1
        effect:
          class: WarpEffect
          particle: end_rod
          particles: 7
    cast_finish:
    - sound: block_beacon_activate
      sound_pitch: 1.2
      sound_volume: 0.5
      location: both
    - class: EffectSingle
      custom_sound: magic.shimmer_quiet
      sound_pitch: 5
      location: origin
      effectlib:
        class: AnimatedBall
        duration: 200
        particle: heart
        size: 3
  parameters:
    cancel_on_damage: 0.5
    cancel_on_cast_other: true
    delay: 500
    repeat: 10
    total_duration: 5000
    target_type: LivingEntity
    target: any_entity
    allow_max_range: false
    range: 8
    cooldown: 60000
    bypass_pvp: true
    bypass_friendly_fire: true
    only_friendly: true
    hitbox: true
    amount: 1
  costs:
    mana: 50
heal|2:
  upgrade_required_path: apprentice
  upgrade_required_casts: 50
  parameters:
    range: 32
    cooldown: 45000
heal|3:
  parameters:
    cooldown: 30000


# ExcelDowned settings. Excel — Wink Reyes Valley (Iris / Mike).
# Bleed-out window: Mike's call (DESIGN flag F1) — 5 minutes built.
bleed-out-seconds: 300
# Damage reaching a downed player is scaled by this factor for the
# record. 0.1.3 WINDOW RULE (P-DOWNED-REVIVE-1, run-363 evidence
# verdict): damage while downed does NOT eat the bleed-out window —
# the window is pure wall-clock — unless damage-eats-window is
# explicitly turned on below.
downed-damage-factor: 0.25
damage-seconds-per-point: 1.0
damage-eats-window: false
# Wand-owner guard (1.0.4). While a player is downed their visible
# name carries the "✝ DOWNED" mark — presentation only. Some plugins
# save identity-shaped data under whatever name they see: a Magic
# wand bound to its owner's display name copied the mark into its
# owner string when its owner logged out downed, then failed Magic's
# owner check at the next login and was silently deleted (Nov 23,
# 2026). With this guard on, ExcelDowned hands the player's real name
# back at the earliest moment of logout (and clears any stale mark at
# the earliest moment of login), before other plugins save or check
# anything — the downed session itself is untouched, and the mark
# still shows the whole time the player is online and downed.
# ExcelMagicGate 0.2.1 separately repairs any wand already carrying
# the mark. Turn this off only if the mark must persist through
# logout for some other system's sake.
wand-owner-guard:
  unmark-on-quit: true
# Frozen health while downed (half a heart — visible, not zero).
downed-health: 1.0
# Resurrection brings the target back at this fraction of max health.
revive-health-fraction: 0.5
# 0.1.3 RANGE ALIGNMENT (Defect 2 fix shape 4): ONE revive number —
# 20 — across the PreCast gate, the revive resolution, and the Magic
# spells.yml 'resurrection' range (the spells.yml leg is a packet file
# change; see the install packet draft). 0.1.2 incoherently used
# 16 (spell) / 24 (gate) / 20 (revive).
# PreCast gate range: a Resurrection cast may only start when a downed
# party member is within this distance (nothing is spent otherwise).
gate-range: 20.0
# The revive itself resolves within this distance of the caster.
revive-range: 20.0
# /giveup two-step confirm window.
giveup-window-seconds: 10
# Deaggro scrub radius around a downed player.
scrub-radius: 32.0
# Slowness while downed, as a potion amplifier (4 = Slowness V, -75%
# speed — "very slowly", not immobilized; identical on Java + Bedrock).
slowness-amplifier: 4
party:
  # Rig/dev only: if ExcelTogether is absent, treat all online players
  # as one party. NEVER enable in production.
  fallback-all-online: false
# Revive Potion (1.0.0). CONFIG RULE (Mike, Nov 17, 2026): every
# tunable in the revive system is editable here — no hardcoding —
# so values can change later without a rebuild.
revive-potion:
  # Master switch: a disabled feature mints nothing, prompts
  # nothing, and the shop seam refuses with a clear log line.
  enabled: true
  # Launch price (Mike, Nov 17, 2026: $5,000, start-and-see).
  # SOURCE OF TRUTH for the shop charge: the buy flow in this plugin
  # withdraws exactly this amount (spec C D-C1a). The shop menu lore
  # is display only and must match this value (packet gate, §5.2).
  price: 5000
  # Purchase review: a quote arms on first open; only a second,
  # distinct Confirm inside this window can debit (DeathProtection
  # pattern, 20 s there).
  buy-confirm-window-seconds: 20
  # Minimum gap after a completed purchase before the next buy can
  # debit (precedent floor: 1 s). Per-transaction qty is fixed at 1;
  # this is an anti-double-debit guard, not a purchase cap — there
  # is no daily or carried cap (spec C D-C5a).
  buy-success-cooldown-seconds: 1
  # Paid delivery never drops on the ground: with no empty storage
  # slot the sale refuses before any charge (spec C §2.1 contract).
  buy-require-empty-slot: true
  # Per-player cooldown AFTER a successful potion revive (Mike,
  # Nov 17, 2026: 10 minutes, on top of consuming the potion). A
  # SEPARATE cooldown from the Cleric ability's — they run in
  # parallel; ability + potion can each fire once back-to-back.
  use-cooldown-seconds: 600
  # Walk-up prompt (action bar) behavior.
  prompt-enabled: true
  prompt-range: 5.0
  # Confirm re-validation range (slightly forgiving over prompt).
  confirm-range: 6.0
  # Zero-potion teaching hint throttle, per (carrier, target) pair.
  zero-hint-cooldown-seconds: 5
# Cleric "Raise Ally" revive ability (companion piece B, built into
# 1.0.0 — design B in board-r506/revive/, GRACE route D107). Every
# tunable lives here so the whole revive system's values sit in one
# config, per the same CONFIG RULE — nothing is hardcoded.
cleric-revive:
  # Master switch: a disabled ability refuses every cast attempt;
  # Downed itself is unaffected either way.
  enabled: true
  # Real GRACE spend per successful raise (D107: charged through
  # EliteMobs' own ClassResourceController.trySpend, only after the
  # revive lands). 85.0 is the Cleric tree's own price for a
  # death-adjacent signature (Rewrite Fate).
  grace-cost: 85.0
  # Mike, Nov 17, 2026 (D108): 10 minutes, success-only (NOT the
  # design spec's 120 s). SEPARATE from the Revive Potion's
  # cooldown — the two run in parallel.
  cooldown-seconds: 600
  # Raise range in blocks — the one shared revive geometry (equals
  # revive-range above; all three revive doors share it).
  range: 20.0
  # Unlock point: Cleric root / EliteMobs level (D106/D108 baseline:
  # the Cleric root unlock itself; any Cleric form keeps it).
  unlock-em-level: 10
  # Party rule (design D-B3): false = any downed ally in range can
  # be raised (stock ACS ally model); true = the target must be a
  # member of the caster's ExcelTogether party, like the spell.
  require-party: false

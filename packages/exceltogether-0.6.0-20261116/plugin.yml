name: ExcelTogether
version: 0.6.0
author: Steve
main: com.winkreyes.exceltogether.ExcelTogether
api-version: "1.21"
description: 'Party for Jobs Reborn - invite, accept, leave, and a plus 25 percent money and XP bonus for party members who are close together. Includes an on-screen party range indicator with on/off cues. 0.4.0 adds friendly fire blocking between party members and bonus mob drops for groups of 3. 0.4.1 shows the party range line only when it changes. 0.4.2 fixes the missing percent signs in Bedrock menus. 0.5.0: one party everywhere — /party, /excelparty and /em party are the same party, with the EliteMobs party as its face. 0.5.1: registers Magic actions so Repair Equipment repairs the whole party at once. 0.5.2: Repair Equipment asks first - the first cast only shows what would be repaired, casting again confirms and starts the cooldown. 0.5.3: a leave at any door (/excelparty, /party, /em party) now ends the party everywhere, and /excelparty admin (status, remove, disband) works from the server console. 0.5.4: every party screen carries a Back button - submenus return to the screen that opened them, and the party hub returns to the Server Menu. 0.5.5: accepting a party invite while in a different EliteMobs party is refused with the reason (and the invite stays live) instead of splitting the player between two parties; the invite popup discloses the conflict up front, and an EliteMobs accept whose read-back disagrees is reported instead of swallowed. 0.5.6: inviting a player who already holds another party''s waiting EliteMobs invite no longer mis-joins them on accept - the EliteMobs side is left untouched, both players are told why, and the invite popup discloses the waiting invite up front. 0.6.0 (in build): the party roster is the roster of record - it is persisted to roster.yml on every change and rebuilt from that file at startup instead of being re-derived from the other party systems, and every roster change is tagged with where it came from (door, login rebuild, or admin). 0.6.0 door layer: /party is registered as the one door and a command router claims its roster verbs (with /excelparty as the same dispatch under another name), while party chat and /ptp pass through to mcMMO.'
depend: [Jobs]
softdepend: [Geyser-Spigot, floodgate, mcMMO, EliteMobs, Magic]
commands:
  party:
    description: The one party door - open the party menu, invite players, accept or leave (same dispatch as /excelparty)
    usage: /party [invite|accept|decline|leave|kick|list|invites|status|help] - party chat and /ptp stay with mcMMO
  excelparty:
    description: Open the party menu, invite players, accept or leave
    usage: /excelparty [invite|accept|decline|leave|list|kick|cue|help] or /excelparty admin [status|remove|disband] <player> (console or excelparty.admin)
    aliases: [eparty, together]
permissions:
  excelparty.use:
    description: Use parties and the party menu
    default: true
  excelparty.admin:
    description: Run /excelparty admin (status, remove, disband) to help stuck players; the server console can always run it
    default: op

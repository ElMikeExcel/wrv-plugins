name: ExcelBossTrial
version: 0.5.2
author: Argus
main: com.winkreyes.excelbosstrial.ExcelBossTrial
api-version: "1.21"
description: The seal-boss rules of Wink Reyes Valley in one home - damage caps, the 70% player-damage share gate (config share-threshold), the presence rule, 6-hour credit cooldowns, the elder-guardian trio, participant spoils, the two-phase dragon trial (ExcelDragonTrial 0.1.2, ported in), participant growth (the boss rallies), and curated seal loot. 0.2.1 adds the seal-integrity fixes - the wither fought-free (cage) check, the warden horizontal range band, and the dragon share gate. 0.2.2 adds the seal-hardening pair - the warden gives up on a fight that never comes to it, and end crystals and respawn anchors answer to their placer. 0.2.3 adds the announcement window - while it is armed, seal attempts, fails, breaks and running cooldowns are announced in chat, repeated hourly, and rebroadcast to everyone on every join. 0.2.4 adds the XP band governor feed - every governed hit plants its band verdict for the XP listener (ExcelRewardGuard), so out-of-band hits pay 25% mcMMO XP in real time while in-band hits pay full; silent, fail-safe both ways. 0.2.5 makes the rewards mean something (spec 4.6) - the dragon gains a signature - "First Breath", one elytra per champion standing at the fall - and every seal's named signature gear is granted per champion, stamped with its earner's provenance, under the fairness rule. 0.2.6 splits the command gate - the status view is public, so any player can run /bosstrial status to check seal state and cooldowns, while reload and reset stay admin-only, enforced in the handler now that plugin.yml no longer gates the whole command. 0.2.7 keeps a fight when its boss is merely unloaded (the family went home, logged off or wiped) instead of forgetting it, holds the dragon trial while nobody is at the arena, and sets aside damage a lost ledger never saw so an honest finish can still earn the seal. 0.2.11 hardens the dragon flip with a second, final judgment at HIGHEST plus danger-zone logging, closes a saved trial out on version change instead of restoring it (archived, logged, counters kept), presents earned rewards automatically once per batch - with immunity frames on the auto-open only, never on a manual one - and pays every signature stack plus the dragon's breath and crystals per champion as personal claims, dragon XP included. 0.3.1 adds the fight record - at every verdict and every elder trio progress point the encounter's per-player table (damage dealt, damage taken, healing done where a heal-spell cast names its source, healing received) is written to fights/ and to the log - and the elder trio escalation, with each elder priced as an epic fight of its own, and the trio's third, seal-completing elder carries a pool multiplier (elder-guardian.trio, settled x1.3). 0.3.2 adds milestone beats - at 75/50/25% of a chapter's pool remaining, a broadcast line and one pulse surge, once per threshold per encounter (per phase for the dragon; the warden's lines are its progress display, the warden having no health bar) - and moves the dragon's add-wave thresholds into config (dragon.adds.wave-thresholds). 0.3.3 adds the elite sprinkle - at each milestone stamp an armed chapter rolls once (chance x stamp multiplier, capped) to send EliteMobs elites in as adds beside the boss, contained (no loot, no coins, no vanilla drops), announced on a pass, leashed to the fight, and removed when the encounter ends; every chapter ships disabled (<chapter>.sprinkle.enabled) until armed, and the plugin runs exactly as before when EliteMobs is absent. 0.3.4 adds the ExcelProtect emitter - at every verdict the encounter's full per-player fight table is published to ExcelProtect, which records its combat fight summary and audit seal verdict from it; elder trio progress points publish as fight progress records; and chapter state changes (a fight started, a fight ended, an elder respawn scheduled, an elder respawned) publish as boss-state records so Protect can answer boss status. The adapter is one replaceable class, config-gated under protect-emit, fail-soft throughout, and BossTrial runs exactly as before when ExcelProtect is absent. 0.3.5 retires guardian spike reflect for tracked seal elders (elder-guardian.reflect.multiplier, settled 0.0) - the vanilla 3 HP spike return, trivial against a normal elder, compounded into a melee-only tax against the governed epic pools, and the attrition ramp silently doubled it late in long fights - so spike hits from a tracked elder during an encounter are scaled by the chapter multiplier instead of the pressure scale, and cancel outright at 0.0; guardians outside seal encounters, sprinkle adds, player Thorns armor and every other chapter are untouched. 0.3.6 adds damage feedback (the feel patch) - the boss bar title carries the true pool numbers on every chapter, the warden gains the numbered bar vanilla never gave it, the dragon title is priced per phase, and each champion's action bar carries their own last hit and running damage total, so the gear progression the governor always preserved in the ledger is finally visible on every hit (a wood sword reads 4, a Sharpness V netherite sword 11, a crit 16.5). Display only - fight math, pools, verdicts, rewards and the ExcelProtect fight-table feed are untouched - with a per-player opt-out at /bosstrial feedback on or off, and every display behavior a key under feedback in the config. 0.3.7 closes the TrainingWheels pulse gap - the attrition pulse is source-less MAGIC damage that TrainingWheels' own damage listener never sees, so a protected player ate the full pulse; BossTrial now reads the protected player's shield factor through a reflective seam and scales their pulse by it (per-chapter key <chapter>.pressure.pulse-respect-training-wheels, settled on), restoring the absolute line that a protected player takes their factor of the UNSCALED damage - regular pulse and milestone surge alike, since both ride the one application site. It also publishes BossTrial's current outgoing scale (chapter multiplier under the attrition ramp) through ExcelBossTrialAPI.outgoingScaleFor, the getter ExcelTrainingWheels 0.1.3's compensation seam divides by, so direct boss hits are judged against the same unscaled line. Fail-soft throughout, in the house adapter shape; with TrainingWheels absent the pulse lands at full amount exactly as before, and the getter reads 1.0 whenever no scale applies. 0.4.0 is the Wither-night fix train - the fight system made heal-consistent and record-complete - boss healing lands in the ledger (healedPool / netDamage) and the bar reconciles to net truth every second, so the bar is the boss; a spent pool fires a pool-exhaustion verdict through the real death path (governed lethal blow, top contributor credited) instead of leaving an unkillable boss; the fight record is written at EVERY encounter ending (verdict, give-up, prune, admin reset, seal grant, server stop) plus 60-second mid-fight snapshots; unattributed damage is accounted as 'other' in the record and the record handler consumes the governor's own output (no re-derivation); the bar gains a named FALLING state while a verdict lands and its two number spaces are named (entity HP for the hit, pool HP for the total); the sprinkle is cadence-based (guaranteed milestone waves plus a wave every 150 s, ghast/piglin/wither-skeleton rotation on the wither, caps 24 per fight / 5 alive, blocked waves deferred not spent); grantclaim learns the signature form (grantclaim <player> signature <chapter>) with a chat alert to the recipient; ExcelBossTrialAPI.closeEncounterForSeal closes a granted seal's live encounter; and BossRewards auto-present stops narrating transient skips as errors (the waiting line arrives once, when the retry window closes), retries the moment a blocking inventory closes, and offers Bedrock players a Floodgate form fallback. 0.4.1 adds the post-fight stats surface - at every encounter close each participant still online is shown their own line from the fight record (damage dealt in pool space, their share of the party's damage, healing done, damage taken) plus the party's accounting line, and /bosstrial stats (public, like the status view) re-shows the caller's most recent fight record read back from the fights/ files, always with the full split - player damage, other damage, the pool the boss healed back, and the net the verdict judged on - so a fight's accounting is visible to the players who fought it; the healing column ships in this build because the 0.4.0 Protect healing-attribution proof passed (the gate the design held it behind), chat for Java and a Floodgate form for Bedrock throughout. 0.5.2 is the combined Item 35 build - the seal fight-feel Packet B and the boss voice lane (designed as 0.5.0, rebased onto Packet B per the Nov 9, 2026 reconciliation; neither earlier number ever installed) in one jar. The Packet B half stands as built in 0.5.1 - at the dragon's phase flip the trial re-lights four end crystals on bare towers (never more than six live trial crystals), so the skyline changes and phase 2 re-opens the crystal game; the dragon's elite sprinkle is armed and cadence-driven in phase 2 only (180s, four elite endermen a wave, ten alive, forty a fight), fountain-anchored from battle registration, and the chapter's private Sealbound enderman waves are retired in the same step; when an elder of a monument trio is counted (one or two of three), the monument answers - each surviving elder with an open fight owes a sprinkle wave and fires its milestone surge under a broadcast line; and every player-facing pool-space number (per-hit feedback, totals, the stats pop-up, boss-bar pool figures) renders at a uniform display scale (feedback.display-scale, default 1000) so the vanilla gear ladder stays visible after each chapter's intake factor - display only, the ledger and governor math are unchanged. The voice half gives every boss its voice - 32 pre-rendered clips in the server resource packs, played positionally at the boss to the fight's participants on the seams that already fire the text, with the chat line kept as the subtitle track throughout. The Wither speaks its ten shipped taunt lines on real eats (the picked line's clip, index-aligned in wither.taunt-sounds, under the same 25s cooldown); the dragon speaks at battle registration, at the flip, at its per-phase milestone beats (the phase-2 50% stamp has its own crystals line) and at its phase-2 add waves; the elder guardians speak at first damage, at their beats, at the trio relay and as the last door standing; the Warden speaks at first damage, on its sonic booms (rate-limited to the taunt cooldown, two clips alternating) and at its beats; and every chapter speaks its verdict line as it falls. Voice is fail-soft throughout - a missing clip is chat-only and logged once, and a playback failure can never strand the fight event it rides. The six raid clips ride the packs inert in this build; their speaker is the GuildGate narrator and their playback waits for a later GuildGate packet, so no raid key exists here.
softdepend: [ExcelGuildGate, Magic, GriefPrevention, EliteMobs, ExcelProtect, ExcelTrainingWheels]
commands:
  bossrewards:
    description: Open your own earned boss rewards
    usage: /bossrewards
  bosstrial:
    description: ExcelBossTrial status and admin controls
    usage: /bosstrial [status|stats|feedback on|off|reload|reset [all]|grantclaim <player> <material> <count>|grantclaim <player> signature <chapter>]
permissions:
  excelbosstrial.admin:
    description: Allows /bosstrial admin commands
    default: op

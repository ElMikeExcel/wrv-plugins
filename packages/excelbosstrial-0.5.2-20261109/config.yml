# ExcelBossTrial 0.3.2 - the seal-boss rules of Wink Reyes Valley.
# 0.3.2 adds MILESTONE BEATS (the per-chapter milestones: blocks -
# a broadcast line + one pulse surge at 75/50/25% of the pool
# remaining, once per threshold per encounter; the warden's lines
# are its progress display) and moves the dragon's add-wave
# thresholds into config (dragon.adds.wave-thresholds - they were
# code constants before 0.3.2; the defaults are those constants).
# 0.3.1 adds the FIGHT RECORD (the fight-tracking: block - a
# per-player damage + healing table at every verdict and elder
# progress point) and the elder PER-ELDER epic retune + trio
# escalation (elder-guardian.scaling + elder-guardian.trio).
# 0.3.0 added the damage-INTAKE governor (pools far above the
# platform health ceiling, scaled through the intake: block), the
# EPIC retune (long fights are the point - see the scaling blocks),
# attrition PRESSURE (per-chapter pressure: blocks), the REPEAT
# system (repeat: block - broken seals can be re-fought daily for
# the repeat slate), the auto-present outcome log + retry
# (team-rewards.presentation), and the raid companion payments
# (loot.raid + raid-standard:). Every balance value is a key.
# Every rule below is the settled design (Oct 18, 2026,
# SEAL-INTEGRITY-RESEARCH.md) and every rule is individually
# disable-able: a chapter off, a gate off, or a cap at 0 degrades
# that one rule toward vanilla and touches nothing else.
# 0.2 adds PARTICIPANT GROWTH ("the boss rallies" - the scaling:
# blocks; spec BOSSTRIAL-0.2-SPEC-2026-10-20.md) and SEAL LOOT
# (the loot: block), the first-attempt doctrine, decisions
# settled Oct 20, 2026. A config carried over from 0.1.0 without
# the new blocks runs the settled 0.2 defaults from code.

# Master switch. Off = the plugin watches nothing and vetoes nothing
# (GuildGate then credits the vanilla way). The dragon chapter has
# its own switch under dragon.enabled.
enabled: true

intake:
  # The platform clamps MAX_HEALTH at 1,024 (rig-measured on
  # Paper 26.3-235): a boss's real health bar never exceeds this
  # cap, and incoming damage is scaled by (cap / configured pool)
  # so the EFFECTIVE pool is the configured one. Pools at or
  # under the cap run exactly as they always did.
  entity-cap: 1024

credit:
  # A seal credits only if player-attributed damage (melee, arrows,
  # player-lit explosions, tamed pets) reached this fraction of the
  # boss's max HP. No near-miss mercy.
  share-threshold: 0.7
  # At the death, at least one encounter participant (dealt damage
  # to the boss OR took damage from it) must be alive, in the same
  # world, within this many blocks - or no credit.
  presence-range: 128
  # After a non-crediting kill, that seal cannot be earned for this
  # long (server-wide; persists across restarts; shown in
  # /guildgate status and /bosstrial status).
  cooldown-hours: 6

spoils:
  # Seal-boss loot multiplies by the number of champions standing in
  # range at the death (the dragon's XP scales instead) - but only
  # on a kill that EARNS the seal: a refused kill drops plain
  # vanilla loot, however many champions stood by (spoils follow
  # the verdict, design record Oct 19, 2026). EliteMobs loot and raid
  # drops are never touched.
  enabled: true
  max-multiplier: 5

# Elite sprinkle (0.3.3) - master keys. The per-chapter blocks
# live under <chapter>.sprinkle and every chapter ships DISABLED;
# this master switch is the one-edit kill for the whole feature.
sprinkle:
  enabled: true
  # LEGACY (0.3.3, retired 0.4.0): the stamp multipliers and
  # chance ceiling of the old per-stamp roll. Parsed for config
  # compatibility; the cadence sprinkle never reads them.
  stamp-multipliers: [0.75, 1.0, 1.25]
  chance-ceiling: 0.90
  # A fired wave is announced - one line per wave.
  # {chapter} is the boss's name, {count} the elites spawned.
  announce-text: "&4The seal fights back&7 - {count} elite reinforcements join the battle against {chapter}!"

wither:
  enabled: true
  share-gate: true
  presence: true
  caps:
    # No single damage event may take more than this off the wither.
    # 45 (0.3.0 epic slate) sits above every legitimate single hit
    # (the strongest tops out near 31) while burst stacking trims.
    per-event-damage: 45
    # All explosion damage pools against this budget per server tick.
    explosion-per-tick: 60
  # While the wither's credit cooldown runs, summoning is blocked
  # entirely; a refused summon never consumes the skulls.
  scaling:
    # EPIC slate (0.3.0): pool at 4 champions = 6,600 + 3 x 5,100
    # = 21,900 effective HP (the bar rides the intake cap; the
    # pool is what the ledger judges). Growth never reverses.
    enabled: true
    base-health: 6600
    per-extra-damager: 5100
    max-damagers-counted: 5
  pressure:
    # Attrition (0.3.0): the wither leans on the group at 1.25x
    # outgoing, ramping +6%/min to a x2 ramp cap (peak ~minute 17,
    # then it HOLDS), plus a 2.0 MAGIC pulse every 20 s to hot
    # participants. enabled=false retires the whole axis.
    enabled: true
    outgoing-multiplier: 1.25
    pulse-damage: 2.0
    pulse-interval-seconds: 20
    pulse-hot-seconds: 30
    ramp-per-minute: 0.06
    ramp-max: 2.0
    # 0.3.7: the pulse honors TrainingWheels - a protected
    # player's pulse is scaled by their shield factor (the
    # pulse is source-less MAGIC damage, so TrainingWheels'
    # own listener never sees it; BossTrial applies the
    # factor itself, through the seam). Settled ON; false
    # restores the pre-0.3.7 full pulse for everyone.
    pulse-respect-training-wheels: true

  milestones:
    # Milestone beats (0.3.2): at 75/50/25% of the pool remaining,
    # a broadcast line + one extra pulse surge, once per threshold
    # per encounter. surge-multiplier scales the surge against this
    # chapter's pulse-damage (1.0 = one extra pulse; 0 = no surge).
    # An empty text silences that threshold's line; enabled: false
    # retires the whole feature for this chapter.
    enabled: true
    surge-multiplier: 1.0
    text-75: "&5{name} &7reels - a quarter of the fight is spent."
    text-50: "&5{name} &7staggers - half the fight is spent."
    text-25: "&5{name} &7falters - three quarters spent. The end is in sight."

  sprinkle:
    # Elite sprinkle (0.4.0 cadence shape; 0.3.3 was a per-stamp
    # roll): every milestone stamp (75/50/25% of the pool
    # remaining) owes a wave, and a timed wave falls every
    # cadence-seconds on top of that, cycling the waves rotation.
    # A wave that finds max-alive adds already standing is
    # DEFERRED, never spent - it fires when room opens. Only
    # max-per-fight retires the sprinkle. The adds pay NOTHING
    # (their loot flags are closed at conversion) and are removed
    # when the fight ends. chance/count/types are legacy keys of
    # the retired roll - parsed, never read. Ships DISABLED.
    enabled: false
    chance: 0.35
    count: 2
    levels: [20, 22, 24]
    max-alive: 5
    max-per-fight: 24
    leash-radius: 40.0
    types: [WITHER_SKELETON, WITHER_SKELETON]
    cadence-seconds: 150
    # The wither rotation (Mike's ruling, Nov 8, 2026): a ghast
    # overhead (aerial), piglin pressure on the ground, then
    # wither skeletons - pressure classes, cycled.
    waves:
      - types: [GHAST]
        count: 1
        placement: aerial
      - types: [ZOMBIFIED_PIGLIN]
        count: 3
        placement: ring
      - types: [WITHER_SKELETON]
        count: 2
        placement: ring

  # Boss taunts (0.4.0 rebuild; Mike, Nov 8, 2026): when the
  # wither EATS - kills a non-player mob and regains health
  # from the kill (the vanilla kill-heal) - it speaks one of
  # these lines in chat to the fight's participants. The
  # FIRST eat of a fight always speaks; after that, at most
  # one line per taunt-cooldown-seconds, however many eats
  # land in between. A line never repeats back-to-back. The
  # boss bar is never touched. Deleting every line (an empty
  # list) silences the chapter; other chapters ship silent -
  # add a taunts: list under their chapter to arm them.
  taunt-cooldown-seconds: 25
  taunts:
    - "MORE."
    - "Your little offerings only make me stronger."
    - "I hunger. Send me more."
    - "Every soul you send me is mine."
    - "Feed me, champions."
    - "Their strength is mine now."
    - "You brought me a feast."
    - "I will devour this world, one gift at a time."
    - "More meat for the storm."
    - "Yes… feed the storm."

  # Boss voice (0.5.2): the taunts' CLIPS, index-aligned with
  # the taunts list above - entry i is the sound of line i
  # (eat_01 = "MORE.", eat_05 = "Feed me, champions."). The
  # clip is the pack event wrv:bosstrial.wither.<slug>, played
  # positionally at the boss to the fight's participants when
  # the line speaks; the chat line stays as the subtitle. An
  # empty slot (or a list shorter than taunts) leaves that
  # line chat-only - logged once, never an error. Keep the
  # two lists the same length and in the same order.
  taunt-sounds:
    - "eat_01"
    - "eat_02"
    - "eat_03"
    - "eat_04"
    - "eat_05"
    - "eat_06"
    - "eat_07"
    - "eat_08"
    - "eat_09"
    - "eat_10"

  # feedback: (0.3.6) per-chapter overrides of the global
  # feedback: block - absent keys inherit the globals.
  #   pool-numbers: true
  #   damage-total: actionbar

elder-guardian:
  enabled: true
  share-gate: true
  presence: true
  caps:
    # 45 (0.3.0 epic slate; the elder exception - explosions cap
    # at the same 45, the monument fight stays readable).
    per-event-damage: 45
    explosion-per-tick: 45
  # The seal needs ALL THREE elder guardians of ONE monument, each
  # individually fought for. An elder whose kill did not count
  # respawns at its home after this long, so the trio stays
  # completable.
  respawn-hours: 6
  repeat:
    # After a trio completes (any verdict that finishes it), the
    # COUNTED elders turn over and fresh ones surface after this
    # long - the repeat elder fight's generation clock.
    respawn-hours: 6
  scaling:
    # PER-ELDER EPIC slate (0.3.1, Mike Nov 1, 2026: EVERY elder
    # is a 15+ minute fight, not just the trio as a whole - the
    # 0.3.0 slate priced the whole trio at ~17 minutes, ~5-6 per
    # elder). Pool at 4 champions = 7,800 + 3 x 3,100 = 17,100
    # effective HP per elder: ~15 min at the family's strongest
    # observed pace (~19 HP/s), ~17 min at the typical ~17 HP/s.
    # Solo 7,800; duo 10,900; trio-party 14,000; five 20,200.
    # The trio's third elder escalates further - see trio: below.
    enabled: true
    base-health: 7800
    per-extra-damager: 3100
    max-damagers-counted: 5
  trio:
    # Trio-position escalation (0.3.1, Mike Nov 1, 2026): the
    # elder trio's LAST, seal-completing elder is harder than the
    # two before it. Multipliers apply to the scaling pool above
    # (base and per-extra alike) by the elder's position in its
    # monument's trio - position 1 = first counted kill pending,
    # 3 = the completing kill. Settled defaults: 1.0 / 1.0 / 1.3
    # (the third elder at 4 champions: 17,100 x 1.3 = 22,230,
    # ~19-22 min). Applies to first-break and repeat generations
    # alike - a completed trio's next generation starts again at
    # position 1. Positions beyond the list reuse its last entry.
    position-multipliers: [1.0, 1.0, 1.3]
  pressure:
    # Elders: no outgoing multiplier (their numbers do the work);
    # the pulse + ramp still apply.
    enabled: true
    outgoing-multiplier: 1.0
    pulse-damage: 2.0
    pulse-interval-seconds: 20
    pulse-hot-seconds: 30
    ramp-per-minute: 0.06
    ramp-max: 2.0
    # 0.3.7: the pulse honors TrainingWheels - a protected
    # player's pulse is scaled by their shield factor (the
    # pulse is source-less MAGIC damage, so TrainingWheels'
    # own listener never sees it; BossTrial applies the
    # factor itself, through the seam). Settled ON; false
    # restores the pre-0.3.7 full pulse for everyone.
    pulse-respect-training-wheels: true
  reflect:
    # Spike reflect (0.3.5): vanilla guardians/elder guardians return
    # 3 HP (Hard) on every melee hit while their spikes are out. In a
    # vanilla fight that is nothing; against a governed pool in the
    # tens of thousands it is a melee-only tax that grows with the
    # pool - and the attrition ramp used to double it late-fight.
    # This multiplier applies to spike reflect dealt BY a tracked
    # seal elder during an encounter, INSTEAD of the pressure scale
    # (reflect is never ramped). 1.0 = exact vanilla; 0.0 = reflect
    # retired for seal elders (settled, Mike Nov 2, 2026 - melee,
    # ranged and magic all stay viable). Monument guardians, sprinkle
    # adds and everything outside a seal encounter are never touched.
    multiplier: 0.0

  relay:
    # The monument answers (Packet B, E-1): when an elder of a
    # monument trio is COUNTED (progress 1 or 2 of 3), each
    # surviving elder of the same monument with an open fight
    # owes a sprinkle wave and fires its milestone surge, under
    # the messages.elder-relay broadcast. The trio's escalation
    # becomes an event, not just a thicker third bar.
    enabled: true

  voice:
    # Boss voice (0.5.2): this chapter's clip slugs - the pack
    # event is wrv:bosstrial.elder.<slug>, played positionally
    # at the boss to the encounter's participants on the
    # seam's real event (open = first damage, beats = the
    # 75/50/25% milestone stamps, relay = the monument answers
    # at trio progress 1/2, lastdoor = the last elder standing,
    # verdict = an elder falls). An empty value silences that
    # seam; the chat lines stay as subtitles throughout.
    open: "open"
    beat-75: "beat75"
    beat-50: "beat50"
    beat-25: "beat25"
    relay: "relay"
    lastdoor: "lastdoor"
    verdict: "verdict"

  milestones:
    # Milestone beats (0.3.2): at 75/50/25% of the pool remaining,
    # a broadcast line + one extra pulse surge, once per threshold
    # per encounter. surge-multiplier scales the surge against this
    # chapter's pulse-damage (1.0 = one extra pulse; 0 = no surge).
    # An empty text silences that threshold's line; enabled: false
    # retires the whole feature for this chapter.
    enabled: true
    surge-multiplier: 1.0
    text-75: "&3{name} &7falters - a quarter of the fight is spent."
    text-50: "&3{name} &7staggers - half the fight is spent."
    text-25: "&3{name} &7reels - three quarters spent. The tide is turning."

  sprinkle:
    # Elite sprinkle (0.4.0 cadence shape): waves per elder (each
    # elder is its own encounter) - milestone stamps owe a wave
    # and the cadence adds one every cadence-seconds. Aquatic
    # types only - the fight is underwater inside the monument.
    # Ships DISABLED.
    enabled: false
    chance: 0.30
    count: 2
    levels: [18, 20, 22]
    max-alive: 5
    max-per-fight: 24
    leash-radius: 24.0
    types: [GUARDIAN, DROWNED]
    cadence-seconds: 150
    waves:
      - types: [GUARDIAN, DROWNED]
        count: 2
        placement: ring

  # feedback: (0.3.6) per-chapter overrides of the global
  # feedback: block - absent keys inherit the globals.
  #   pool-numbers: true
  #   damage-total: actionbar

protect-emit:
  # The ExcelProtect emitter (0.3.4): at every verdict the
  # fight record's full per-player table is ALSO published to
  # ExcelProtect, which records its combat fight summary and
  # its audit seal verdict from it; elder trio progress points
  # publish as fight progress records; and chapter state
  # changes (a fight started, a fight ended, an elder respawn
  # scheduled, an elder respawned) publish as boss-state
  # records so Protect can answer boss status. The emitter is
  # an observer only - nothing in any fight, verdict or reward
  # path reads anything back, and with ExcelProtect absent the
  # plugin runs exactly as before (these keys then change
  # nothing; the records still land in fights/ as always).
  # Master switch for the whole emitter.
  enabled: true
  # The verdict fight tables + elder progress records.
  fight-tables: true
  # The boss-state records (fight started / ended, elder
  # respawn scheduled / respawned).
  state-changes: true

feedback:
  # Damage feedback (0.3.6, the feel patch): DISPLAY ONLY - the
  # governor scales every governed hit before it touches the
  # entity, so the vanilla boss bar moves less than a pixel per
  # hit and gear progression was invisible in the fight (a wood
  # sword and a Sharpness V netherite sword both read as "about
  # 1"). The ledger always kept the true numbers; now the player
  # sees them: the boss bar title carries the true pool numbers
  # on every chapter, and each champion's action bar carries
  # their own last hit + running damage total. Fight math,
  # pools, verdicts and rewards are untouched - with every key
  # off the plugin behaves exactly as 0.3.5. Any player can opt
  # out for their own screen with /bosstrial feedback off.
  # The boss bar title shows "{name} - {remaining} / {total}"
  # in true pool HP (the warden gains the bar vanilla never
  # gave it; the dragon's numbers are per phase).
  pool-numbers: true
  # Per-player damage totals: "off" | actionbar. (Quote the
  # off if you write it - YAML reads a bare off as a boolean;
  # the plugin accepts either shape, but the quoted form is
  # the one that means the same thing to every YAML reader.)
  damage-total: actionbar
  # Title shape: {name}, {remaining}, {total}.
  title-format: "{name} — {remaining} / {total}"
  # Action-bar shape: {last} (this hit, in ENTITY HP - what the
  # boss's bar lost), {total} (your fight total, in POOL HP -
  # the same space as the title's {total}). The two spaces are
  # named in the line itself (0.4.0, PM-4: on the big pools the
  # unnamed pair read as a contradiction).
  damage-total-format: "{last} hit · {total} pool damage total"
  # Bar title while the pool is spent and the verdict blow is
  # falling (0.4.0, PM-5): {name} only - a named state, never a
  # frozen "0 / total" on a boss that is still standing.
  exhausted-format: "{name} — FALLING…"
  # Display scale (Packet B, Item 35 - Mike's Nov 8, 2026
  # amendment): ONE number space (pool space - hits still sum
  # to the pool), rendered x1000 on every player-facing
  # pool-space surface: per-hit feedback, running totals, the
  # post-fight stats pop-up, and the boss bar's pool figures.
  # At the settled pools' intake factors the unscaled ladder
  # (wooden 4 / diamond 7 / netherite 8) rendered as ~0.2/0.4/
  # 0.5 - invisible progression; at x1000 the Wither's reads
  # 187 / 328 / 374. Internal ledger/governor math is
  # UNCHANGED - this is display only. 1 = unscaled display.
  display-scale: 1000
  # Boss bar audience: fight participants, plus any online
  # player within this many blocks of the boss.
  viewer-range: 64
  # Minimum milliseconds between action-bar totals per player.
  damage-total-min-interval-ms: 500
  # The bar sweep's cadence: titles and audiences reconcile at
  # most this often per encounter (hits always refresh at once;
  # this also bounds how fast the dragon's title picks up a
  # phase flip between hits).
  title-tick-ms: 1000

fight-tracking:
  # The fight record (0.3.1): at every verdict (CREDIT / DENY)
  # and every elder trio progress point, the encounter's
  # per-player table is written twice - a structured file under
  # the plugin's fights/ folder, and log lines complete enough
  # to rebuild the record from latest.log alone. Per player:
  # damage dealt to the boss, damage taken, healing done,
  # healing received. Healing counts EFFECTIVE healing only
  # (capped at the health actually missing). Healing DONE is
  # attributed only where a real source exists - a Magic
  # heal-spell cast naming its caster and target; everything
  # else lands in healing-received plus a clearly labeled
  # unattributed bucket. Healing with no encounter open is
  # ignored. Tracking observes only - verdicts, rewards, pools
  # and ledger math never read it. Off = no records, no healing
  # feed, fights exactly as 0.3.0.
  enabled: true
  # Fight-record files kept in fights/ (newest kept; the names
  # sort chronologically). 0 = keep every record.
  record-retention: 200
  # A heal-spell cast claim absorbs the heal's regain events on
  # its target within this many milliseconds of the cast (Magic
  # fires the regain inside the cast itself; the window covers
  # event-order jitter only).
  heal-claim-window-ms: 1000
  # Magic spell keys that count as heal casts for attribution
  # (base keys - leveled variants like heal|2 fold to heal).
  magic-heal-spells: [heal, superheal]
  # Unattributed damage (no responsible player) at or above
  # this many pool HP in one hit earns a throttled console line
  # naming its cause class (0.4.0, PM-9). The damage always
  # counted - it advances the pool and is accounted as 'other'
  # in the fight record; this only makes the big ones visible.
  unattributed-log-threshold: 10
  # The post-fight stats surface (0.4.1, backlog item 9 of the
  # Wither-night packet): when an encounter closes, every
  # participant still online is shown their own line from the
  # fight record (damage dealt in POOL space - the boss bar's
  # numbers - their share of the party's damage, healing done,
  # damage taken) plus the party's accounting line (players /
  # other / boss healed / net). Chat for Java, a Floodgate
  # form for Bedrock. The pop-up respects /bosstrial feedback
  # off (automatic surfaces obey the display opt-out); the
  # stats command does not - asking is asking. The healing
  # column ships because the 0.4.0 healing-attribution proof
  # passed (Protect read heals back credited to the healer);
  # before that proof this surface carried no healing figure
  # at all. Off = closes stay silent; records still written.
  stats-popup: true
  # /bosstrial stats (public, like the status view): re-shows
  # the caller's most recent fight record - the full table
  # with the player / other / boss-healed split, read back
  # from the fights/ files. Off = the command reports itself
  # disabled.
  stats-command: true

warden:
  enabled: true
  share-gate: true
  presence: true
  caps:
    per-event-damage: 45
    explosion-per-tick: 60
  # Height rule (Mike, Oct 19, 2026 - this supersedes the Oct 18
  # "no engagement rule" note): damage counts toward the warden
  # seal's share only when the responsible player stood within
  # this many blocks VERTICALLY of the warden when the hit landed.
  # A sky-tower bow kill still lands every arrow and can still
  # kill - it just earns no seal (the hits count like unattributed
  # damage). Melee at the warden's own level is in-band by design;
  # the warden's sonic boom answers hole-camping. 0 disables.
  share-height-band: 12
  scaling:
    # EPIC slate (0.3.0) - the finale seal, the longest fight:
    # pool at 4 champions = 7,200 + 3 x 4,800 = 21,600 effective
    # HP, at 5 champions 26,400.
    enabled: true
    base-health: 7200
    per-extra-damager: 4800
    max-damagers-counted: 5
  pressure:
    enabled: true
    outgoing-multiplier: 1.25
    pulse-damage: 2.0
    pulse-interval-seconds: 20
    pulse-hot-seconds: 30
    ramp-per-minute: 0.06
    ramp-max: 2.0
    # 0.3.7: the pulse honors TrainingWheels - a protected
    # player's pulse is scaled by their shield factor (the
    # pulse is source-less MAGIC damage, so TrainingWheels'
    # own listener never sees it; BossTrial applies the

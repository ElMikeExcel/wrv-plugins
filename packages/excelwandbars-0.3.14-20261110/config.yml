# ExcelWandBars 0.2.7 (Wink Reyes Valley). Separate plugin; Magic (elmakers)
# files are not changed. EliteMobs (MagmaGuy) is not touched.

# 0.2.0: wand controls are a per-player choice. Everyone gets the default
# (classic) until they pick Spell bars with /wandstyle (form on Bedrock,
# clickable chat on Java, also a button at the bottom of /spellinfo).
# The choice is saved in styles.yml and put back on the held rank wand on
# join, when a wand is held or re-issued, on respawn and after every Magic
# load (seal stage applies). Only keys that differ are written to the wand.
# 0.2.1: the two styles are now called Classic and Sneak bars. Sneak bars is
# for Bedrock players only (phone, tablet, console via Geyser/Floodgate).
# Java players always get Classic and /wandstyle shows them Classic only.
# Bedrock players pick with /wandstyle (a form) or the "Wand controls"
# button in the compass menu (ExcelBedrockMenu 1.5.18).
wand-style:
  enabled: true
  # true = Sneak bars only for Bedrock players. A Java player with "bars"
  # saved from 0.2.0 gets Classic put back on their wand (choice kept in
  # styles.yml, used again if they join from Bedrock).
  bars-bedrock-only: true
  # 0.2.5 (Java/Bedrock parity): Sneak bars is offered to Java players too.
  # A new key, so a config.yml from 0.2.4 or older (bars-bedrock-only: true)
  # still gets it. Set false to keep Sneak bars Bedrock only again.
  sneak-bars-java: true
  # classic = chest mode: right click next spell, sneak + right click spell
  # list, Q back one spell. bars = inventory mode + quick cast.
  # 0.2.3: cycle = chest mode, just cycling: right click next spell, sneak +
  # right click / Q / sneak + Q back one spell, no spell list from the wand
  # (/spellbook still works). For Java and Bedrock. Picked with /wandstyle cycle
  # or the third button in the Wand controls form.
  # 0.2.4: original = the first wand setup (Oct 17 2026 Phase 1 wands.yml):
  # inventory mode, picking a hotbar spell icon makes it the active spell,
  # left click (phone: press and hold) casts. 0.2.6: original uses Magic's
  # quick_cast "manual" (a tap only picks, for every spell) and right_click
  # "none" (ExcelWandBars handles it: Java opens / puts items back, phone press
  # and hold casts the picked spell once). tapbar = Tap bar, best on a
  # phone: inventory mode + quick cast, picking a hotbar spell icon casts it
  # at once. Both are for Java and Bedrock (see tap-bar below).
  # 0.2.3 and older do not know these two keys and use Classic for them.
  default: classic
  # 0.2.5: every unlocked spell on the hotbar (Sneak bars, Tap to pick (original),
  # Tap bar). The wand's spells are packed in their current order, with enough
  # pages for all of them; crouch flips the page ("Page 1/2" on the action bar).
  # Tap bar / original: 7 spells per page, the 8th slot stays empty so a phone
  # player can always tap it to get their items back. Sneak bars: 8 per page.
  # Chest styles (Classic, Cycle) are not touched.
  pages:
    enabled: true
    tap-bar-per-page: 7
    sneak-bars-per-page: 8
  # Only wands whose template inherits this one are touched (the rank wands).
  rank-wand-inherits: base_wand
  # Never touched even if they inherit base_wand (the builder wand keeps its own controls).
  exclude-templates:
    - masons
  # Optional per-key overrides of the two control sets. Leave commented to use
  # the built-in sets (same as the WRV-150 chest set and the action-bar set).
  #controls:
  #  classic:
  #    right_click_sneak: toggle
  #  bars:
  #    right_click_sneak: cycle
  #  cycle:
  #    drop_sneak: toggle
  #  original:
  #    live_hotbar_mana: false
  #  tapbar:
  #    left_click: none   (0.2.5 default: press and hold / left click never casts)
  #    drop: none         (0.2.5 default: ExcelWandBars reads Q / a held slot)
  #    right_click: none  (0.2.5 default: ExcelWandBars handles it. Bedrock press
  #                        and hold reads, Java right click opens / items back)

# 0.2.4: Tap bar and Tap to cycle (original). Magic (elmakers) keeps your real
# hotbar stored while the spell icons are up and puts it back on close, death,
# quit and world change; this section only decides WHEN the bar opens/closes.
# Closing always uses Magic's own close (items restored), nothing is deleted.
tap-bar:
  # Picking the wand in the hotbar opens the spell bar (Bedrock touch sends
  # nothing for a tap on air, so Magic's right click opener can't fire there).
  open-on-hold: true
  # While the bar is up, tapping an empty slot puts your items back and
  # selects that slot.
  empty-slot-closes: true
  # The bar puts your items back by itself after this many seconds with no
  # spell or slot tap. 0 = never (then: press and hold the wand, or Q / right click).
  close-after-idle-seconds: 15
  # Put the items back before a chest, furnace, villager or other inventory opens.
  close-before-other-inventory: true
  # Tap bar only: explicit hotbar slot-hold/drop may read spell information.
  # World swings and air/block taps never open Book (they are not reliable hold signals).
  # Use the server-menu Spell Book or /spellbook; world-use still opens a closed bar.
  hold-shows-info: true
  # Swings closer together than this are one hold (a held finger repeats).
  hold-gap-ms: 700
  # How long the last tapped icon counts as "the spell you are holding".
  info-remembers-tap-seconds: 30
  # Tap bar only, the spell icons' name and lore:
  #   spellbook = the same lines as the press and hold page and /spellinfo
  #   magic     = keep Magic's own icon text, add the "Next rank" line
  #   off       = Magic's own icon text only
  # Refreshed when the bar opens and after each cast.
  icon-lore: spellbook
  # 0.2.5: a press and hold (or Q / a phone's press and hold on a hotbar slot)
  # within this many ms after tapping a spell icon reads THAT spell. Later, a
  # world tap/hold never opens Book; use the menu for all spells.
  hold-reads-tap-ms: 1500
  # 0.2.5: Tap bar stays up while you hold the wand (close-after-idle-seconds
  # is only for Tap to pick (original)). Items back: tap the empty slot at the
  # end of the bar, Q / press and hold the wand slot, or switch away.
  tap-bar-stays-open: true
  # 0.2.7: Tap bar, tapping the wand itself (the slot already selected).
  #   toggle = bar up: your items come back; bar down: the bar opens
  #   close  = only puts your items back
  #   off    = nothing (items back: the empty slot next to the wand, or press and hold the wand slot)
  # Bedrock only: Geyser does not pass this tap on to the server, so ExcelWandBars reads it
  # inside Geyser. A Java client sends nothing when you press the key of the slot you are on
  # (Java: Q or right click puts your items back). Not in this file = toggle.
  tap-wand: toggle
  # A phone may re-send the selected slot right after the server changes the hotbar (bar
  # opened, wand moved, spell cast, page flipped). Anything this soon after is not a tap.
  tap-wand-guard-ms: 700
  # 0.3.5: crouch and press and hold ON AIR opens the Spell Book (Tap bar). Qualified on
  # the client's real signals (crouch first, then hold use on air); the old protocol gate
  # stays as a fast path. A qualified hold whose form cannot open falls back to the chat
  # book, then to one visible line. Set book-hold: false to turn the gesture off.
  book-hold: true
  # How long the hold must last (ms). 400 = the same window the protocol gate used.
  book-hold-ms: 400
  # Also arm the gesture for Java players (default off: Java opens the book from the menu).
  book-hold-java: false
  # 0.3.5: Arrange mode. /spellbar arrange (or the bar menu button) arms it: with the bar
  # up in your inventory screen, drag a spell off the bottom row (Bedrock: tap it, then tap
  # below the row) to take it off your bar; drop it on another bottom-row slot to move it.
  arrange-enabled: true
  # Arrange turns itself off after this many seconds.
  arrange-timeout-seconds: 90
  # 0.3.5: in that same screen, a Bedrock player who taps a spell icon and commits nothing
  # for this long gets the spell's page (it never fades, unlike the tooltip).
  hold-read: true
  hold-read-ms: 800
  # 0.3.6: dragging spell icons in that screen WITHOUT Arrange never saved the
  # order (the bar is re-drawn from the saved bar on the next wand draw), but
  # the drag looked like it worked. With this on, an unarmed drag or click on
  # a spell icon is stopped where it is, and one short line per screen visit
  # points at the path that does save: /spellbar, then Arrange by dragging.
  # 0.3.7: this gate only runs while drag-write (below) is off — with
  # drag-write on, those drags save for real and there is nothing to signpost.
  drag-signpost: true
  # 0.3.6: items other plugins give you (a reward, a pickup, a trade) can land
  # in the spell bar's always-empty exit slot while the bar is up, because
  # item gives are not clicks and the exit guards only police clicks. With
  # this on, opening the bar first moves any non-spell item sitting in the
  # bar into your inventory (the wand's stored inventory when there is one).
  # An item that does not fit stays exactly where it is; nothing is deleted.
  # 0.3.12: the sweep now also runs WHILE the bar is open (a pickup or a
  # give mid-combat is moved into the wand's stored inventory within a
  # few ticks, and before any page flip saves the bar), and clicks,
  # shift-clicks and drags can no longer place a non-spell item into the
  # open bar at all. The relocations ride this switch; the entry blocks
  # are guards and always apply while a Tap bar is open.
  exit-sweep: true
  # 0.3.7: how a spell's place on the bar is written wherever WandBars names
  # it (Spell Book, picker, result lines, drag confirmations). Every row is a
  # bar and every position in it is a slot, and both are always named. The
  # placeholders are {bar} and {slot}, both counted from 1.
  position-format: "Bar {bar} · Slot {slot}"
  # 0.3.7: plain drags write the bar. With the wand drawn and the bar up in
  # your inventory screen, dragging or carrying a spell icon (from the bar
  # row, your inventory, or the all-spells pages) onto a bar slot puts it
  # there and saves at once; dragging one off the row takes it off the bar
  # (the spell stays learned). Arrange mode is unchanged and still there.
  drag-write:
    # The kill switch. False restores the 0.3.6 behavior exactly (drags are
    # stopped and the signpost above points at Arrange).
    enabled: true
    # One short action-bar line confirms each saved drag (the spell and its
    # new bar and slot). False = drags save silently.
    confirm: true
    # Confirmations are throttled to at most one per this many ms, however
    # fast the drags land. 0 = every saved drag confirms.
    confirm-gap-ms: 1200
  # 0.3.8: pager buttons in the spell inventory. While the bar is up in your
  # inventory screen, the last two slots of the grid's bottom row (bottom
  # right) are Back page / Next page buttons; the Next page button shows
  # "Page X of Y". Tapping one flips the page (same wraparound as the wand
  # click, which still works). The buttons can never be picked up, dragged
  # or written over a spell, they are swept away when the bar closes, and a
  # real item sitting in one of those two slots is never overwritten (that
  # button just does not appear). The cost is those two grid slots while
  # the bar is up. Set enabled: false to turn the buttons off.
  pager-buttons:
    enabled: true
    # 0.3.9: what the buttons page. "auto" follows the paging you last
    # used in this screen — flip a hotbar page and they page the bar,
    # turn the spell list (wand click) and they page the list. "bar" pins
    # them to hotbar pages (the 0.3.8 behavior); "list" pins them to the
    # spell list's own pages.
    # 0.3.12: the default is now "list" — here, and in code when this
    # section is missing or the key is unset (the 0.3.9 code default of
    # "auto" started every fresh open on the hotbar, in the screen that
    # shows the spell list). "auto" also starts on the list now. The
    # button's label always names the page it turns: "List page X of Y"
    # or "Hotbar page X of Y".
    page-target: list
    # 0.3.9: on a full spell-list page the two button slots hold spell
    # icons. With this on (default), a button covers its icon while that
    # page is on screen; the icon comes back when the button leaves and
    # the wand's paint is rebuilt from its spell list, so no spell is ever
    # lost by being covered. With this off, a covered button just does not
    # appear (the 0.3.8 behavior). Items that are not spell icons are never
    # covered either way.
    displace-icons: true
    # 0.3.9: leaked-button cleanup. In 0.3.8 a button still on screen when
    # Magic saved the open inventory could be handed into your real
    # inventory as an item. Buttons are now swept before every save, and
    # with this on (default) any item carrying the pager mark found in a
    # real inventory (or the wand's stored inventory) is removed on sight.
    # Only marked items are ever removed; the slot is left empty.
    cleanup-leaks: true
  # 0.3.8: joining starts on your items. If the spell bar was open when you
  # logged out, Magic restores it open at the next join and you land in wand
  # mode — with the menu compass other plugins hand out able to sit in the
  # slot the tap exit needs. With this on, a bar found open within the join
  # grace window, before you have picked a slot or opened anything yourself,
  # is closed for you (your real items come back) so a join always lands on
  # the normal hotbar. Set false to restore the old behavior.
  join-starts-on-items: true
  # How long after a join the guard above watches, in ms (2000-30000).
  join-grace-ms: 8000

# 0.2.7: the rank wand lives in the last hotbar slot. Moving it is ONE swap: the wand goes to
# the slot, and whatever was there (an item, a stack or nothing) goes to the wand's old slot.
# Nothing is dropped, deleted or copied. Never while the spell bar is up, a chest or other
# screen is open, an item is on the cursor, within quiet-after-click-ms of an inventory click,
# when dead, in spectator or creative, or in a skip world. If you hold the item in the last
# slot, it waits until you pick something else (your hand never changes under you).
# Picking the wand in another slot moves it and selects the last slot. Hotbar only: a wand
# in the main inventory stays where it is. Not in this file = these defaults.
wand-slot:
  enabled: true
  # 1-9, like the hotbar keys.
  slot: 9
  # The styles that keep the wand in that slot (classic, bars, cycle, original, tapbar).
  styles:
    - tapbar
    - original
  quiet-after-click-ms: 3000
  sweep-ticks: 20

sneak-flip:
  # Only for players on the Sneak bars style (Bedrock); classic players never flip.
  # A sneak PRESS (not the release) while holding a Magic wand whose spell bar
  # is open flips to the next bar: 1, 2, 3, back to 1. The bar stays where it
  # is when you stop sneaking, so you never have to keep sneaking.
  enabled: true
  # Ignore a second press within this many milliseconds (double events).
  debounce-ms: 250
  # Sneak also means "get out of the boat", "swim down", "stop gliding" and
  # "fly down", so those never flip bars.
  skip-in-vehicle: true
  skip-swimming: true
  skip-gliding: true
  skip-flying: true
  # One short action-bar line after a flip, e.g. "Bar 2/3: Boon, Feed".
  # Sent once (not repeated), so ExcelAttunement's stance line wins on its next update.
  show-bar-line: true

spell-book:
  # /spellinfo: Bedrock gets a form (tap a spell for full details), Java gets
  # chat lines with hover details. Read only. 0.2.1: works without holding
  # the wand (reads the first usable wand in the inventory), so the compass
  # menu Spellbook button works while the compass is in hand.
  enabled: true
  # 0.3.0: organized Spell Book. Home screen with a button per group (from
  # spellbook.yml), All A to Z, and Put spells on my bar. Group pages: Java
  # chat 10 per page, Bedrock forms 12 per page. false = the 0.2.9 flat list.
  # Missing = true. /wandbars reload, no restart.
  groups: true
  # 0.3.0: also show spells a higher wand rank gets (grey, "unlocks at
  # Apprentice"). Only spells already on the rank wands, so only seals that
  # are broken (no spoilers). Missing = true.
  show-locked: true

wand-tip:
  # 0.2.1 onboarding tip: on each of a player's first max-uses wand uses
  # (left or right click with a Magic wand) a short chat tip explains the two
  # wand styles, until they say OK. Java: click [OK] in chat. Bedrock: tap
  # OK on a pop-up (at most once per session, never right after a hit) or
  # type /wandstyle ok. Picking a style also counts as OK. Progress is saved
  # in tips.yml. Clicks closer than use-gap-ms count as one use.
  enabled: true
  max-uses: 15
  use-gap-ms: 2000
  bedrock-popup-combat-quiet-ms: 10000

spell-screen:
  # 0.2.2: Bedrock players on Classic controls (Magic chest mode): crouch and
  # press and hold (or crouch + LT) opens the Spell Book form instead of
  # Magic's chest spell list (Geyser showed that chest with a row of barrier
  # blocks). Tap a spell, then "Use this spell" to make it the wand's spell.
  # Java players and Sneak bars are never changed. If the form can't be sent,
  # Magic's chest opens as before.
  bedrock-form: true
  # A second open request within this many ms (same press twice) is ignored.
  debounce-ms: 600

spell-info:
  # Spell info 2026-10-26. The Spell Book / press and hold screen now shows what
  # each spell really does (hearts, effects, who, radius), worked out from
  # Magic's spells.yml, plus what the next rank changes. These lines are the
  # only typed text: how a player reaches each wand rank. Shown as
  # "How to reach Student rank:" on every spell and in the Spell Book header.
  # {rank} = the rank name. Empty text ('') hides the line. Keep it short
  # (phones), no em dashes, and never mention seals.
  # Change with /wandbars reload (no restart).
  rank-up:
    # Rank-up by casting (2026-10-26): with rank-up-casting on, wand ranks are
    # earned by casting. The numbers (Student: 340/800 SP) show at the top of
    # the Spell Book; this line sits under each spell.
    default: "Cast spells to earn SP. Your SP is at the top of your Spell Book."
    # Older text (before rank-up by casting):
    # default: "{rank} rank is not open yet. Watch What's New."

rank-up-casting:
  # Rank-up by casting (2026-10-26). Successful casts with a rank wand
  # (Beginner, Student, Apprentice, Master) earn SP, Magic's own spell points.
  # Each spell pays its own "earns" from Magic's spells.yml. When you have
  # enough SP your wand moves up a rank in place (same wand, keeps every
  # spell, learns the new rank's spells). The rank wands stay pathless with
  # earn_multiplier 0 in Magic, so Magic never pays twice for a cast.
  # All of this section changes with /wandbars reload (no restart).
  # 0.2.8 ships ON (Mike, Oct 26, 2026). Off switch: enabled: false + /wandbars reload.
  enabled: true
  # SP to step UP into each rank. SP is spent on the step (it restarts at 0).
  sp-to-reach:
    student: 800
    apprentice: 1600
    master: 1800
  # Same throttle Magic uses for path earning: a spell pays its full earns
  # once per this many seconds; cast again sooner and it pays the part that
  # has recharged (rounded down, often 0). Stops spam (Mend has no cooldown).
  earn-cooldown-seconds: 60
  earn-cooldown-by-spell: {}
  #   mend: 90
  # These spells only pay when Magic really healed someone during the cast
  # (no SP for healing yourself or a friend at full health).
  heal-only-when-it-heals: [heal, mend, flashheal, greaterheal]
  # Daily soft cap (America/Chicago day). Full rate up to full-rate-sp, then
  # slow-rate until max-sp, then nothing until tomorrow. 0 = off.
  daily:
    full-rate-sp: 800
    max-sp: 1600
    slow-rate: 0.25
  # The server's own XP bonuses also boost SP (one source of truth: the
  # plugins that already run them). weekend = mcMMO's /xprate event, which
  # ExcelWeekendXP turns on Fri-Sun (1.2x); an admin /xprate event counts too.
  # group = ExcelTogether's party bonus (its multiplier and radius) when a
  # party member is near. Multiplied together, then capped.
  bonus:
    weekend: true
    group: true
    cap: 1.5
    # Only if mcMMO is not running: Fri-Sun Chicago time pays this.
    weekend-if-no-mcmmo: 1.2
  # Off on purpose (Mike, Oct 26, 2026): seals decide which spells exist, never which
  # rank a wand may reach. Only if that ever changes: lowest ExcelMagicGate stage per rank,
  # e.g. "apprentice: 2"; the Spell Book then says "<rank> rank is not open yet."
  max-rank-by-stage: {}
  # After a cast that pays SP: "+2 SP (x1.2 weekend) | Beginner 340/800".
  action-bar: true
  # ExcelTogether's party lines share the action bar. If one went up less than this many ms
  # ago, the SP line waits until it has been readable (at most 3 waits, then it is skipped).
  party-bar-wait-ms: 2500
  announce:
    title: true
    chat: true
    sound: true
    # Tell everyone else online in chat, by nickname (Mike, Oct 26, 2026: rank-ups are
    # celebrated by the whole server). The player gets the title, sound and own chat line.
    broadcast: true
  text:
    title: "{rank} rank!"
    subtitle: "Your wand learned {spells} new spells"
    chat: "Your wand is now {rank} rank. It learned {spells} new spells. Open /spellbook to read them."
    broadcast: "{player} reached {rank} rank!"   # {player} = nickname if set
    how: "Cast spells to earn SP."

# 0.2.8: rank names players see (Spell Book, spell info, titles, chat). Magic's own
# template and path keys never change. Missing section = master shows as "Master".
rank-names:
  beginner: Beginner
  student: Student
  apprentice: Apprentice
  master: Master

progress-line:
  # 0.2.2: after a successful cast, one short action-bar line shows the
  # spell's progress, e.g. "Boon: 12/40 casts to Rank 2". Sent once, never
  # repeated. The XP bar (mana) is not touched.
  # Only shown where casting really counts toward the next rank: Magic ranks
  # a spell up by casts only on a wand with a Magic path. WRV's rank wands
  # have no path (and Magic's default_wand_path is empty), so with today's
  # Magic config no line shows and the Spell Book says the next rank comes
  # with the next wand rank. If the wands ever get a path, the line works
  # with no change here.
  enabled: true
  # At most one line per player this often (a rank-up, or the cast that
  # fills the count, always shows).
  min-gap-seconds: 4
  # While an ExcelAttunement stance countdown is on, no progress line (so the
  # stance line is never covered). The Spell Book still shows the progress.
  skip-during-stance: true

spell-tip:
  # 0.2.2 first-use tip for the Spell Book screen and the progress line.
  # Repeats until the player says OK: Java [OK] in chat, the OK button inside
  # the Bedrock Spell Book, or /spellbook ok. At most once per show-gap.
  # If ExcelTips is running, the tip is handed to it (tip name "spellscreen")
  # and this plugin does not show its own copy, so nobody sees it twice.
  enabled: true
  # 0 = until OK (Mike's rule).
  max-shows: 0
  show-gap-seconds: 60

# Belt and braces: never flip in these worlds (Magic is already off there
# through ExcelAttunement's guild ward, so the wand bar cannot be open).
skip-worlds:
  - em_adventurers_guild
  - GoblinKingdom_vf
skip-world-prefixes:
  - em_

debug: false

compass-guard:
  # While the Magic wand bar is open your real inventory is stored away, so a
  # menu compass given then cannot see the one you already have, and the two
  # stack when the bar closes. With this on, a few ticks after the bar can
  # close (and after join or respawn), extra menu compasses are trimmed to
  # exactly one. Never gives items; only removes extra copies of the tagged compass.
  enabled: true
  keys:
    - menujoin:menu_compass
    - excelmenujoin:menu_compass

# 0.2.9: each player's own spell bar (Tap bar, Tap to pick (original), Sneak bars).
# Every player picks which spells sit on their bar. New spells (rank up, a new wand)
# go into the first empty slots with a short chat line, or into the Spellbook when the
# bar is full. Change it from the Spellbook (Put on my bar, Move, Take off) or /spellbar.
# Saved per player in plugins/ExcelWandBars/loadouts.yml (server data, not in this file).
# On a player's first load the bar is filled from their wand's current order (first slots).
# enabled: false = the 0.2.8 behaviour (every spell on the bar in pages of 7).
# A missing section counts as enabled: true with these defaults. Reload: /wandbars reload.
bar-loadout:
  enabled: true
  # 21 = 3 pages of 7 in Tap bar (8 + 8 + 5 in Sneak bars). 1 to 64.
  slots: 21
  # "New spell: X added to your bar" / "New spell: X is in your Spellbook".
  new-spell-lines: true
  # More new spells at once than this: one "N more new spells" line instead.
  max-new-spell-lines: 3
  # 0.3.5: the Spell Book's New spells tab. Each unlock is badged there until the player
  # places the spell or taps Got it; reading or removing never clears the badge.
  new-tab: true


# 0.3.10: the name-tag cooldown countdown. Magic writes each hotbar spell
# icon's stack number as the seconds until the spell can be cast again,
# capped at 99 — and Bedrock (Geyser) shows any number over 64 as just 64,
# so a long cooldown reads "64" for most of its life. While a spell's true
# time left is over the threshold below, its icon's name carries the real
# countdown instead: "Familiar · 3:24", ticking down each second. At or
# under the threshold the name stays exactly as painted and the number
# does the talking; when the spell can be cast again the name is plain.
# The countdown is painted on the screen copy of the icon only — it is
# taken off before anything is saved and cleaned up if it is ever found
# anywhere else, so it can never end up in a stored inventory.
# Change with /wandbars reload (no restart).
cooldown-name-tag:
  enabled: true
  # 0.3.13 accuracy mode (default): the name countdown shows the spell's
  # TRUE remaining cooldown — the same value Magic's "wait" reminder
  # reports — and appears whenever the number on the icon cannot be
  # trusted to show it (the number tracks a different wait, like mana
  # refill, or the cooldown is longer than the number can display:
  # over 99 on Java, over 64 on Bedrock). When the number already IS
  # the cooldown, no tag is added. Set false to restore the 0.3.10
  # behavior below exactly.
  accuracy: true
  # Seconds (legacy mode only, accuracy: false). A spell whose true
  # time-to-cast is over this gets the name countdown; at or under it,
  # only Magic's number shows. 60 keeps the tag for exactly the range
  # the number cannot show truthfully on Bedrock (over 64) plus the top
  # of Java's range (over 99 is covered too, since the tag follows the
  # true time, not the capped number).
  threshold-seconds: 60

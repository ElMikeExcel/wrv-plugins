# Prototype: stage with the deployed economy, claims and Java/Bedrock clients first.
# When true, GriefPrevention must be enabled and its ownership API readable.
require-grief-prevention: true
quote-seconds: 60
# Maximum offers the spawn catalog may hold. Offers live only in
# spawn-catalog.yml; raising this never invents stock.
max-catalog-offers: 250
# Native Bedrock number entry/review. All callback actions re-enter the server thread.
bedrock-forms: true
# Menu-compass shortcut: tapping your own shop's sign with the server-menu
# compass opens Manage, and tapping a sign on your own non-shop chest offers
# shop setup, instead of opening the server menu.
compass-shop-shortcut: true
# Append every completed ExcelShops purchase to purchases.csv (market-trend history).
# Evidence only; checkout/transactions.log stays the reconciliation journal.
purchase-log: true

# Experimental session proof and narrowly verified no-activity recovery. Both default OFF; deployment approval required.
session-proof-enabled: false
no-activity-auto-recovery: false

# Special products (ExcelItems registry, M4). Each listing names the
# permanent registry ID it sells; the item's name and lore come from
# the registry definition for that ID. Price stays a SHOP fact here
# (never part of the item definition). Delivery is the owning
# plugin's console command template; %player_name% is the buyer.
# Adding an already-registered item to the shop is a config change
# only: one listing here plus the matching menu entry. When this
# section is present it is complete and authoritative; when absent,
# the bundled special-products.yml in the jar is used instead.
special-products:
  veil_potion:
    category: potions_protection
    excelitems_id: 1
    price: '2000.00'
    delivery: 'mobveil buy %player_name%'
    owner: ExcelMobVeil
  deathprotection_basic:
    category: potions_protection
    excelitems_id: 2
    price: '15000.00'
    delivery: 'deathprotection buy basic %player_name%'
    owner: ExcelDeathProtection
  deathpotion:
    category: potions_protection
    excelitems_id: 3
    price: '30000.00'
    delivery: 'deathprotection buy premium %player_name%'
    owner: ExcelDeathProtection
  revive_potion:
    category: potions_protection
    excelitems_id: 4
    price: '5000.00'
    delivery: 'downed revivepotion buy %player_name%'
    owner: ExcelDowned

  - id: 2026-11-13-excelskillspanel-magic-line-gold-bars-descriptions
    date: Nov 13
    posted: '2026-11-13'
    title: 'Update: perk descriptions and gold bars in the Skills panel'
    changes:
      - 'Every perk in your Skills panel now explains itself: open any skill in /skillpanel and each perk in its ladder has a short line under its name saying what it does, in the game''s own words. All 19 skills, all 82 perks, earned and locked alike. In Taming, for example, Beast Lore reads "Bone-whacking inspects wolves & ocelots" and Call of the Wild reads "Summon an animal to your side".'
      - 'Every progress bar in the panel is easier to read: the filled part of each bar is now gold, on computer and on phone, tablet and console alike. The empty part stays gray, and the numbers and percents did not change.'
      - 'The Magic block at the top of the panel no longer has its own line that just says Magic. Its Magic Level line now titles the block, and Rank, Class and the next rank, mana, boosts, casts and Guild seals still follow exactly once, exactly as before.'
      - 'Nothing about your levels, XP, perks, unlock levels or ranks changed. The panel only shows more of what was already true. A skill whose live settings stop matching its checked ladder still falls back to the website pointer for that skill alone, showing neither ladder nor descriptions, and the website Skill Trees page still carries the perk descriptions too.'

  - id: 2026-11-13-excelskillspanel-perk-ladders
    date: Nov 13
    posted: '2026-11-13'
    title: 'Update: perk ladders inside the Skills panel'
    changes:
      - 'Open any skill in your Skills panel (/skillpanel) and its detail now shows its full perk ladder right in the panel: one line per perk with the level it unlocks at, whether you have earned it yet, and your current rank on perks that keep ranking up. All 19 skills have their ladder, 82 perks in total. On a computer the lines are in the skill detail; on phone, tablet and console the same lines are in the skill form.'
      - 'Each ladder is checked against the server''s live skill settings every time the panel opens. If a skill''s live settings ever stop matching the checked ladder, that one skill goes back to pointing at the website instead of showing numbers that might be wrong.'
      - 'Salvage and Smelting show their ladders too, under their usual note: their level comes from their parent skills and they earn no XP of their own, so they still have no progress bar. Smelting lists Second Smelt, Fuel Efficiency and Understanding the Art.'
      - 'Nothing about your levels, XP, perks or unlock levels changed. The panel only shows more of what was already true. The full perk descriptions stay on the website Skill Trees page.'

  - id: 2026-11-13-excelskillspanel
    date: Nov 13
    posted: '2026-11-13'
    title: 'New: one Skills panel for skills and magic'
    new-commands:
      - cmd: /skillpanel
        what: 'Open your Skills panel: your Power Level and Magic header, plus every skill with its level and XP progress.'
    changes:
      - 'The panel opens with your character header: Power Level (all your mcMMO skill levels added together), then your Magic block: Magic Level and XP with its progress bar, your Rank and Class and the next rank, your mana and how fast it comes back, your casting boosts, your total casts, and Guild seals broken out of 5.'
      - 'Under the header, every mcMMO skill is listed with its level and an XP progress bar with a percent, so you can see how close each skill is to its next level. Open a skill for its detail: XP into the level, XP still to go, and its rank when it has one. Salvage and Smelting are child skills: they show a level only, with no bar, because their levels come from their parent skills and they earn no XP of their own.'
      - 'On a computer the panel is a chest menu. On phone, tablet and console it is a form showing the same header and skill lines, with a button for each skill, and if the form cannot open the same lines print in chat. Nothing about your skills, magic, mana or ranks changed: the panel only shows the same numbers /mcstats and /magiclevel already show, in one place.'
      - 'The compass Skills & Perks button now opens the Skills panel (/skillpanel). The older skills menu still exists, with the perk ladders in brief, but the button no longer opens it. The full perk ladders are still on the website Skill Trees page, and each skill detail in the panel points there.'


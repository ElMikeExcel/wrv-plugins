  - id: 2026-11-15-excelprotect-0111
    date: Nov 15
    posted: '2026-11-15'
    title: 'Staff records: blocked block attempts in guild worlds are now logged as evidence'
    changes:
      - 'ExcelProtect 0.1.11 is in place (November 15, 2026). In EliteMobs worlds - the guild hall, Primis and its instances - when a block break or place is blocked and the block does not change, staff now keep a record of the attempt as evidence.'
      - 'Each record names the player, the position, whether it was a break or a place, and the block involved. Repeated attempts at the same spot within about 2 seconds fold into one record with a count, so one player punching one protected block does not flood the log.'
      - 'Attempt records are staff evidence only. They sit on their own attempts record stream, separate from the normal block-change records, they hold no before-and-after block state, and they are never used to roll anything back - an attempt changed no block.'
      - 'Staff read them back with the tools they already have: /excelprotect export with stream=attempts, the attempts section of /excelprotect inspect for a player, and /excelprotect inspect at a position. There is no new command.'
      - 'There is no player viewer for attempt records and none is promised here: if you try to break or place a block in a guild world and it does not work, that is the protection doing its job, exactly as before. Nothing about normal building, claims or block changes anywhere else changed.'

  - id: 2026-11-15-excelsummons-0113
    date: Nov 15
    posted: '2026-11-15'
    title: 'Summons hold more mana: bigger holds, one elite at a time'
    changes:
      - 'Cast summons now hold more of your mana while they are out: the holds rose by a quarter.'
      - 'Combat holds: Archer 25%, Bruiser 31%, Guardian 44%, Revenant 38%, Ghast 44%.'
      - 'Companion holds: Wolf 19%, Familiar 13%, Cat 13%, Mount 19%. Adopted pets still hold none.'
      - 'The shared limits did not move: cast summons together hold at most 75% of your pool, and at least 20% always stays usable.'
      - 'You can now field only one elite at a time: a Guardian and a Ghast together would hold 88%, so the second elite cast is refused.'
      - 'A wolf pack caps at 3 mana-holding wolves (57% together): a fresh 4th wolf cast is refused, and dismissing one lets you cast again.'
      - 'Exact fits are still legal: Archer + Bruiser + Wolf holds exactly 75%, and Guardian + Bruiser holds exactly 75%.'

  - id: 2026-11-15-primis-starter-adventure
    date: Nov 15
    posted: '2026-11-15'
    title: 'New: Primis is open: the starter adventure (levels 0 to 20)'
    changes:
      - 'Primis is open. Primis is the starter adventure of the guild era: a tutorial adventure for new players, made for levels 0 to 20, and rated Easy in its own pack notes. It is a massive map with quests, many bosses and NPCs, and custom models. It opened together with the Adventurers Guild hall as the opening wave of the expansion era, and Mike released it for everyone on November 15, 2026.'
      - 'Where to start: go to the Adventurers Guild hall first (type /ag). Primis is reached from the guild hub through the Primis wormhole, and it is also listed on the EliteMobs teleports page. You arrive in the world of Primis itself (in game it is called em_primis).'
      - 'What to do first: take the introduction quest when you arrive. It is the guild''s own Primis introduction, and it leads into Primis''s main quest chain. Follow the main quest and pick up the quests in each place you reach: the pack holds more than 100 quest files in all.'
      - 'Two instanced dungeons inside Primis are open now: the Wolf Den and the Lighthouse Keeper. You enter both from inside Primis (neither one is listed on the teleports page). Family players already ran both on the first night: feral wolves and their alpha in the Wolf Den, and the lighthouse keeper at the Farmstead lighthouse.'
      - 'Two more instanced pieces sit inside Primis, and you enter both from inside Primis (neither one is listed on the teleports page). The Blood Temple is a sanctum for level 20: the Fire Elemental awaits there, and it opens later in the main quest chain. Gladius Invasion is a dungeon for levels 1 to 20: it is time to take Gladius back. Its three difficulties sync your level down (18 on normal, 15 on hard, 12 on mythic).'
      - 'Getting around inside Primis: griffin flights run between the lighthouses on the pack''s own flight network, and wormholes link the places inside the map. The flights ride on FreeMinecraftModels, which is already installed on the server. Still to check in game: one griffin flight or a walked route between zones, and the Blood Temple or Gladius entry opening. First entry into Primis and the introduction quest are already proven in game.'


  - id: 2026-11-14-excelelitemobsabilitybedrockbridge-rename
    date: Nov 14
    posted: '2026-11-14'
    title: 'Update: the Bedrock ability bridge has a clearer name'
    changes:
      - 'The Bedrock ability bridge has a new name: it is now called ExcelEliteMobsAbilityBedrockBridge (it was ExcelAbilityBridge). The new name says what it does: it gives Bedrock players their EliteMobs class abilities.'
      - 'Nothing you tap changes. Type /abilities (or /classabilities) exactly as before to open the ability form on phone, tablet and console, and your class abilities fire the same way.'

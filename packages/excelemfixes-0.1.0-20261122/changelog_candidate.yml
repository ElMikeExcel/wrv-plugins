  - id: 2026-11-12-excelmenu-toggles-section
    date: Nov 12
    posted: '2026-11-12'
    title: 'New: a Toggles section on your compass menu'
    changes:
      - 'All your on/off switches now live in their own Toggles section on the compass menu: Auto-sort, Silk Touch Warnings, Aim Assist and Auto-open on join sit together under the Toggles header.'
      - 'Settings is shorter now: it keeps only the Maker''s Mark and Details pages. On phone and console the order at the end of the menu is the same: the Settings pages first, then the Toggles, then Chest Tools.'
      - 'Nothing about how any switch works has changed: each one turns on and off exactly as before, and the typed commands still work.'

  - id: 2026-11-12-excelwandbars-bedrock-tap-bar-fixed
    date: Nov 12
    posted: '2026-11-12'
    title: 'Fixed: the spell bar opens again on Bedrock'
    changes:
      - 'On phone, tablet and console, tapping your wand to open the spell bar could quietly close it again instead, so the bar never came up. That is fixed: the tap bar opens again.'
      - 'The bar now uses the spell pages your Magic path really gives you: Student wands get 2 full pages of spells plus the spell book, and Master wands get all 3 pages on their own. Your spells, your ranks and your costs do not change.'

  - id: 2026-11-12-excelsummons-compass-summons-page
    date: Nov 12
    posted: '2026-11-12'
    title: 'New: a Summons page on your compass'
    new-commands:
      - cmd: /summons menu
        what: 'Open the Summons page: your cast summons, how much mana they hold in total, and dismiss buttons.'
        bedrock: 'Or tap My Summons on the compass.'
        java: 'Or click My Summons in the compass menu.'
    changes:
      - 'The main page shows only the summons you cast, the total mana they hold, and the same dismiss choices as the typed commands: mount, pets or all.'
      - 'Adopted pets have their own page: tap the Adopted pets button to see them, each one marked ADOPTED, holds no mana and protected. The mana rules from 0.1.6 do not change.'
      - 'One adopted pet can be dismissed only from that page, one at a time, behind a confirm step that names the pet and warns it permanently removes the real tamed or bred animal. There is no dismiss-all for adopted pets, and typing /summons dismiss never touches adopted pets.'

  - id: 2026-11-12-excelsummons-adopted-pets-no-mana
    date: Nov 12
    posted: '2026-11-12'
    title: 'Your own tamed pets no longer hold mana'
    changes:
      - 'Pets you tamed or bred yourself — adopted pets — hold NO mana at all (ExcelSummons 0.1.6 ruling, November 12, 2026): only summons you cast hold mana. An adopted wolf, cat, familiar or mount never reduces your usable pool, no matter how many you keep.'
      - 'Summons you cast hold mana at the same rates as before: combat 10/15/25/20/25, summoned wolf 10, familiar 5, cat 5, mount 10. All cast summons together can hold at most 75% of your pool, and at least 20% always stays usable — that cap is enforced both when you cast and whenever your holds are re-checked at login.'
      - 'Adopted pets still count toward your summon limit. Everything else about summons works exactly as before: costs, the rank-scaled limit, dismiss and lifetimes are unchanged.'

  - id: 2026-11-12-excelmagicgate-dead-key-gate
    date: Nov 12
    posted: '2026-11-12'
    title: 'Operator note: a safety net for wands'
    changes:
      - 'Operator note only: nothing changes for players. Your wand, your spells, your ranks and every magic rule work exactly as before.'
      - 'ExcelMagicGate 0.3.2 adds a safety check when your wand syncs: a spell name that no longer exists is now skipped and named in the server log, instead of breaking the sync. Healthy wands see no change at all.'

  - id: 2026-11-12-exceltrainingdummy-training-dummies
    date: Nov 12
    posted: '2026-11-12'
    title: 'New: training dummies to test your damage'
    new-commands:
      - cmd: /dummy
        what: 'Open the Training Dummy menu: spawn 1, 3 or 5 dummies and test your damage.'
        bedrock: 'Or open your compass menu and tap Training Dummy.'
        java: 'Or open your compass menu and click Training Dummy.'
    changes:
      - 'Pick a health pool: Practice 1,000, Dungeon 5,000 or Seal 20,000, or Endless, where the pool refills lap after lap. As you hit the dummy, checkpoints print at each quarter of the pool, and a full report prints at the end: how long it took, your total damage and your average DPS, split by melee, spells, projectiles and summons.'
      - 'Try the extra settings on your own dummy: Boss Armor shows every number 1,000 times bigger, like a seal boss fight; Hazardous makes the dummy pulse damage back at you (Light, Medium or Intense) and stops at 1 HP unless you turn on Lethal; Execute starts the dummy at 25% health.'
      - 'Tap your own dummy while holding your compass to open its settings. Dummies never really die, so they give no XP, no loot and no boss credit. You can have up to 5 up at once, they vanish when you log out or leave them alone for 10 minutes, and they only spawn in the wilderness or in your own claim.'

  - id: 2026-11-12-exceldeathprotection-banked-credits
    date: Nov 12
    posted: '2026-11-12'
    title: 'Boss rewards can now bank Death Protection'
    changes:
      - 'Death Protection 0.2.0: a premium credit you earn, for example from a boss reward, is now banked for you. It is a balance, not an item: it cannot be lost, dropped or traded.'
      - 'If you have no protection active, the first credit turns on premium protection right away and any extra credits stay banked. If you already have protection, the whole credit banks. When a death uses up your protection, a banked credit turns premium protection back on by itself when you respawn.'
      - 'Check where you stand any time with /dp status: it now shows your banked premium credits when you have any. Buying works exactly as before: basic protection is $15,000 and the premium potion is $30,000 at the Spawn Shop.'

  - id: 2026-11-11-excelshops-console-admin
    date: Nov 11
    posted: '2026-11-11'
    title: 'Operator note: console help for shops'
    changes:
      - 'Operator note only: nothing changes for players. The Spawn Shop, player shops, prices and buying and selling work exactly as before.'
      - 'Staff can now check a player''s shops from the server console with /excelshopadmin status: the shops they own with every offer and price, their balance, and whether a checkout is pending.'
      - 'Staff can also reload the shop lists from the console with /excelshopadmin reload. The check only reads; it moves no money and changes no shop.'

  - id: 2026-11-11-lightning-second-strike-timing
    date: Nov 11
    posted: '2026-11-11'
    title: 'Lightning''s second strike lands a beat later'
    changes:
      - 'Lightning at its highest tier strikes twice. The second strike now follows a beat later, about a quarter of a second (250 ms) after the first, instead of both strikes landing at the same instant.'
      - 'This fixes the reported bug where the double strike landed all at once. You should now see two separate bolts, one right after the other.'
      - 'Damage is unchanged: each strike still hits for 27.5, the same 55 total across both strikes. The cooldown and everything else about the spell work exactly as before.'

  - id: 2026-11-11-excelmagicgate-wand-milestones
    date: Nov 11
    posted: '2026-11-11'
    title: 'Your wand now shows every rank milestone'
    changes:
      - 'Your wand lore now ends with the milestone numbers themselves: Student at 100 credited casts, Apprentice at 400 and Master at 2,000.'
      - 'Your lore already showed your credited cast count and how far you are from the next rank. Now the whole ladder sits in the same place, so you can see at a glance what you are aiming for.'
      - 'Nothing else changes: ranks, credited counts, the gap to the next rank and every other magic rule work exactly as before.'

  - id: 2026-11-11-excelsummons-archer-equipment
    date: Nov 11
    posted: '2026-11-11'
    title: 'Your archer arrives with its bow and helmet'
    changes:
      - 'Archers you summon now always arrive with their bow and the right helmet for their tier: an iron helmet at the base tier, chainmail at higher tiers.'
      - 'The bow and helmet are set and checked the moment the archer is summoned, so it can shoot right away. This fixes archers sometimes arriving with no bow at all.'
      - 'Nothing else about summons changes: costs, mana holds, your limit and lifetimes all work exactly as before.'

  - id: 2026-11-11-excelabilitybridge-console-admin
    date: Nov 11
    posted: '2026-11-11'
    title: 'Operator note: console help for ability bridge'
    changes:
      - 'Operator note only: nothing changes for players. The Bedrock ability form, the /abilities menu and your class abilities work exactly as before.'
      - 'Staff can now check the ability bridge from the server console with /abilities status: whether the EliteMobs link is up, whether the Geyser and floodgate link is ready for the Bedrock form, and whether debug logging for ability fires is on or off.'
      - 'The status form only reads the bridge''s state. It changes nothing, and there is no new player form to learn.'

  - id: 2026-11-11-excelrewardguard-console-admin
    date: Nov 11
    posted: '2026-11-11'
    title: 'Operator note: console help for reward guard'
    changes:
      - 'Operator note only: nothing changes for players. Farmed-kill scaling, normal hunting pay and your rewards work exactly as before.'
      - 'Staff can now check the reward guard from the server console with /rewardguard status: the Jobs and mcMMO farm rates, the boss band rate and whether its verdict feed is connected, the fall threshold, the seal-step state, and how many times the guard has stepped in since the server started.'
      - 'The status form only reads the guard''s state. It changes nothing, and there is no player form to learn.'

  - id: 2026-11-11-excelsummons-mana-holds-cap
    date: Nov 11
    posted: '2026-11-11'
    title: 'Summons hold mana, and your limit grows with your rank'
    better-commands:
      - cmd: /summons dismiss pets
        what: 'Sends home only the pets you summoned with spells (your Wolf, Familiar and Cat). Hand-tamed pets stay, and so do your mount and combat summons.'
      - cmd: /summons list
        what: 'Shows every summon you have out, what mana each one holds, and your held total.'
    changes:
      - 'Your companions and your mount now hold mana while they are out, just like combat summons: Wolf 10%, Familiar 5%, Cat 5%, Mount 10%. The hold comes back the moment a summon leaves, dies or is dismissed.'
      - 'Your summon limit now grows with your earned magic rank: Beginner 1, Student 2, Apprentice 3, Master 5. Combat summons and companions count together. Your mount does not count toward the limit (you can still only have 1), but it does hold its 10% mana.'
      - 'Summons already out stay out, even if they are over your new limit. You just cannot summon another counted one until you are under it again.'
      - 'When a summon cannot be cast, the message now tells you why, with the numbers: your rank and limit, what you have out, or how much mana is already held. No more silent failures or plain cant-do-that messages.'

  - id: 2026-11-11-excelpouch-console-admin
    date: Nov 11
    posted: '2026-11-11'
    title: 'Operator note: console help for pouch'
    changes:
      - 'Operator note only: nothing changes for players. Your Utility Pouch, your parked Server Menu compass and your Magic wand work exactly as before.'
      - 'Staff can now look after a player''s pouch from the server console: see what is in each pocket, hand a pocket''s item back, or clear a pocket, with a saved rescue copy made before anything is cleared.'
      - 'The console forms work by exact name for a player who is online or has played here before, or by UUID. Handing an item back needs the player online.'

  - id: 2026-11-10-excelquartermaster-console-admin
    date: Nov 10
    posted: '2026-11-10'
    title: 'Operator note: console help for quartermaster'
    changes:
      - 'Operator note only: nothing changes for players. The Quartermaster''s tales, the voice-pack offers and your own pack choice work exactly as before.'
      - 'Staff can now check a player''s voice-pack state from the server console: how many of their five offers they have used, what their pack state is, and when it last changed.'
      - 'The console form works on a player who is online, by exact name, or by their UUID. An offline player can only be reached by UUID.'

  - id: 2026-11-10-excelaimassist-console-admin
    date: Nov 10
    posted: '2026-11-10'
    title: 'Operator note: console help for aim assist'
    changes:
      - 'Operator note only: nothing changes for players. Aim help and your own aim-assist choice work exactly as before.'
      - 'Staff can now check and fix a player''s aim-assist setting from the server console: see whether aim assist is on for them and whether they chose it themselves or it is the default, or set it on or off for them.'
      - 'The console forms work on a player who is online, by exact name, or by their UUID. An offline player can only be reached by UUID.'

  - id: 2026-11-10-exceltreecleanup-console-admin
    date: Nov 10
    posted: '2026-11-10'
    title: 'Operator note: console help for tree cleanup'
    changes:
      - 'Operator note only: nothing changes for players. Tidy treetops and your own cleanup choice work exactly as before.'
      - 'Staff can now check and fix a player''s tree-cleanup setting from the server console: see whether cleanup is on for them and whether they chose it themselves or it is the default, or set it on or off for them.'
      - 'The console forms work on a player who is online, by exact name, or by their UUID. An offline player can only be reached by UUID.'

  - id: 2026-11-10-excelmenujoin-console-admin
    date: Nov 10
    posted: '2026-11-10'
    title: 'Operator note: console help for join menus'
    changes:
      - 'Operator note only: nothing changes for players. Joining, your menu compass and the menu itself work exactly as before.'
      - 'Staff can now check and fix a player''s join-menu state from the server console: see whether the join auto-open is on and whether the menu compass is held, flip the auto-open, or hand over a replacement compass.'
      - 'The console forms work on a player who is online, by exact name. There is no offline form.'

  - id: 2026-11-10-excelbuildmode-console-rescue
    date: Nov 10
    posted: '2026-11-10'
    title: 'Stuck in Build Mode? Staff can rescue you now'
    changes:
      - 'If a player gets stuck in Build Mode, staff can now rescue them from the server console and restore them to Play Normally, with their Survival items and XP returned through the usual recovery path.'
      - 'No restart is needed for the rescue.'
      - 'Build Mode itself works as before: entering, leaving and the reviewed flow are unchanged.'

  - id: 2026-11-10-bosstrial-warden-firstbreak
    date: Nov 10
    posted: '2026-11-10'
    title: 'Ready for the Warden: first-break spoils are live'
    changes:
      - 'The guild is at 4 of 5 seals. Only the Warden seal is left, and the Warden fight is set for Saturday, November 14.'
      - 'The first time the Warden seal breaks, every champion in the fight gets $10,000 cash. That is the total for the first break: it replaces the $5,000 repeat rate, and it is not added on top of it.'
      - 'First break only: extra jackpot rolls, the Sealbreakers title, a Heart of the Deep trophy, and an EliteMobs starter kit of food, potions and a totem for every champion.'
      - 'Champions also get the usual boosters: mcMMO and magic XP, death protection and claim fly time. The party healer is recognised too.'
      - 'Repeat Warden breaks afterwards pay the usual repeat rewards, unchanged.'
      - 'The Warden has not been fought yet. Bring your best gear and your party on Saturday.'

  - id: 2026-11-10-l2-depth-grind
    date: Nov 10
    posted: '2026-11-10'
    title: 'Final spell tiers take real practice now'
    changes:
      - 'The last tier of your biggest spells now takes real practice to earn: 200 to 300 casts that do real work, depending on the spell.'
      - 'That covers the headline families: arrows, missiles, frost, lightning, smite, wave, healing, group renewal, and your critical strikes.'
      - 'Every earlier step is unchanged, and any tier you have already earned is yours to keep. Nothing you earned was taken away.'

  - id: 2026-11-10-spell-alignment-wave2
    date: Nov 10
    posted: '2026-11-10'
    title: 'Power Stone and Smite now hit for what they say'
    changes:
      - 'Power Stone now hits its main target for 42, against monsters and players alike. Nearby splash is up to 16 on monsters and 21 on players, fading with distance.'
      - 'Smite now hits flat: 8, 10, or 13 by tier, the same at the edge of the blast as at the centre. The edge used to fade to about 3.'
      - 'Group Heal is unchanged and confirmed: its renewal runs about 10 seconds and heals about 16 in total.'

  - id: 2026-11-09-wand-bars-swap-correction
    date: Nov 9
    posted: '2026-11-09'
    title: 'Wand bars on phones and consoles: swap by emptying the slot first'
    changes:
      - 'Phone and console players: putting a spell straight onto a full wand bar slot does not stick right now. The bar snaps back to how it was.'
      - 'To swap a spell in, take the spell that is in the slot off the bar first, then place the new spell into the empty slot.'
      - 'Placing onto an empty slot works as always.'
      - 'This corrects the November 2 note that said a two-tap place onto a full slot sticks the first time.'
      - 'That is not how it behaves on phones and consoles today.'

  - id: 2026-11-09-warden-retune
    date: Nov 9
    posted: '2026-11-09'
    title: 'The Warden fight is fairer now'
    changes:
      - 'The Warden''s sonic boom can no longer one-shot you late in the fight. It stays at its normal strength from start to finish.'
      - 'The Warden still gets stronger as the fight goes on, but the climb is gentler now.'
      - 'Bring your best gear and your party. The fight is still hard, just fair.'

  - id: 2026-11-09-exceldetails-checkboxes
    date: Nov 9
    posted: '2026-11-09'
    title: 'Details Settings: tick what you want to see'
    better-commands:
      - cmd: /details show damage
        what: 'Ticks or unticks Damage Done. Use taken or healing instead of damage for the other two boxes.'
    changes:
      - 'Damage Done, Damage Taken, and Healing are now separate checkboxes. Tick any mix and every ticked section shows at once.'
      - 'Open Details Settings in the Server Menu, under Settings and right after Maker''s Mark, to tick your boxes.'
      - 'Your overall totals now stay saved when the server restarts.'
      - 'Tiny one-hit fight segments no longer spam a closing message. They fold quietly into your totals.'

  - id: 2026-11-09-exceldetails-meter
    date: Nov 9
    posted: '2026-11-09'
    title: 'New: a live combat meter: Details! comes to the Valley'
    new-commands:
      - cmd: /details
        what: 'Show your meter numbers. /details on and /details off turn it on or off.'
      - cmd: /details clear
        what: 'Discards the current segment and starts a fresh one. Overall totals stay.'
    changes:
      - 'A Details!-style meter now lives in your sidebar during a fight: damage done, damage taken, and healing, updating live as you fight.'
      - 'In an EliteMobs party the meter tucks in right under the party box; everywhere else it stands on its own.'
      - 'Fights segment on their own, and your on/off choice is remembered.'

  - id: 2026-11-09-excelclaims-pillars
    date: Nov 9
    posted: '2026-11-09'
    title: 'Claim corners stand taller, and claims no longer expire on a timer'
    changes:
      - 'Claim corner pillars are now 4 blocks tall: three glowstone with a sea lantern on top, so your corners are easy to spot from a distance.'
      - 'Claims no longer expire on a global clock. The default is never expire; only a claim set with its own timer can lapse.'

  - id: 2026-11-09-excelmagicgate-stage-floor
    date: Nov 9
    posted: '2026-11-09'
    title: 'Your magic now steps up to your stage automatically'
    changes:
      - 'When you log in, your mana pool and regeneration rise to your magic stage floor on their own: at stage 4 that is a 200 pool and fast regen.'
      - 'No more being stuck at an old, smaller pool after a stage-up. The floor checks itself every minute.'

  - id: 2026-11-09-resurrection-icon
    date: Nov 9
    posted: '2026-11-09'
    title: 'Resurrection has its icon back'
    changes:
      - 'The Resurrection spell now shows its icon in the spell menu like every other spell. The spell itself always worked; only its picture was missing.'

  - id: 2026-11-09-boss-fight-tuning
    date: Nov 9
    posted: '2026-11-09'
    title: 'Boss fights bite back: dragon and elder guardian retuned'
    changes:
      - 'The Ender Dragon fight is fiercer: she turns on the party faster and more often, and her add waves are bigger.'
      - 'Her phase change now protects her a few seconds longer while the fight resets.'
      - 'Elder guardian fights now call reinforcements as they go, all through the fight.'
      - 'Guardians and drowned rise around the monument instead of arriving in one scripted wave.'
      - 'The raid pulse now stays hot longer after each pulse (45 seconds), so the pressure window is felt by the whole party.'

  - id: 2026-11-09-boss-voices
    date: Nov 9
    posted: '2026-11-09'
    title: 'The bosses speak now'
    changes:
      - 'Accept the resource pack when you join and the Wither, Elder Guardian, Warden, and Ender Dragon now speak during their fights.'
      - 'Their voices come from the boss itself. Declining the pack changes nothing but the sound.'
      - 'The Ender Dragon re-lights her end crystals when she rises into her second phase, up to four at a time, so the fight can turn again.'
      - 'When an elder guardian falls, the monument answers: the remaining guardians swell with rage. Watch for the relay message in chat.'
      - 'Boss bars and boss-fight stats now show the big display numbers, so what the bar says matches the stats pop-up at the end.'

  - id: 2026-11-08-excelwandbars-cooldown-tag
    date: Nov 8
    posted: '2026-11-08'
    title: 'Cooldown tags now tell the truth'
    changes:
      - 'The floating cooldown tag over a spell now counts down that spell''s real cooldown, so what the tag says is what the wand will do.'
      - 'Still to check in game: casting Heal and watching its tag, and a mana-starved cast leaving no tag behind.'

  - id: 2026-11-08-excelbosstrial-stats
    date: Nov 8
    posted: '2026-11-08'
    title: 'Boss fights now end with your real numbers'
    new-commands:
      - cmd: /bosstrial stats
        what: 'Shows your damage, healing, and fight numbers after a boss fight.'
    changes:
      - 'When a boss fight closes, a stats pop-up shows what you actually did, with damage and healing counted properly this time.'
      - 'Healing you do for your party counts as healing now, not as a rounding error.'

  - id: 2026-11-08-exceldowned-buttons
    date: Nov 8
    posted: '2026-11-08'
    title: 'Giving up is a button now'
    changes:
      - 'When you are downed and choose to give up, a menu asks for real: a red LET GO button and a green Keep fighting button.'
      - 'On a phone you get the same choice as a form.'
      - 'No more typing a command with a bleed-out clock running.'

  - id: 2026-11-08-magic-content-wave
    date: Nov 8
    posted: '2026-11-08'
    title: 'New summons, new healing, and a way back from death'
    changes:
      - 'New summons join the book: the Guardian, the Revenant, and the Ghast, alongside the Archer and Bruiser, plus a Happy Ghast mount that stays with you.'
      - 'Healing grows up: Group Heal for the big moments, Renewal over time, and Group Renewal for the whole party.'
      - 'Your healed allies glow so you can see it land.'
      - 'Shackle now marks its target with a glow and a note in your action bar.'
      - 'And at stage 4: Resurrection, bring a downed party member back at half health. Death is no longer always the end of a fight.'

  - id: 2026-11-08-excelprotect-break-capture
    date: Nov 8
    posted: '2026-11-08'
    title: 'Broken gear leaves a trace now'
    changes:
      - 'When a piece of your gear breaks in a fight, the server now keeps a record of it: no more vanished boots with no trace.'

  - id: 2026-11-08-thrown-hitbox-fix
    date: Nov 8
    posted: '2026-11-08'
    title: 'Thrown spells connect now'
    changes:
      - 'Throw Sword and Boomerang were flying straight through targets without hitting. Both now connect, with a wider hit radius friendlier on mobile.'

  - id: 2026-11-08-excelwandbars-pager-list
    date: Nov 8
    posted: '2026-11-08'
    title: 'The spell list Next button pages the list now'
    changes:
      - 'In your spell list, the Back and Next buttons at the bottom right now turn the pages of the list itself.'
      - 'Your hotbar no longer changes when you tap them.'
      - 'Before, Next could flip your hotbar to another page of spells instead. That was a bug, and it is fixed.'
      - 'Still to check in game: tapping Next in a fresh wand bar and seeing the list page turn while the hotbar stays put.'

  - id: 2026-11-07-wither-seal-broken
    date: Nov 7
    posted: '2026-11-07'
    title: 'The Wither Seal Is Broken: Guild 4 of 5!'
    changes:
      - 'On November 7th the champions took the Wither to the wire on the nether roof.'
      - 'The fight exposed real bugs (a health bar that lied), so the seal was granted on the party''s effort and full rewards were paid.'
      - 'Boss fights are being rebuilt from the ground up.'
      - 'The rematch will be a fair one.'
      - 'Only the Warden remains.'

  - id: 2026-11-07-excelbraingames-sudoku-boxview
    date: Nov 7
    posted: '2026-11-07'
    title: 'Sudoku gets a box view on your phone'
    changes:
      - 'Sudoku on a phone or console now opens a box picker: pick a box and you see just that box as a real square, one box at a time.'
      - 'The whole 9 by 9 board no longer has to squeeze into the small menu.'
      - 'Tap a cell in the box and its full row and its full column print in your chat, so you can see what the cell still needs.'
      - 'Then pick a number from the 3 by 3 digit picker, or erase one you placed.'
      - 'Finished boxes glow lime in the picker. A box that is full but has a wrong number shows yellow instead, so you can see what still needs work.'
      - 'The full board in chat is still one tap away with the Show board in chat button.'
      - 'The board itself is the same 9 by 9 on every device: a round started on one device opens on the other.'
      - 'Boards on a computer are unchanged.'
      - 'Still to check in game: playing Sudoku with the box view on a phone or console.'
      - 'A round started on one device opening right on another, and a computer board looking just as before.'

  - id: 2026-11-07-excelbraingames-bedrock-wordsearch
    date: Nov 7
    posted: '2026-11-07'
    title: 'Word Search fits your phone screen now'
    changes:
      - 'Word Search on a phone or console now deals a board 5 letters wide.'
      - 'The board you see is the board that was dealt, and every word on the list can be found by eye.'
      - 'Words longer than 5 letters never run sideways on the phone board: they run up and down or diagonally instead. Shorter words can still run any way.'
      - 'Same word lists, same themes and same prizes on phone, console and computer.'
      - 'Boards on a computer are unchanged, and a round started on one device still opens in its own layout on another.'
      - 'The other games were checked for the same problem: Memory Match, Quick Math, Word Scramble and Riddle of the Day were not affected.'
      - 'Sudoku still prints its square in chat.'
      - 'Still to check in game: finding the words by eye on a phone or console Word Search board.'
      - 'A round started on one device opening right on another, and a computer board looking just as before.'

  - id: 2026-11-07-excelwandbars-compass-fix
    date: Nov 7
    posted: '2026-11-07'
    title: 'No more menu compass on your spell bar'
    changes:
      - 'The menu compass no longer ends up sitting on your spell bar when you join.'
      - 'Logging out with the spell bar open now closes it first, so you always log back in on your normal items.'
      - 'If an old saved bar already has a stray menu compass baked into it, it is moved back to your normal inventory when you join.'
      - 'Your spells stay exactly where they were.'
      - 'Nothing else changed: same wand, same spells, same bars, same controls.'
      - 'Still to check in game: logging out with the spell bar open and joining again on a phone or console, and the same cycle on a computer.'

  - id: 2026-11-07-excelmenu-reorganization
    date: Nov 7
    posted: '2026-11-07'
    title: 'The compass menu got organized'
    changes:
      - 'Wand controls moved: it now sits with your skills in the Me group, right after Spellbook, on computer and phone or console alike.'
      - 'Same /wandstyle, nothing about your wand changed.'
      - 'The Shops group tells the truth now: the server shop door is named Spawn Shop.'
      - 'A new My Shop door beside it opens your own chest shop to manage.'
      - 'Look at your shop chest or sign first, then tap My Shop.'
      - 'Landmarks and Brain Games moved up beside Boss Rewards in the phone and console menu, so the family things sit together.'
      - 'The Server Commands catalogue got more breathing room, and the Settings group is back to its five switches.'
      - 'Still to check in game: Wand controls opening beside Spellbook, the Spawn Shop name, My Shop opening your shop.'
      - 'And the family rows on a phone or console.'

  - id: 2026-11-07-excelclaims-per-player-expiration
    date: Nov 7
    posted: '2026-11-07'
    title: 'Your claims do not expire anymore'
    changes:
      - 'Claims do not expire anymore: ExcelClaims 0.1.2 removed the old timers that could delete a claim after days away. Your land stays yours.'
      - 'Expiration is now set per player by staff, and the server default is never.'
      - 'If a limit is ever set for someone, it counts only from when they were last seen playing.'
      - 'Nothing else changed: same golden shovel, same commands, same claim blocks and trust rules.'
      - 'All 10 claims and 11 player accounts carried over exactly.'
      - 'Still to check in game: building in your own claim and being turned away in a neighbour claim.'
      - 'The golden-shovel resize view, and building in a rented Landmark plot.'

  - id: 2026-11-07-excelautosort-max-organization
    date: Nov 7
    posted: '2026-11-07'
    title: 'Max Organization: all your chests in one view'
    new-commands:
      - cmd: /autosort max
        what: 'Open Max Organization: unlock it, then see every chest near you that you may set up, all in one view.'
        bedrock: 'Or tap Max Organization on the compass.'
        java: 'Or click Max Organization in the compass menu.'
    changes:
      - 'Max Organization is a new extra for our own ExcelAutoSort: one view onto every chest within 16 blocks that you may configure.'
      - 'That means the claim owner, a PermissionTrust holder, or the recorded owner in unclaimed land.'
      - 'Also a Landmark plot renter in their plot, or staff in admin claims. Just being able to open a chest is not enough.'
      - 'Unlock it two ways: rent it for $1,000 for 30 days, or buy it for $15,000 and it is yours forever.'
      - 'Rent money never counts toward buying, and nothing is ever charged on its own.'
      - 'Every rent or buy is a fresh purchase you confirm first.'
      - 'The view holds nothing itself: your items stay in the real chests.'
      - 'If a rent runs out the ability just turns off and no item can ever be lost. Rent again and it turns back on at once.'
      - 'From the view you can take stacks out, and Put my things away tidies what you are carrying into the chests, respecting each chest filter.'
      - 'Every purchase, take and deposit is written down in ExcelProtect.'
      - 'Still to check in game: the full Max Organization flow on a phone or console and on a computer.'
      - 'One real rent and one real buy, and a rent running out on a live account.'

  - id: 2026-11-07-excelclaims-our-claims
    date: Nov 7
    posted: '2026-11-07'
    title: 'Claims are now ours: ExcelClaims'
    changes:
      - 'Land claims are now ours: ExcelClaims replaces the third-party GriefPrevention plugin.'
      - 'Same commands, same golden shovel, same claims: nothing moved.'
      - 'Every claim carried over exactly when the swap was made on Nov 7: 10 claims (1 of them the server admin claim at spawn) and 11 player accounts.'
      - 'Checked number for number before the server came back.'
      - 'Claim blocks, trust and /claimslist work the same as before.'
      - 'Your first chest still claims a small patch automatically, and you still earn 100 claim blocks for every hour you play.'
      - 'Still to check in game: building in your own claim and being turned away in a neighbour claim.'
      - 'The golden-shovel resize view, and building in a rented Landmark plot.'

  - id: 2026-11-07-excelautosort-chest-filters
    date: Nov 7
    posted: '2026-11-07'
    title: 'Chest filters are here: our own auto-sort'
    new-commands:
      - cmd: /autosort chest
        what: 'Stand at a chest or barrel, look at it, and set up its filter: keep only these, or throw away these.'
        bedrock: 'Or tap Chest filter setup on the compass, or tap the chest while holding a compass.'
        java: 'Or click Chest filter setup in the compass menu.'
      - cmd: /autosort recover
        what: 'Open your Filter recovery box: items your filters removed wait there for 7 days.'
        bedrock: 'Or tap Filter recovery box on the compass.'
        java: 'Or click Filter recovery box in the compass menu.'
    changes:
      - 'Auto-sort is now ours: ExcelAutoSort replaces the old third-party AutoSort and the bridge.'
      - 'The /autosort toggle works the same as before and is off until you turn it on.'
      - 'A marked chest or barrel can keep only the kinds you tap from what is already inside it (whitelist).'
      - 'Or it can remove just the junk you pick, like rotten flesh (blacklist).'
      - 'Setting one up always shows you exactly what will be removed first, and you confirm it before anything happens.'
      - 'Removed items are never gone right away: they wait in your Filter recovery box for 7 days.'
      - 'Every removal is written down in ExcelProtect, so nothing is ever lost by accident.'
      - 'Only chests you set up this way ever remove anything.'
      - 'Only a player who may configure that chest can change its filter: its claim owner or someone with PermissionTrust.'
      - 'The recorded owner in unclaimed land, a Landmark plot renter in their plot, or staff in admin claims.'
      - 'Being allowed to open a chest is not enough.'
      - 'Still to check in game: the filter setup on a phone or console and on a computer.'
      - 'A hopper feeding a marked chest, and the menu toggle showing your real state.'

  - id: 2026-11-06-halloween-season-end
    date: Nov 6
    posted: '2026-11-06'
    title: 'The Halloween season has ended'
    changes:
      - 'The Halloween event ended after Nov 5, and the Halloween plugins were removed on Nov 6.'
      - 'The scares, the pumpkin bosses, the grave ritual and the Pumpkin Trader are gone until next year.'
      - 'The /halloween and /scares commands are retired too, and the Halloween buttons are out of the menus.'
      - 'The Halloween stories below stay in What''s New as history. They describe the season that was, not something you can still play.'
      - 'Everything else is unchanged: same spawn, same menus, same games, same valley.'

  - id: 2026-11-05-brain-games-letter-tiles
    date: Nov 5
    posted: '2026-11-05'
    title: 'Brain Games letter tiles: read the board before you tap'
    changes:
      - 'The Brain Games boards show their letters and numbers right on the tiles now (ExcelBrainGames 0.3.1).'
      - 'In Word Search you can read every letter on the grid before you tap, and a word you found lights up in its own color.'
      - 'Sudoku numbers sit on the board tiles: the given numbers, the ones you place, and the wrong ones the Check button flashes all read at a glance.'
      - 'On the Kid picture boards, the given and wrong tiles carry the picture palette number.'
      - 'Quick Math on the Kid size: the 3 choice emeralds show their numbers right on them. No more blind guessing.'
      - 'When you join, the server offers you a small tile pack download. Say yes: that is what paints the letters and numbers onto the tiles.'
      - 'On the phone it arrives through Geyser the same way.'
      - 'Said no, or skipped it? Nothing breaks.'
      - 'Every tile still carries its letter or number in its name, exactly like before, and every game still plays and pays the same.'
      - 'Nothing else changed: same games, same prizes, same $1,500 a day limit across all Brain Games.'

  - id: 2026-11-05-brain-games-chat-boards
    date: Nov 5
    posted: '2026-11-05'
    title: 'Brain Games on the phone: the board and the choices in your chat too'
    changes:
      - 'Sudoku now prints its board in your chat as a tidy square every time you open it.'
      - 'Given numbers in [brackets], your numbers plain, blanks as dots, and rows and columns numbered, so a square in chat matches the board you tap.'
      - 'Board moved on since you opened it? A new Show board in chat button on the board prints the square again, up to date.'
      - 'Kid picture Sudoku prints its palette numbers in the square, with a line that says which number is which picture.'
      - 'Word Scramble on the Kid size prints the scrambled word and its 3 choices in chat.'
      - 'They are numbered 1 to 3 in the same order as the cards, once for each new word.'
      - 'Quick Math on the Kid size prints each question in chat too, once for each new question.'
      - 'The typed sizes already showed their questions in chat and still do.'

  - id: 2026-11-05-elite-ladder-retune
    date: Nov 5
    posted: '2026-11-05'
    title: 'Elites retuned: more of them, tougher, a touch softer, and faster'
    changes:
      - 'The elite ladder was retuned today (ExcelEliteLadder 0.2.1).'
      - 'Elites rise more often now: about 14 of every 100 wild spawns at the current Seal 3 step, up from about 9.'
      - 'Elites stand longer against you: your hits land at about 40% of their usual strength on them, down from about 50%.'
      - 'So an elite takes about a quarter longer to bring down.'
      - 'Their own hits come in a little softer than the old peak: about 85% harder than normal, down from about 105%.'
      - 'More elites, tougher elites, slightly gentler hits.'
      - 'And natural elites move faster now: about 20% faster than the ordinary monsters of their kind.'
      - 'If a wild elite seems to run you down quicker than it used to, it does.'
      - 'The whole road moved the same way, not just today: Seal 1 is about 10 of every 100 now, Seal 2 about 12.'
      - 'The Seal 4 peak is about 17 of every 100 with your hits at about 35%. Seal 5 still holds the Seal 4 step.'
      - 'Nothing else changed: elites still rise only in the wild, never from spawners, still match the player they fight.'
      - 'And the dungeon numbers are untouched.'

  - id: 2026-11-05-landmarks
    date: Nov 5
    posted: '2026-11-05'
    title: 'Landmarks: rent or buy a named spot at spawn'
    new-commands:
      - cmd: /landmarks
        what: 'Open My Landmarks: your rented and owned spots at spawn, with renew, release and redemption claims.'
        bedrock: 'Or tap My Landmarks on the compass.'
        java: 'Or click My Landmarks in the compass menu.'
    changes:
      - 'The spawn build has named spots now. When you find a gold [Landmark] sign, tap it: a menu pops up with the spot and its prices. No compass needed.'
      - 'An open spot can be rented or bought from that menu, and nothing is charged until you press Confirm.'
      - 'Rent is per month (30 days): $500 for a minor spot, $1,500 for a landmark, $3,000 for a heart piece.'
      - 'Buying is yours for good: $10,000, $25,000 or $50,000.'
      - 'A LANDMARK spot is naming rights: your name goes on the sign. A PLOT spot also gives build rights in that patch of spawn.'
      - 'Rentals run 30 days. Renew from the same menu and the time stacks. After your time runs out you get a 7-day grace week to renew.'
      - 'If a plot rental lapses for good, your chest contents, loose items and the materials of blocks you placed are packed up.'
      - 'They go into a redemption box beside the sign. The box never expires and only you can open it.'
      - 'The structure itself is cleared for the next renter.'
      - 'The first spot signs are being placed at spawn now, one by one. A spot is open when its sign says Available.'

  - id: 2026-11-05-brain-games-all-six
    date: Nov 5
    posted: '2026-11-05'
    title: 'Brain Games complete: Sudoku and the word games are live'
    changes:
      - 'Sudoku is live: pick a number from the palette, then tap cells to place it.'
      - 'Kid 4 by 4 uses pictures and pays $25. The 6 by 6 pays $60.'
      - 'The 9 by 9 sizes pay $120 (Easy), $180 (Medium) and $250 (Hard).'
      - 'The 9 by 9 board is bigger than the screen, so it shows in two views: tap the page button to swap between rows 1 to 5 and rows 5 to 9.'
      - 'Row 5 is on both. The number palette also has two banks: tap the bank button to swap between 1 to 5 and 6 to 9.'
      - 'Sudoku Check button: it marks your wrong numbers in red.'
      - 'On the grown-up sizes each check costs 10% of the prize (up to 3 checks). On the Kid size checks are free.'
      - 'Quick Math is live: 10 questions a round. Type your answer in chat.'
      - 'Kid pays $25, Standard $50, Challenge $90, and you earn for every question you get right.'
      - 'Word Scramble is live: unscramble 5 words. Type the word in chat, or tap one of 3 choices on the Kid size. Kid pays $50 a round, Standard $100.'
      - 'Riddle of the Day is live: one riddle each day, the same for everyone, and 3 tries to solve it. It pays $100. A hint costs $25 off the prize.'
      - 'All six Brain Games are live now: Word Search, Memory Match, Sudoku, Quick Math, Word Scramble and the Riddle of the Day.'
      - 'They still share the one $1,500 a day limit, and kid sizes still pay kids full price and grown-ups half.'

  - id: 2026-11-05-brain-games
    date: Nov 5
    posted: '2026-11-05'
    title: 'Brain Games are here: Word Search and Memory Match'
    new-commands:
      - cmd: /games
        what: 'Open Brain Games, the new puzzle games that pay money. Pick Word Search or Memory Match and a board size.'
        bedrock: 'Or tap Brain Games on the compass.'
        java: 'Or click Brain Games in the compass menu.'
    changes:
      - 'Word Search: pick a theme (Animals, Food, Minecraft, Space, Ocean or School) and a size.'
      - 'Tap the first letter of a word, then tap its last letter to circle it.'
      - 'Word Search sizes and pay: Kid (6 by 6 grid, 5 words) pays $40. Standard (9 by 6 grid, 8 words) pays $90.'
      - 'Challenge (9 by 6 grid, 10 words, every direction) pays $150.'
      - 'Finish Standard or Challenge inside the time shown for a 20% bonus.'
      - 'Memory Match: flip two cards at a time and find the pairs.'
      - 'Kid (6 pairs) pays $30. Standard (8 pairs) pays $55. Big (12 pairs) pays $100. Giant (18 pairs) pays $160.'
      - 'Finishing in few flips adds a 20% bonus.'
      - 'One daily limit covers all Brain Games together: $1,500 a day each. The first game you finish each day also adds a streak bonus, up to $50.'
      - 'Kid sizes are open to everyone: kids earn full price on them, and grown-ups earn half price there. The bigger sizes pay everyone the same.'
      - 'Games save as you play. Close one, log out, and come back later: it is waiting where you left it, and it pays when you finish it.'
      - 'Later the same morning Sudoku, Quick Math, Word Scramble and a Riddle of the Day joined them, so all six Brain Games are live now.'

  - id: 2026-11-04-party-leave-fix
    date: Nov 4
    posted: '2026-11-04'
    title: 'Leaving the party works from every door now'
    changes:
      - 'Fixed: leaving the party did not always stick.'
      - 'Leaving through the EliteMobs party menu could quietly put you back in the party, and a leader disbanding the party could do the same.'
      - 'Now every door works: /excelparty leave, /party leave or /party disband, and the EliteMobs party leave all end the one party everywhere.'
      - 'And it stays left: logging out and back in no longer brings back a party you already left.'

  - id: 2026-11-03-familiar-cat-cooldown
    date: Nov 3
    posted: '2026-11-03'
    title: 'Familiar and Cat recharge faster, and long waits show a countdown'
    changes:
      - 'Familiar and Cat now recharge in 4 minutes (they were 5). Wolf is unchanged at 1 minute.'
      - 'New: when a spell on your wand bar still has more than a minute before you can cast it, its name shows the countdown.'
      - 'Like "Familiar · 3:24", ticking down in the name itself.'
      - 'On a phone or console the little number on the spell icon may sit at 64 even when more time is left.'
      - 'Trust the countdown in the name: it shows the real time.'

  - id: 2026-11-02-menu-one-system
    date: Nov 2
    posted: '2026-11-02'
    title: 'Menus: one system now, everything works the same'
    changes:
      - 'The menus behind your compass are now one system on computers, phones and consoles. Two add-ons used to split the job; now one does it all.'
      - 'Nothing to relearn: your compass, /menu, /servercommands, /tpmenu and /childproofmenu open the same menus as before, with the same buttons.'
      - 'Fixed: the Halloween Scares button in the computer menu had stopped opening your scare switches.'
      - 'It opens them again, like on phones and consoles. The Halloween event runs through Nov 5.'
      - 'On phones and consoles, Ask the Guide opens its text box again and Skills & Perks opens as a form, served by the same one menu.'

  - id: 2026-11-02-teleport-choice
    date: Nov 2
    posted: '2026-11-02'
    title: 'Teleporting: now you pick which way'
    new-commands:
      - cmd: /tpahere
        what: 'Ask another player to teleport to you. Type /tpahere and their name. They tap Accept or Decline first.'
    better-commands:
      - cmd: /tpmenu
        what: 'Open the teleport picker. Pick a player, then pick which way: you go to them, or they come to you.'
        bedrock: 'Or tap Teleport to a player on the compass.'
        java: 'Or click Teleport to a player in the compass menu.'
    changes:
      - 'Picking a player no longer sends the request right away. A choice pops up first: Teleport to player or Ask player to come to me.'
      - 'On a phone or console the choice is a pop-up with the two buttons, titled with their name.'
      - 'On a computer it is a small chest: the ender pearl goes to them, the ender eye brings them to you.'
      - 'The other player always gets an Accept or Decline prompt before anyone moves.'
      - 'If you ask someone to come to you, their prompt says you are asking them to teleport to you.'
      - 'Close the choice without picking and nothing is sent.'
      - 'Typing still works: /tpa and a name asks to go to them. /tpahere and a name asks them to come to you.'

  - id: 2026-11-02-spell-fixes
    date: Nov 2
    posted: '2026-11-02'
    title: 'Spell fixes: arrows fly straight, Familiar behaves'
    changes:
      - 'Wand arrows (Arrow, Normal Arrow, Ice Arrow, Light Arrow, Shock Arrow) used to drop at your feet. They now fly straight and hit what you aim at.'
      - 'Familiar now finishes its cast: the animal stays about 20 seconds and the 5-minute cooldown really starts.'
      - 'Wolf has a 1-minute cooldown and Cat 5 minutes.'
      - 'Storm Shackle at the top ranks now drains mana faster than it refills, so the channel ends on its own.'
      - 'Boomerang can no longer be cast with no cooldown.'
      - 'A full sweep of spell costs: nothing can be cast forever for free any more. Tamed animals no longer hurt other players.'

  - id: 2026-11-02-wand-bars
    date: Nov 2
    posted: '2026-11-02'
    title: 'Wand bars: page buttons, steadier arranging, safer joins'
    changes:
      - 'Two page buttons now sit at the bottom right of your spell inventory. Tap to flip pages.'
      - 'The forward button says Page X of Y. Flipping with your wand still works too.'
      - 'Putting a spell onto a full slot with two taps now sticks the first time.'
      - 'Joining the server no longer traps you in wand mode: you land on your normal hotbar with your items back and one menu compass.'

  - id: 2026-11-02-halloween-tune
    date: Nov 2
    posted: '2026-11-02'
    title: 'Halloween: tougher skeleton boss, calmer graves'
    changes:
      - 'The Pumpkin Skeleton boss now has 150 health (was 100) and moves faster. The Pumpkin Zombie is unchanged.'
      - 'Grave ritual mobs now move at normal speed instead of racing around, so waves are easier to round up.'
      - 'They still glow; on a computer you can see the glow through walls.'
      - 'The website Halloween page now shows the exact grave build, block by block, plus both boss altars, candy chances and Pumpkin Trader prices.'

  - id: 2026-11-01-one-party
    date: Nov 1
    posted: '2026-11-01'
    title: 'One party, every door'
    better-commands:
      - cmd: /party
        what: 'Your mcMMO party. Now the same party as /excelparty and /em party.'
      - cmd: /excelparty
        what: 'Your party menu and party commands. Now the same party as /party and /em party.'
      - cmd: /em party
        what: 'The EliteMobs party. Now the same party as /party and /excelparty.'
    changes:
      - 'The three party systems are now one party of up to 5. Join at any door and the other doors show the same people.'
      - 'EliteMobs is the face of the party: its sidebar, its menus and its [ACCEPT] popups.'
      - 'Jobs bonuses, shared XP, friendly-fire protection and dungeon groups all follow the same roster now.'
      - 'Your party is rebuilt when you log in, so the group is standing again without new invites.'
      - 'If a mcMMO party has more than 5 people, the rest stay in mcMMO only and join on their own when a seat frees.'
      - 'Magic XP copies now go to party members within 50 blocks in the same world, not to anyone standing nearby.'
      - 'The website Parties page has the full story.'

  - id: 2026-11-01-halloween-how-to
    date: Nov 1
    posted: '2026-11-01'
    title: 'Halloween: how everything works'
    new-commands:
      - cmd: /scares
        what: 'Turn each kind of scare on or off, just for you.'
    changes:
      - 'The event runs in the overworld through Nov 5. Scares cannot hurt you: the fire and the lightning are harmless.'
      - 'Boss altars: put a carved pumpkin on a fence post and light it with flint and steel to call the Pumpkin Zombie boss.'
      - 'Use a lapis block under the carved pumpkin instead for the stronger Pumpkin Skeleton boss. Each boss can be called about every 10 minutes.'
      - 'Graves: light the candle on a grave with flint and steel, survive the waves, and a reward chest appears.'
      - 'Candy drops from mobs wearing pumpkins, from grave mobs and from bat witches. Bosses and graves pay the most candy.'
      - 'Pumpkin Trader: hold a carved pumpkin and right-click any villager.'
      - '10 candy buys a golden apple, 25 candy buys a diamond, and emeralds trade for carved pumpkins.'
      - 'Every night from 7 PM to 2 AM is the Witching Hour. Scares come about twice as often.'
      - 'Type /halloween disable to opt out of the scares and /halloween enable to come back. /halloween stats shows your candy and your counts.'

  - id: 2026-11-01-magiclevel
    date: Nov 1
    posted: '2026-11-01'
    title: 'Magic Level: casting makes you stronger'
    new-commands:
      - cmd: /magiclevel
        what: 'See your Magic Level, Magic XP and your boosts. Casting with your wand earns Magic XP, and every Magic Level makes your casting a little stronger.'
        bedrock: 'Or tap Magic Level on the compass, right after Skills & Perks.'
        java: 'Or click Magic Level in the compass menu, right after Skills & Perks.'
      - cmd: /magiclevel top
        what: 'See the family Magic Level leaderboard.'
    changes:
      - 'Your path and the seals decide what you can cast.'
      - 'Your Magic Level decides how strong your casting is: a bigger mana pool, faster regen, cheaper casts.'
      - 'Magic Level never locks or unlocks a spell. New mages and old mages learn the same spells at the same seals.'
      - 'There are 1000 Magic Levels. At the very top they add up to +23.75% mana pool, +23.75% regen and casts that cost 9.5% less.'
      - 'Casting the same spell over and over pays less each time. A real mix of spells earns fastest, and healing pays well.'
      - 'When you earn Magic XP, everyone within 50 blocks of you in the same world gets a copy, so casting together lifts the whole group.'
      - 'On weekends Magic XP pays 1.2x, the same weekend bonus mcMMO gets.'
      - 'Your boost is saved with your mage, so it is still on when you log back in.'

  - id: 2026-11-01-one-menu
    date: Nov 1
    posted: '2026-11-01'
    title: 'One menu for everyone'
    changes:
      - 'The compass menu is now the same for everyone: phones, tablets, controllers and computers all get the same doors in the same places.'
      - 'Magic Level now sits right after Skills & Perks in the menu.'
      - 'If a door needs something you do not have yet, it tells you what is missing instead of just failing.'

  - id: 2026-10-31-halloween
    date: Oct 31
    posted: '2026-10-31'
    title: 'Halloween is here, through Nov 5'
    new-commands:
      - cmd: /halloween stats
        what: 'See your candy and your Halloween counts. /halloween top shows the leaders.'
    changes:
      - 'Spooky things happen in the overworld: pumpkin curses, Slenderman, Herobrine, sudden darkness and harmless lightning.'
      - 'Every night from 7 PM to 2 AM is the Witching Hour. Scares come about twice as often.'
      - 'Build an altar and light it with flint and steel to call a pumpkin boss.'
      - 'A fence post plus a carved pumpkin makes one boss. Lapis plus a carved pumpkin makes a stronger one.'
      - 'Light the candle on a grave to start the grave waves and earn the reward chest.'
      - 'Mobs drop candy. Trade it with the Pumpkin Trader: right-click a villager while you hold a carved pumpkin.'
      - '10 candy buys a golden apple, 25 candy buys a diamond.'
      - 'Too much? Type /halloween disable and the scares leave you alone. Type /halloween enable to come back, or /scares to pick which scares you get.'
      - 'The event ends after Nov 5. Still to check in game: the altars, the graves and the trader.'

  - id: 2026-10-31-lost-and-found-new-rules
    date: Oct 31
    posted: '2026-10-31'
    title: 'Lost & Found: more time, lower price'
    better-commands:
      - cmd: /lostfound
        what: 'Get back your own stuff lost to lava, fire, the void or a despawn.'
        bedrock: 'tap Lost & Found on the compass.'
        java: 'Or click Lost & Found in the compass menu.'
    changes:
      - 'You now have 14 days to recover something, not 7.'
      - 'Each recovery costs $10,000. Your first one is still free if you have less than $10,000.'
      - 'There is no daily limit any more. The price is the only gate.'
      - 'The Potions and Protection shop at spawn now points you to Lost & Found.'

  - id: 2026-10-31-boss-rewards-open-by-themselves
    date: Oct 31
    posted: '2026-10-31'
    title: 'Boss rewards open by themselves'
    changes:
      - 'When your team wins a boss trial, your rewards now open by themselves, right there or on your next join.'
      - 'While that reward screen is up, you turn invisible for a short while, so nothing can hit you while you look.'
      - 'Every champion gets their own full reward set. Nothing is shared or split.'
      - 'Opening My Boss Rewards yourself works the same as before, and never makes you invisible.'

  - id: 2026-10-30-wand-bar-arranging-and-aim-assist
    date: Oct 30
    posted: '2026-10-30'
    title: 'Arrange your spell bar, and an Aim Assist switch'
    new-commands:
      - cmd: /aimassist

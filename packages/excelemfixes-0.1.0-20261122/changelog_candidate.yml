  - id: 2026-11-13-excelskillspanel-carried-wand-header
    date: Nov 13
    posted: '2026-11-13'
    title: 'Update: the Skills panel header follows the wand you carry'
    changes:
      - 'The Skills panel header now follows the wand you carry: rank, next rank, mana and mana regen all come from the same carried wand, whether it is in your hand or not. Open /skillpanel while holding food, with your Renewal wand in your bag, and the header still shows your wand: Rank Apprentice, Next rank Master, Mana 150 out of 150, regen 25. Before this fix the panel fell back to the Beginner values whenever the wand was not in hand.'
      - 'There is no Class line anywhere in the panel now. No "Class: Mage" on the header, the Magic detail, the Bedrock form or chat: the field is gone from the panel end to end.'
      - 'The next rank follows our own ladder now (Beginner, Student, Apprentice, Master), so an Apprentice wand reads Next rank Master. Magic itself calls that rank Wizard, but the panel matches the wand lore and our ladder, never Magic''s chain name.'
      - 'Mana now shows the live effective pool: your current mana over its effective maximum, with regen to match. At Magic Level 26 the pool is 150 out of 150, exactly the wand''s own numbers, and the Boosts line still carries the percentages behind it. The casts line reads Credited casts from the MagicGate ledger (1,215 for Mike), and the panel never falls back to the old total-casts count again.'
      - 'Nothing else changed: Magic Level and XP, the Boosts line, Guild seals, the mcMMO rows, the perk ladders and their descriptions, and the gold bars are all exactly as before. Checks: 38 of 38 automated checks pass, plus a test-server rig with the real Magic plugin (71 of 71 in both phases). Still to check in game: Mike opens /skillpanel while holding food (wand NOT in hand) on Java and on Bedrock and confirms Rank Apprentice, Next rank Master, Mana 150/150, regen 25, Credited casts 1,215, and no Class line.'


      - 'Phones and tablets: press and hold a spell on the bar to read what it does. It never casts.'

  - id: 2026-10-30-storm-shackle-and-boon
    date: Oct 30
    posted: '2026-10-30'
    title: 'Storm Shackle and Boon work better'
    changes:
      - 'Storm Shackle is a toggle now. Turn it on and it keeps zapping and slowing the enemy you face until you turn it off.'
      - 'Shackle costs less to keep running at every rank, and it never stops your mana from refilling.'
      - 'Boon: while it is on, your mana pool is half as big, but it keeps refilling the whole time.'
      - 'Turn Boon off and the full pool is back in about 2 seconds.'
      - 'The stuck number 3 on the hotbar was the mana wait sign. It should not get stuck now.'

  - id: 2026-10-30-party-xp-shops-and-menus
    date: Oct 30
    posted: '2026-10-30'
    title: 'Party XP, shops and menus'
    changes:
      - 'In a Together party, some of the XP you earn is shared with your party nearby.'
      - 'Player shops run on the newest Shopkeepers. Your shops and stock are unchanged.'
      - 'The compass menu opens once by itself when you join. Bedrock players get the pop-up form once.'
      - 'Server menus were updated on Java and Bedrock.'

  - id: 2026-10-29-connection-and-stability-fixes
    date: Oct 29
    posted: '2026-10-29'

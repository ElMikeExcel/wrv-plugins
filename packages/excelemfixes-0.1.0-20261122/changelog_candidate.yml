  - id: 2026-11-14-excelsummons-pet-names-cap
    date: Nov 14
    posted: '2026-11-14'
    title: 'Update: adopted pets no longer use up your summon limit, and your pets show their own names'
    changes:
      - 'Big fix first: your adopted pets no longer count toward your summon limit. Only summons you cast with spells count. Your limit is still set by your magic rank (Beginner 1, Student 2, Apprentice 3, Master 5), but a wolf, cat or other pet you tamed or bred yourself takes no slot at all, and still holds no mana. Where to start: open your Summons page (type /summons menu or tap My Summons on the compass) and look: your adopted pets sit on their own Adopted pets page, apart from your cast summons. What to do first: if casting used to refuse you while your pets were out, try casting now: with your adopted pets beside you, you can cast up to your full rank limit, and if a cast is refused, the message now counts and names only your cast summons.'
      - 'Your Summons page now shows each pet by its own name instead of just its kind: a wolf you named Buddy reads Buddy on its row, on its button, and in the dismiss confirm, on computer and on phone, tablet and console alike. A pet with no name still shows its kind, and /summons list reads exactly as before.'
      - 'Adopted pets can now be renamed right in the menu. Open /summons menu (or My Summons on the compass), open Adopted pets, and tap the pet: its own page has Rename and Dismiss. On a computer, Rename asks you in chat: type the new name within 30 seconds (or type cancel); your message is taken as the name and is never shown in chat. On phone, tablet and console, Rename opens a form with the current name filled in; closing the form changes nothing.'
      - 'Only pets you tamed or bred yourself, adopted pets, can be renamed this way, and only your own. Names are cleaned up as you set them: colour codes are removed and a name can be up to 32 characters long. Stand near the pet so it is loaded. The new name shows over its head with its health, exactly as a name tag name does.'
      - 'Nothing else changed: there is still no dismiss-all for adopted pets, dismissing one adopted pet is still one at a time behind a confirm that warns it permanently removes the real animal, and typing /summons dismiss still never touches adopted pets. Per-spell limits, the mount rule (a mount never counts toward the limit), and the rank ladder are all as before.'
      - 'Still to check in game: Mike casts with his 8 adopted wolves out, up to his cast limit of 3 at Apprentice; his pack shows distinct names; each Dismiss confirm names its own wolf; a menu rename shows over the wolf''s head.'

  - id: 2026-11-14-excelwhatsnew-day-walk
    date: Nov 14
    posted: '2026-11-14'
    title: 'Update: By date now reads a day from the beginning'
    changes:
      - 'What changed: in What''s New, By date now opens a day at its first change of the day and reads forward. Where to start: open What''s New (type /whatsnew or tap What''s New on the compass), tap By date, pick a month, then tap a day. What to do first: the day opens at its oldest change, marked 1 of however many that day holds, like 1/5.'
      - 'Tap Newer news to move to the next change of that day, one step at a time, until the last page, which shows the day''s full count, like 5/5. Tap Older news to step back. Every page of the day shows its place, like 2/5, on computer and on phone, tablet and console alike, so you always know where you are in the day.'
      - 'You can also type it: /whatsnew bydate 2026-11-13 opens that day at its oldest change, and /whatsnew bydate 2026-11-13 2 opens its second-oldest change. A number past the day''s count still opens its last change, the newest one.'
      - 'Before, a day opened at its newest change and read backwards. Months, days and the recent news list work the same as before: months and days still list newest first, and the flat list still shows the 10 newest entries.'
      - 'Still to check in game: Mike opens What''s New, By date, Oct 26: the day opens at 1/10 and stepping walks to 10/10.'

  - id: 2026-11-14-spellbook-regroup
    date: Nov 14
    posted: '2026-11-14'
    title: 'Update: the Spell Book is tidied: the full Summon family in one place'
    changes:
      - 'Open your spell book and look at the Summon group: it now holds the full summon family in one place, 11 spells: Familiar, Wolf, Cat, Tame, Archer, Bruiser, Guardian, Revenant, Ghast, Mount and Pet Heal. Nothing sits in Other any more: on a Master wand the book lists 114 spells, Summon 11, Other 0.'
      - 'The spell that was called Tame Pet is now called Pet Heal. It is the same spell, with the same key and the same effect: only its name changed, and it now shelves in Summon, right beside Tame.'
      - 'Six summons now show plain names in every spell book: Archer, Bruiser, Guardian, Revenant, Ghast and Mount. Before, some of them showed only their plain spell key.'
      - 'Healing grew too: the Healing group now lists 12 spells. Group Renewal unlocks at Apprentice rank, and Resurrection unlocks at Master rank. Existing wands pick both up on their own: you do not need a new wand.'
      - 'Four spells moved groups so each group means what it says: Earth and Anvil sit in Damage now, and Flare and Counterspell sit in Utility. Building keeps its other 8 spells. No spell changed how it works, what it costs, or the rank that unlocks it: only where it shelves and, for the six summons and Pet Heal, what it is called.'
      - 'Still to check in game: Mike opens the spell book on a Master wand, on a computer and on a phone, and confirms Summon shows 11 and Other is empty.'

  - id: 2026-11-13-excelwhatsnew-bydate
    date: Nov 13

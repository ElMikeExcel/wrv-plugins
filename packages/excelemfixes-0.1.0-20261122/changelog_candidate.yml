      - 'Other vaults and backpacks are not included. Unusual custom shulker contents can exceed scan limits.'
      - 'Installed Oct 29 about 12:55 AM Central. Real-player deposits, saved toggles and screens still need checking.'

  - id: 2026-10-28-magic-practice-and-item-history
    date: Oct 28

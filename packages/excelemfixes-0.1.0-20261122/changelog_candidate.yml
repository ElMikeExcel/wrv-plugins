  - id: 2026-11-14-fmm-furniture-shop
    date: Nov 14
    posted: '2026-11-14'
    title: 'New: Furniture shop is open - buy furniture with /fmm shop'
    changes:
      - 'The furniture shop is open. Type /fmm shop to open it and buy ready-made furniture for your base.'
      - 'There are 7 pieces: Bed $100, Chair $75, Chest $150, Desk $125, Table $75, Light $100, and a big Closet for $250.'
      - 'The Chest holds 27 slots of storage and the Closet holds 54 slots.'
      - 'Pay with the money you earn in game (your Jobs and Vault balance). The shop charges the price shown, once, when you buy.'

    date: Nov 12
    posted: '2026-11-12'
    title: 'New: sections on the phone and console menu'
    changes:
      - 'On phone, tablet and console, your compass now opens a section picker: tap Travel, Me, Shops, Help, Settings or Chest Organization, then tap the button you want inside that section.'
      - 'There is no Toggles button on the picker: your four on/off switches now sit inside Settings, after the Maker''s Mark and Details pages. In Travel the order is Spawn, Teleport, Party, Guild and EliteMobs, and in Me the Utility Pouch now sits before Jobs.'

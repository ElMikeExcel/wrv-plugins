  - id: 2026-10-26-spell-book-groups
    date: Oct 26
    posted: '2026-10-26'
    title: 'Your Spell Book is organized'
    better-commands:
      - cmd: /spellbook
        what: 'Spells sorted into groups like Healing, Defense and Damage.'
        bedrock: 'crouch and press and hold with your wand, then tap a group.'
        java: 'Or type /spellbook and click a group.'
    changes:
      - 'Each group shows how many spells it has. Spells on your bar say which slot.'
      - 'All spells A to Z is there too, a page at a time.'
      - 'Gray spells are ones your wand gets at a higher rank.'
      - 'Picking a spell for your bar starts with the groups too.'

  - id: 2026-10-26-my-spell-bar
    date: Oct 26
    posted: '2026-10-26'
    title: 'Your own spell bar'
    new-commands:
      - cmd: /spellbar
        what: 'Pick which spells sit on your bar and in which slot.'
        bedrock: 'Spell Book, then My spell bar (change it)'
        java: 'Spell Book, then click [My spell bar (change it)]'
    changes:
      - 'Your bar now holds the spells you pick: 21 slots, 3 pages.'
      - 'New spells go into your first empty slot by themselves. A chat line tells you.'
      - 'Bar full? New spells wait in your Spellbook. Swap them in any time.'
      - 'In the Spell Book, tap a spell, then Put on my bar and pick a slot.'
      - 'Your bar is saved, even after you leave or the server restarts.'

  - id: 2026-10-26-wand-ranks-by-casting
    date: Oct 26
    posted: '2026-10-26'
    title: 'Your wand ranks up when you cast'
    changes:
      - 'Casting spells earns SP. Enough SP and your wand moves up a rank by itself.'
      - 'Same wand, every spell kept, plus the new rank''s spells. The whole server cheers.'
      - 'Beginner to Student 800 SP, then Apprentice 1,600, then Master 1,800. Rank-up time depends on useful play.'
      - 'Your SP is at the top of your Spell Book. A short line above your hotbar shows each gain.'
      - 'Weekends give SP x1.2. Casting near your party gives x1.25. Together x1.5.'
      - 'Each spell pays fully about once a minute. Healing pays when it really heals someone.'

  - id: 2026-10-26-wand-last-slot
    date: Oct 26
    posted: '2026-10-26'
    title: 'Tap bar: your wand lives in slot 9'
    changes:
      - 'Tap bar and Tap to pick: your wand moves to the last hotbar slot. Whatever was there swaps into its old slot.'
      - 'Phones and tablets, Tap bar: tap the wand again to get your items back.'
      - 'Computer, Tap bar: Q or right click puts your items back, same as before.'
      - 'Spell info now shows what each spell really does and what the next rank changes.'

  - id: 2026-10-26-tap-to-pick-fix
    date: Oct 26
    posted: '2026-10-26'

  - id: 2026-11-13-excelmenu-pins-rearrange-magic-door
    date: Nov 13
    posted: '2026-11-13'
    title: 'New: one-tap Spawn and Teleport pins, and a menu order of your own'
    new-commands:
      - cmd: /rearrange
        what: 'Open the menu editor: put the doors inside each section of your compass menu in your own order, reorder the sections too, or reset to the default order.'
        bedrock: 'Or tap Rearrange Menu at the bottom of the compass section picker.'

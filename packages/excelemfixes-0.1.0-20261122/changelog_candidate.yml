# ExcelWhatsNew news entries. NEWEST FIRST. After editing: /whatsnew reload (no restart).
#
# Each entry:
#   id:      unique, never reuse or rename (players' OK is saved by this id)
#   date:    short label for the title, e.g. "Oct 24"  -> "What's New (Oct 24)"
#   posted:  YYYY-MM-DD (for the join age limit in config.yml)
#   title:   one short line
#   new-commands:     list of {cmd, what, bedrock (optional), java (optional)}
#                     what = one plain line, kid-friendly. bedrock/java = the no-typing way
#                     (a compass button or a pop-up), shown only to that kind of player.
#   better-commands:  same shape, for commands that changed
#   changes:          short plain lines for everything else
# House style: plain words, short lines, no em dashes, no player names.
# Add a new entry at the TOP; everyone who has not seen it gets it once on their next join.
#
# GENERATED by whatsnew-pipeline/tool/generate.py from registry/whatsnew.yml.
# Do not edit this file by hand; edit the registry and re-run the generator.

entries:
  - id: 2026-11-22-quest-directions-glow
    date: Nov 22
    posted: '2026-11-22'
    title: 'NEW: Quest directions and glow guides'
    changes:
      - '/questwhere shows where to go for quests whose tracker shows no destination, like Severance payback and The trial of ice.'
      - 'Tap Guide me there and the entrance glows so you can find it.'
      - '/drops and /progress now have a Glow the way in button that lights up where a boss is found.'
      - 'In /progress, quests like those also have a guide button in Quests Remaining.'
      - 'One plugin box (ExcelEMFixes) now holds the drop guide, progress tracker, food healing and boss leash fixes. Same commands, nothing to relearn.'

  - id: 2026-11-22-elitemobs-menu
    date: Nov 22
    posted: '2026-11-22'
    title: 'NEW: EliteMobs button in your compass'
    changes:
      - 'Your compass Server Menu now has an EliteMobs button in the Travel row.'
      - 'Tap it for every EliteMobs command in one place: the EliteMobs menu,'
      - 'Drop Guide, My Progress, Quest XP, the guild, the Road to the Guild'
      - 'and Boss Rewards. Easy tapping on phone, tablet and console.'

  - id: 2026-11-22-dungeon-lockout-2h
    date: Nov 22
    posted: '2026-11-22'
    title: 'Dungeon loot lockout is now 2 hours'
    changes:
      - 'After you beat a dungeon boss, its loot now locks for 2 hours instead of 12.'
      - 'You can still re-run any dungeon right away. The lock is only on the loot.'

  - id: 2026-11-22-companion-drops-progress
    date: Nov 22
    posted: '2026-11-22'
    title: 'NEW: Drop Guide & Progress Tracker'
    changes:
      - '/drops shows what each boss and dungeon drops: pick a place, pick a boss, see its full drop list.'
      - '/progress shows your own record: quests, dungeons, boss kill counts and dungeon clears.'
      - 'The count''s color is your expertise, from gray Novice to light-blue Mastered.'
      - 'Works on Java and Bedrock.'

  - id: 2026-11-22-leash-96-blocks
    date: Nov 22
    posted: '2026-11-22'
    title: 'Bosses give up the chase at 96 blocks'
    changes:
      - 'An elite pulled more than 96 blocks from where it spawned now gives up the chase, heads home, and heals back to full when it gets there.'
      - 'Hit it on its way home and the fight starts again, with no heal.'
      - 'Inside 96 blocks, nothing changes: no resets, no free fights.'

  - id: 2026-11-22-foodheal-ooc-2pct
    date: Nov 22
    posted: '2026-11-22'
    title: 'Faster healing between fights in EliteMobs worlds'
    changes:
      - 'Healing between fights is faster in EliteMobs worlds: once you have been out of combat for 20 seconds, you now recover 2% of your health per second (up from 1%).'
      - 'Food still adds its own gradual healing on top.'

  - id: 2026-11-22-camp-warden-doors
    date: Nov 22
    posted: '2026-11-22'
    title: 'Camp Warden doors fixed'
    changes:
      - 'Camp Warden arena doors now both reopen when the boss dies.'

  - id: 2026-11-21-primis-sleep-wake-on-damage
    date: Nov 21
    posted: '2026-11-21'
    title: 'Primis bosses now wake up when you hit them'
    changes:
      - 'Fixed a bug where a sleeping Primis boss would not wake up if you were already standing close when it fell asleep.'
      - 'Now the first hit wakes the boss and the fight starts normally.'
      - 'This covers all 14 Primis bosses that can fall asleep during a fight.'

  - id: 2026-11-21-server-moved-home
    date: Nov 21
    posted: '2026-11-21'
    title: 'The server moved home: Bedrock has a new address'
    changes:
      - 'The server now runs from home instead of the rented host. Same world, same everything else.'
      - 'Java players change nothing: winkreyes.duckdns.org:20795, same as always.'
      - 'Bedrock players (phone, console, tablet): the old server entry no longer works. Add the new address featheredpineapple.wdn.gg, port 443.'
      - 'If it errors the first time, tap Join once more. That is normal on this connection.'
      - 'The old Bedrock address on port 25622 is gone for good.'

  - id: 2026-11-20-weekendxp-em-130
    date: Nov 20
    posted: '2026-11-20'
    title: 'Weekend bonus now covers EliteMobs skill XP too'
    changes:
      - 'Friday through Sunday, the weekend bonus now pays 1.2x EliteMobs skill XP as well as mcMMO and green-bar XP.'
      - 'The plugin was renamed ExcelWeekendXP to ExcelEMWeekendXP. Nothing else changes in play.'

  - id: 2026-11-20-trainingwheels-shield-014
    date: Nov 20
    posted: '2026-11-20'
    title: 'Family shield now covers every kind of hit'
    changes:
      - 'For protected players, all incoming damage is now reduced to a quarter, including boss rabbits and magic.'
      - 'Fall damage, suffocation and other environmental causes are not reduced.'
      - 'Elite hits keep their compensation: a protected player takes a quarter of the unscaled hit.'

  - id: 2026-11-20-questxp-target-110
    date: Nov 20
    posted: '2026-11-20'
    title: 'Choose where your quest XP lands'
    new-commands:
      - cmd: /questxp target
        what: 'Pin your quest XP to one skill, or use /questxp target highest for the default (highest weapon skill, plus Armor at one third).'
        bedrock: 'Or open /questxp menu and pick your skill on the form.'
        java: 'Or open /questxp menu and pick your skill in the chest menu.'
      - cmd: /questxp menu
        what: 'Open the quest XP picker. Bare /questxp opens it too.'
    changes:
      - 'The quest XP plugin was renamed ExcelQuestXP to ExcelEMQuestXP. The command stays /questxp.'
      - 'Quest XP still pays the moment you finish a quest, as before.'

  - id: 2026-11-20-foodheal-010
    date: Nov 20
    posted: '2026-11-20'
    title: 'Food now heals you in EliteMobs worlds'
    changes:
      - 'Food now heals you gradually in EliteMobs worlds: eating gives a small heal right away, then keeps healing you slowly while you are out of combat - better food heals more.'
      - 'Cleric heals are still the way to heal in a fight and to heal your friends.'

  - id: 2026-11-20-leash-010
    date: Nov 20
    posted: '2026-11-20'
    title: 'Bosses stay home after a leash return'
    changes:
      - 'Bosses that get dragged too far from home now stay home after they return — no more teleport-loop fights — and the tightest boss leashes got some breathing room.'

  - id: 2026-11-20-d164-primis-sharedloot
    date: Nov 20
    posted: '2026-11-20'
    title: 'Primis dungeon boss loot now shares properly'
    changes:
      - 'Dungeon boss loot in the Primis dungeons now shares to the whole eligible party instead of showering per-damager floor loot.'
      - 'The Feral Alpha Wolf, the Gladius Champion and the Mountain Pass Guardian no longer drop their extra floor loot.'

  - id: 2026-11-20-dungeon-lockout-12h
    date: Nov 20
    posted: '2026-11-20'
    title: 'Dungeon boss loot is earnable again after 12 hours'
    changes:
      - 'After you kill a dungeon boss, that boss pays loot and skill XP again after 12 hours instead of 72.'
      - 'You can run the dungeon again right away. Only the loot and skill XP wait.'
      - 'The 12 hours are per boss, per player.'

  - id: 2026-11-19-resurrection-open-targeting
    date: Nov 20
    posted: '2026-11-20'
    title: 'Resurrection now works on anyone'
    changes:
      - 'Resurrection now works on any downed player — no party needed.'
      - 'Aim your Resurrection spell at any downed player within 20 blocks to bring them back at half health.'
      - 'Before, the spell only worked on members of your own party. That rule is gone — help whoever you find.'
      - 'Mana, cooldown, and range are unchanged.'

  - id: 2026-11-20-shared-dungeon-loot
    date: Nov 20
    posted: '2026-11-20'
    title: 'Dungeon boss loot is now shared with everyone in your party'
    changes:
      - 'When your party kills a dungeon boss, every party member in the dungeon gets the same loot — an identical copy each, not one prize to split.'
      - 'No Need or Greed vote pops up for dungeon boss loot any more.'
      - 'Solo runs pay exactly as before. A party member still locked out from an earlier kill gets nothing while the rest are paid.'

  - id: 2026-11-20-questxp-backpay
    date: Nov 20
    posted: '2026-11-20'
    title: 'Old quests can now pay their EliteMobs XP'
    changes:
      - 'Quests you finished before the quest XP bridge landed can now pay the EliteMobs skill XP they earned.'
      - 'An operator pays it out for you. There is nothing you need to type.'
      - 'New quests still pay their XP the moment you finish them, as before.'

  - id: 2026-11-20-excelatlas-minimap
    date: Nov 20
    posted: '2026-11-20'
    title: 'A new Atlas map shows the valley as you walk it'
    changes:
      - 'Hold the Atlas to see a live map of the land around you, with your arrow in the middle and your family shown as markers.'
      - 'Zoom in and out with /atlas zoom in and /atlas zoom out. Three zooms: close, valley, and far.'
      - 'Family markers stay on the map even past the edge, clamped to the border in their direction.'
      - 'Your position, facing, and the land under you show in the action bar.'
      - 'An operator can hand you an Atlas. /atlas settings opens the settings menu.'

  - id: 2026-11-19-questxp-pays-elitemobs-xp
    date: Nov 19
    posted: '2026-11-19'
    title: 'Quests now pay EliteMobs skill XP'
    changes:
      - 'Finishing a quest now pays EliteMobs skill XP on top of the quest''s usual reward.'
      - 'Each of the 112 quests pays XP into the skill it fits. Shipwrecked! pays +20 Swords XP and +6 Armor XP, for example.'
      - 'Only the player who completes the quest is paid, even in a party.'
      - 'The quest menu does not show the extra XP yet. The grant message in chat is where you see it.'

  - id: 2026-11-19-login-grace-10s
    date: Nov 19
    posted: '2026-11-19'
    title: 'Logging in now gives you 10 seconds of safety'
    changes:
      - 'When you log in, no damage can touch you for 10 seconds.'
      - 'The safety ends the moment you move or attack, or when the 10 seconds run out.'
      - 'It works in every world.'

  - id: 2026-11-19-wilds-alive-again
    date: Nov 19
    posted: '2026-11-19'
    title: 'The wilds are alive again'
    changes:
      - 'Natural spawning is back on. Animals and monsters spawn naturally again.'
      - 'Monster and animal spawning had been switched off by accident since the server''s first days, which is why the world felt empty outside of events and dungeons.'
      - 'Some of the monsters that spawn naturally become Elite Mobs.'

  - id: 2026-11-19-revive-potion-open-targeting
    date: Nov 19
    posted: '2026-11-19'
    title: 'Revive Potions now work on anyone'
    changes:
      - 'Revive Potions now work on any downed player — no party needed.'
      - 'Carry a Revive Potion (Excel Shop, $5,000) and right-click any downed player to bring them back at half health.'
      - 'Before, only party members could be revived with a potion. That rule is gone — help whoever you find.'
      - 'One potion per revive, and a 10-minute rest before you can use another.'

  - id: 2026-11-18-excelitems-registry
    date: Nov 18
    posted: '2026-11-18'
    title: 'A custom-item registry now runs under the hood'
    changes:
      - 'ExcelItems is the shared foundation future shop items will be built on.'
      - 'Every custom item is registered once, with a permanent ID number and name the item itself carries.'
      - 'The first four are the Veil Potion, Death Protection, the Death Protection Potion and the Revive Potion.'
      - 'Items already in your bag are still recognized exactly as before.'
      - 'Nothing changes in play today. There is nothing new to buy or use yet.'

  - id: 2026-11-18-tdguard-hunger-flight
    date: Nov 18
    posted: '2026-11-18'
    title: 'Tower defense no longer costs you your hunger'
    changes:
      - 'Hunger no longer drains away across tower-defense sessions.'
      - 'When you enter tower defense, ExcelTDGuard remembers your food. When you leave, it gives that exact food back. Entered at 14, you leave at 14.'
      - 'Your flight is restored when you leave too. Flight you had before comes back, and the flight tower defense lends you is taken back on exit.'
      - 'If you disconnect in the middle of a session, the same restore happens when you rejoin.'
      - 'Nothing inside a tower-defense session changes.'

  - id: 2026-11-18-revive-potion-launch
    date: Nov 18
    posted: '2026-11-18'
    title: 'Revive Potions are here'
    changes:
      - 'New at the spawn shop: the Revive Potion, $5,000, on the Potions and Protection shelf.'
      - 'Carry one in your bag. Do not drink it.'
      - 'When a teammate is downed, walk up to them and use the Revive pop-up. It uses 1 potion and brings them back at half health.'
      - 'It works in EliteMobs worlds too, where wands do not.'
      - 'Clerics can learn Raise Ally at EliteMobs level 10: the same rescue with no potion, paid in GRACE, once every 10 minutes.'
      - 'The $5,000 price is a launch price. It may change as we see how it plays.'

  - id: 2026-11-17-phantom-debt-paid
    date: Nov 17
    posted: '2026-11-17'
    title: 'The Phantom Debt is paid'
    changes:
      - 'The Ender Dragon fell on October 30, 2026, so the haunted Monday-to-Thursday nights are over.'
      - 'Phantoms are turned off again every night, and nobody is hunted for skipping sleep.'

  - id: 2026-11-17-excelwandbars-0320
    date: Nov 17
    posted: '2026-11-17'
    title: 'Spell Book now shows locked summons: Summon 7 (+4 locked) (ExcelWandBars 0.3.20)'
    changes:
      - 'Your Spell Book now counts the summon spells you have not unlocked yet. On an Apprentice wand the Summon group reads Summon (7, +4 locked) on phone and console, and Summon 7 +4 on a computer.'
      - 'Open the Summon page and the four locked summons are listed by name: Guardian, Revenant, Ghast and Mount, each marked unlocks at Master.'
      - 'On a Master wand the count does not change: the Summon group reads Summon 11, with no locked suffix, because you know all 11.'
      - 'No spell changed how it works, what it costs, or the rank that unlocks it. Only the Spell Book display changed, so you can see what is coming.'
      - 'Still to check in game: open the Spell Book on an Apprentice wand and confirm the Summon group shows the +4 locked suffix.'

  - id: 2026-11-16-exceldowned-015
    date: Nov 16
    posted: '2026-11-16'
    title: 'Boot check fixed: no more false revive spell warnings (ExcelDowned 0.1.5)'
    changes:
      - 'The warnings at server start that said the Resurrection and Group Renewal spell templates did not resolve were a timing mistake: the check ran before Magic had finished loading its spells. Both spells were always there.'
      - 'The check now waits until Magic has loaded, and both templates confirm they resolve. The false warnings are gone.'
      - 'Nothing you play changes: being downed, /giveup, the 5 minute bleed-out and party Resurrection revives at half health are exactly as before.'
      - 'Still to check in game: a live party revive retest with real players. The revive itself is unchanged by this fix.'

  - id: 2026-11-16-exceltogether-060
    date: Nov 16
    posted: '2026-11-16'
    title: 'One party, two faces: /em party now forms the party too (ExcelTogether 0.6.0)'
    changes:
      - 'There is still one party, and it now keeps one roster of record. ExcelTogether saves the roster itself and restores it when the server starts, instead of rebuilding it from the other party systems.'
      - 'The EliteMobs face now forms the party natively: invite with /em party and the invite stays live while it waits, and accepting with /em party completes the same one party, the same people you see with /party list and in the party hub.'
      - 'The /party door is unchanged: /party (also /excelparty) invites and accepts, the EliteMobs [ACCEPT] popup still joins the same party, and party chat and /ptp still pass through to mcMMO.'
      - 'Leaving at any face ends the party everywhere, and a party formed with no invite behind it still does not stick.'
      - 'Still to check in game: form a party both ways with a second player, once starting from /em party and once from /party with the popup, and confirm both faces show the same pair.'

  - id: 2026-11-16-excelbosstrial-057
    date: Nov 16
    posted: '2026-11-16'
    title: 'Boss rewards chest gains a Back button (ExcelBossTrial 0.5.7)'
    changes:
      - 'The boss rewards chest (Your earned rewards, opened with /bossrewards) now has a Back button: the arrow in the bottom row labelled Back to Server Menu, between Previous page and Refresh.'
      - 'Tap Back and the chest closes and the Server Menu opens. It claims nothing and changes nothing: any reward you have not claimed stays waiting for you.'
      - 'The other bottom-row buttons are unchanged: Previous page and Next page turn the pages of your rewards, and Refresh in the middle reloads the list.'
      - 'Still to check in game: open /bossrewards, tap Back, and confirm you land on the Server Menu - on a computer and on a phone or console, which shows this same chest.'

  - id: 2026-11-16-exceldowned-014
    date: Nov 16
    posted: '2026-11-16'
    title: 'Party revive works again: Resurrection brings friends back (ExcelDowned 0.1.4)'
    changes:
      - 'A party member can revive you again: the Resurrection spell now finds your party properly and brings a downed party member back at half health.'
      - 'Party alerts are back too: your party is told when you go down and when you are revived.'
      - 'Nothing else about being downed changes: the 5 minute bleed-out, /giveup and the downed health rules are exactly as before.'
      - 'Solo play is unchanged: only a member of your own party can revive you with Resurrection.'

  - id: 2026-11-16-excelsummons-0114
    date: Nov 16
    posted: '2026-11-16'
    title: 'Summons fight for your party again (ExcelSummons 0.1.14)'
    changes:
      - 'Your summons now share targets with your party: when a party member is fighting, your combat summons join that fight instead of waiting for a target of your own.'
      - 'A Guardian summon can now taunt an enemy off a party member, pulling it onto the Guardian - not just off you.'
      - 'Retaliation works again for casters in a party: if someone outside your party hits you, your summons can answer back. Solo play is unchanged.'

  - id: 2026-11-16-mcmmo-xpfix
    date: Nov 16
    posted: '2026-11-16'
    title: 'mcMMO XP: EliteMobs worlds and practice targets pay none'
    changes:
      - 'mcMMO XP now pays zero while you stand in an EliteMobs world: the Adventurers Guild hall, Primis, every EliteMobs adventure and dungeon (including instanced copies) and Goblin Kingdom.'
      - 'EliteMobs rewards, Jobs money and ordinary (vanilla) XP still pay in those worlds exactly as before - only mcMMO skill XP is off there.'
      - 'Training dummies pay no mcMMO XP anywhere: the guild training dummies and your own /dummy practice dummies are for testing damage, not for levelling.'
      - 'Summons you cast pay no mcMMO XP when you hit them, and a cast summon fighting for you earns you no Taming XP. Your adopted pets are unaffected: a pet you tamed yourself still earns you Taming XP as it fights.'
      - 'Targets RewardGuard has denied pay no mcMMO XP either, and attacks from dummies or summons no longer grant Acrobatics dodge XP.'

  - id: 2026-11-16-eternaltd-1710
    date: Nov 16
    posted: '2026-11-16'
    title: 'Tower defense is here: EternalTD adds 16 levels'
    changes:
      - 'Tower defense is here. EternalTD was added on November 16, 2026, with 16 levels: the tutorial, 5 Grassy Lands levels, 5 Rising Sun levels, and 5 Depths levels. The Depths levels are the hard set.'
      - 'Start with the tutorial: it teaches towers, gold, and waves before the real levels. Open the Travel menu and tap Tower Defense to reach the tower defense hub, or type /etd hub.'
      - 'At the Adventurers Guild hall, talk to the TD Herald: the guild NPC sends you straight to the tower defense hub, the same place the Travel entry goes.'
      - 'Place towers to stop each wave before it reaches the end of the path. Leave a level with /etd quit, which is separate from the EliteMobs /em quit. The Guide now teaches tower defense too: ask it about tower defense or EternalTD.'

  - id: 2026-11-15-magic-arrow-balance
    date: Nov 15
    posted: '2026-11-15'
    title: 'Wand arrows hit for their real numbers'
    changes:
      - 'Wand arrow spells were hitting far harder than written.'
      - 'The game was multiplying the arrow part by flight speed.'
      - 'The top Arrow spell landed about 58 damage per cast.'
      - 'It now lands about 23 per cast: 7 from the arrow, 16 from its extra hit.'
      - 'That is level with a Power V bow, as the spell was written.'
      - 'Ice Arrow and Shock Arrow now land about 9 per hit.'
      - 'Normal Arrow now lands about 9 per hit.'
      - 'Lower Arrow steps scale down from the top step. Arrow Rain is unchanged.'
      - 'Mana, cooldowns and the spell list are unchanged.'

  - id: 2026-11-15-excelautosort-023
    date: Nov 15
    posted: '2026-11-15'
    title: 'Chest filter toggle, Auto-sort on Chest Tools'
    changes:
      - 'Chest filters now have a Filter ON/OFF toggle inside the filter dialog itself.'
      - 'On Java it is the lever in selector slot 3, beside the mode row.'
      - 'On Bedrock it is the first button on the main filter form.'
      - 'Turning a filter OFF applies at once and stays off. The saved list is kept.'
      - 'Turning it back ON re-arms the filter in the mode the chest last used, through the usual confirm first.'
      - 'If the chest never filtered, turning ON starts in Keep only these mode.'
      - 'The Auto-sort switch moved: it is now on the Chest Tools page, not under Settings and Toggles.'

  - id: 2026-11-15-excelmenu-303-party
    date: Nov 15
    posted: '2026-11-15'
    title: 'Party is on the Server Menu main page too (ExcelMenu 3.0.3)'
    changes:
      - 'Party is now on the Server Menu main page too - and it is still in Travel, just like before. Both doors open the same Party page.'
      - 'On phone, tablet and console Party is pinned at the top of the menu, with Spawn and Teleport: one tap opens the Party page.'
      - 'On a computer nothing moves: Party stays in the Travel row of the menu, exactly as before.'
      - 'Your own saved menu order is unchanged, and Party still follows your Travel order in the rearrange editor.'

  - id: 2026-11-15-guild-front
    date: Nov 15
    posted: '2026-11-15'
    title: 'Adventurers Guild moves to the front of the Server Menu'
    changes:
      - 'The Adventurers Guild is now right under Spawn on the Server Menu main page - it is open and ready for daily use.'
      - 'On phone, tablet and console the Guild button is pinned second, right below Spawn, and it no longer sits in the Travel form. On a computer nothing moves: the Guild stays in the Travel row, second after Spawn. Your own saved menu order is unchanged.'

  - id: 2026-11-15-free-goblins
    date: Nov 15
    posted: '2026-11-15'
    title: 'Goblin events are live: 10 goblin bosses roam the world'
    changes:
      - 'Goblin events are live. The Free Goblins Events Pack added 10 timed goblin events to Wink Reyes Valley on November 15, 2026. They are always on: no setup, no sign-up, and nothing to unlock.'
      - 'A goblin event starts near a player out in the world and is announced in chat: a goblin boss appears for a short time. There are 10 different goblin bosses, with names like Treasure Hunter Goblin, Gold Tooth Goblin, Doom Shroom Goblin and Master Blacksmith Goblin.'
      - 'Every goblin boss scales to the player who triggers it. The boss level is dynamic, not fixed, so a goblin event is a fair fight at any rank: new players and veterans can both join in when one fires near them.'
      - 'Goblin events run on their own timers, so you may not see one right away. Keep playing out in the world, watch chat for the announcement, and head over when one starts. The Guide now teaches goblin events too: ask it about goblin events.'

  - id: 2026-11-15-event-megapacks
    date: Nov 15
    posted: '2026-11-15'
    title: 'World events are live: 100 new events roam the world'
    changes:
      - 'World events are live. Two event packs (Event Megapacks 1 and 2) added 100 world events to Wink Reyes Valley on November 15, 2026. They are always on: no setup, no sign-up, and nothing to unlock.'
      - 'Most events are timed events: one starts near a player out in the world, it is announced in chat, and a boss appears for a short time. The other events are action events that can trigger while you play, for example while mining, fishing or farming.'
      - 'Every event boss scales to the player who triggers it. The boss level is dynamic, not fixed, so an event is a fair fight at any rank: new players and veterans can both join in when one fires near them.'
      - 'Events run on their own timers, so you may not see one right away. Keep playing out in the world, watch chat for the announcement, and head over when one starts. The Guide now teaches world events too: ask it about world events or timed events.'

  - id: 2026-11-15-primis-courier-flights
    date: Nov 15
    posted: '2026-11-15'
    title: 'Getting around Primis: ride the Primis Courier griffins'
    changes:
      - 'You do not have to walk all of Primis. Primis has a griffin flight network: a griffin called the Primis Courier carries you between five lighthouse flight points - Caerulium Lighthouse, Farmstead Lighthouse, Pontis Mille, Nemus Groves and Ice Village. It has been live since Primis opened; this entry exists because nothing on the server explained it until now.'
      - 'How to fly: go to a flight point you have unlocked, use the flight master or the flight portal there, and pick your destination. The Courier picks you up and flies you there. You ride, you do not steer, and it is not a mount you own or summon - the Courier belongs to the flight network.'
      - 'Every flight point starts locked, and each one unlocks when you finish a quest. The Lighthouse Keeper unlocks the first two points: Caerulium Lighthouse and Farmstead Lighthouse. A quick delivery unlocks Pontis Mille, Feeding the sick unlocks Nemus Groves, and Gotta keep warm unlocks Ice Village. You can only depart from a flight point you have unlocked, and a locked point''s hint names the quest that opens it.'
      - 'New to Primis? Follow the main quest chain and work through The Lighthouse Keeper early - your quest compass points at the target of the quest you are tracking while you do. The Guide now teaches the flights too: ask it about the Primis Courier or griffin flights. Wormholes also link places inside the Primis map, including the lighthouse flight portals.'

  - id: 2026-11-15-excelbosstrial-056
    date: Nov 15
    posted: '2026-11-15'
    title: 'Boss cash tapers, seals can cycle'
    changes:
      - 'Seal boss cash now tapers by your own lifetime clears of that seal.'
      - 'First clear: Warden $10,000, every other seal $5,000.'
      - 'Second clear: Warden $7,000, every other seal $3,500.'
      - 'Third clear: Warden $5,000, every other seal $2,500.'
      - 'Fourth and later clears pay $0 cash.'
      - 'XP, jackpot rolls and the war chest still pay in full at every clear.'
      - 'Seals can be broken again in a new cycle. The guild, once opened, stays open.'
      - 'The first time you personally break a seal, your first-break extras pay once ever for that seal.'
      - 'Elder Guardian progress expires after 24 hours from the first counted kill.'


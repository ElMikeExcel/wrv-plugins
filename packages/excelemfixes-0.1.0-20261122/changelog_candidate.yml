    changes:
      - 'Wands now handle older saved items correctly, preserve spell progress, and use the correct learned level when casting.'
      - 'Menus reject outdated screens and confirmations after reloads.'
      - 'Wand history checks avoid unnecessary item copying.'
      - 'Bedrock 26.40 through 26.60 can connect. Older versions need a game update.'
      - 'Fixed a chest-related error that could cause heavy lag.'
      - 'Java shop-menu buttons stay matched to their displayed items when refreshed.'
      - 'Shop logging handles failures more safely.'
      - 'Gear settings are protected from a failed-save overwrite.'

  - id: 2026-10-29-silk-touch-storage-warnings

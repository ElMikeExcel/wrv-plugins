name: ExcelProtect
version: '0.1.13'
main: com.winkreyes.excelprotect.ExcelProtect
api-version: '1.21'
authors: [Iris, Mike]
website: https://winkreyesvalley.com
license: MIT
description: 'ExcelProtect — the all-in-one record + recovery system: append-only daily JSONL per stream (blocks, containers, entities, items, players, locations, economy, audit, combat, damage, dealt, healing, deaths), byte-exact item payloads, rollback, death restores and Lost & Found, plus 0.1.5 Clarity (delivery outcomes, item chains, chain-of-custody query, per-player timelines) and 0.1.6 Recovery (working from=/to= time filters with loud errors, entity rollback, inventory rollback from death snapshots, container undo, WorldEdit logging) and 0.1.7 Parity (the DeathRecord importer honors restored marks and migrates Lost & Found player state; entity_death records carry Telemetry-parity elite, weapon, origin-taxonomy and damage-share fields) and 0.1.8 Attribution (heal attribution fixed end-to-end — cast claims with target sets, effective/overheal splits, splash potions credited once; spell damage reads its spell name through the thrown-potion costume Magic delivers it in, with an explicit delivery field on every damage record; item_break capture for tools/armor worn to destruction; the healing report answers spell used, who was healed, and by how much, aggregated per cast) and 0.1.9 Item-break fix (an item whose meta carries damage but no max_damage component is recorded with the material fallback instead of throwing and recording nothing) and 0.1.10 Audit Watch (a per-player gameplay audit log under audit/<player>-<day>.jsonl: spell casts with mana cost and pool numbers, summon spawn/despawn, mana-reserve re-derivations and summon refusals, readable with /excelprotect audit) and 0.1.11 EM block attempts (cancelled block break/place attempts in EliteMobs-protected worlds recorded per player as block_attempt — evidence only, never rollback input) and 0.1.12 EM interception fix (attempts are also observed at the real EliteMobs interception points — cancelled BlockDamageEvent for breaks and denied BlockCanBuildEvent for places, attempted type from the event — with the terminal break/place handlers kept as backstops and an additive via field naming the observation point, so attempts in protected EM worlds record again) and 0.1.13 Event Time (combat_heal records written after the heal-attribution hold carry an additive event_ts_ms field holding the original event time of the regain, and held heals are flushed on plugin disable instead of being dropped from the combat stream). Query with /excelprotect export, where, playtime, item, timelines and inspect — no database.'
softdepend: [GriefPrevention, Vault, mcMMO, Magic, EliteMobs, WorldEdit, ExcelSummons]
commands:
  excelprotect:
    description: Export, inspect, damage incidents, location timelines, item chains, player timelines, rollback, restores, import, status
    usage: /excelprotect export|inspect [player <name>|at <world> <x> <y> <z>]|damage <player> [hours]|dealt <player> [hours]|healing <player> [hours]|where <player> [hours]|playtime <player> [days]|item <player> <item> [hours]|audit <player> [hours]|timelines rebuild [day]|rollback|restore-stand|restore-entity|restore-inventory|deaths|import|status ...
    permission: excelprotect.admin
  lostfound:
    description: Recover your own destroyed items from the ledger
    usage: /lostfound [claim <number>]
    aliases: [recover]
  deathrecord:
    description: Staff lookup of death snapshots and the burn ledger
    usage: /deathrecord <player>
    permission: excelprotect.admin
permissions:
  excelprotect.admin:
    description: Export, rollback, restores, import, status, /deathrecord
    default: op
  excelprotect.lostfound:
    description: Use /lostfound
    default: true

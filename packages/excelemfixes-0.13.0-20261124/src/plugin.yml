name: ExcelEMFixes
version: 0.13.0
main: excelemfixes.ExcelEMFixes
api-version: '1.13'
softdepend: [EliteMobs, Geyser-Spigot, Jobs, ExcelItems, Vault, mcMMO]
description: Community workarounds for EliteMobs defects, packaged as toggleable modules (EliteMobs' own files are never edited). Module quest-destinations (/questwhere) gives players the destination for quests whose EliteMobs tracker shows none (instanced-boss quests; upstream EliteMobs issue #241). Module jobs-dummy-gate vetoes Jobs payments for EliteMobs' guild training dummies (Jobs is a softdepend; the module idles without it). Module field-medic adds the Field Bandage, an in-combat heal-over-time consumable whose item registers through ExcelItems (a softdepend; the module stays off without it), and the Strong Healing Potion (registry ID 7), sold through the ExcelShops special-products listing and the guild vendor via the module's /fieldmedic and /guildvendor review/confirm buy flows (Vault is needed only for the purchases). Module summon-mount (/mountcharm) is the interim mount product — a buyable Mount Charm in the ExcelItems registry (ExcelItems is a softdepend of the pack and a hard requirement of that module only; without ExcelItems the module stands down and the rest of the pack is unaffected; Vault is needed only for its purchases). Since 0.8.0 the same module also carries the premium flying tier (/ghastcharm): the Ghast Charm (registry ID 9), a carry-and-toggle charm for a rideable happy ghast, sold only to players who have finished at least half the quests of one configured quest package (the gate reads EliteMobs quest data and fails closed when it cannot). Module mcmmo-xp-connector rebalances mcMMO XP for EliteMobs content — per-damage XP from EliteMobs entities is replaced by fixed kill awards under an hourly ceiling (mcMMO is a softdepend; the module stands down without it). Module quest-beacon (/questbeacon) adds a per-player pillar of light at a tracked quest's destination (particle packets only to that player — no blocks are placed; it reads the quest-destinations table through the pack's destination API and stands down when that module or EliteMobs is absent). Module quest-giver-glow (no commands — a background fix) lights up each EliteMobs quest NPC that has a quest the looking player can pick up right now — per player, through per-viewer metadata packets, so an NPC glows only on the screen of a player it has a quest for (a second color marks an NPC a finished quest is turned in at); availability is EliteMobs' own accept check read from its own data, and the module idles when EliteMobs is absent or the packet bridge is unavailable. Module clarity-menus (/emguide) is the pack's plain-language front door for EliteMobs itself, built after an experienced player could not find how to claim his skill bonuses in EliteMobs' screens: it explains skill bonuses (including the click-the-skill claiming step EliteMobs never states), quests (including the safe way to check a quest), shops and Elite Coins, and the gear tools, and opens the matching EliteMobs screen for the player at each step; all of its wording lives in clarity-menus.yml (bundled; a data-folder copy overrides it). Module commands are registered dynamically at runtime, so a disabled module's commands do not exist; only /emfixes is declared here.
commands:
  emfixes:
    description: ExcelEMFixes status and reload.
    usage: /emfixes [reload]
    permission: excelemfixes.admin
permissions:
  excelemfixes.admin:
    description: Reload ExcelEMFixes and its modules.
    default: op

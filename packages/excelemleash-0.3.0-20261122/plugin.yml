name: ExcelEMLeash
version: 0.3.0
main: com.winkreyes.excelemleash.ExcelEMLeash
api-version: '1.21'
softdepend: [EliteMobs]
description: MMO-style leash (D183) — an elite fights normally within 96 blocks of its spawn point; pulled past it, it deaggros, walks home, and heals on arrival unless damaged on the way. EM's native leash is suppressed in memory so it can never engage underneath.
author: WinkReyesValley

name: ExcelEMFixes
version: 0.7.0
main: excelemfixes.ExcelEMFixes
api-version: '1.13'
softdepend: [EliteMobs, Geyser-Spigot, Jobs, ExcelItems, Vault, mcMMO]
description: Community workarounds for EliteMobs defects, packaged as toggleable modules (EliteMobs' own files are never edited). Module quest-destinations (/questwhere) gives players the destination for quests whose EliteMobs tracker shows none (instanced-boss quests; upstream EliteMobs issue #241). Module jobs-dummy-gate vetoes Jobs payments for EliteMobs' guild training dummies (Jobs is a softdepend; the module idles without it). Module field-medic adds the Field Bandage, an in-combat heal-over-time consumable whose item registers through ExcelItems (a softdepend; the module stays off without it), and the Strong Healing Potion (registry ID 7), sold through the ExcelShops special-products listing and the guild vendor via the module's /fieldmedic and /guildvendor review/confirm buy flows (Vault is needed only for the purchases). Module summon-mount (/mountcharm) is the interim mount product — a buyable Mount Charm in the ExcelItems registry (ExcelItems is a softdepend of the pack and a hard requirement of that module only; without ExcelItems the module stands down and the rest of the pack is unaffected; Vault is needed only for its purchases). Module mcmmo-xp-connector rebalances mcMMO XP for EliteMobs content — per-damage XP from EliteMobs entities is replaced by fixed kill awards under an hourly ceiling (mcMMO is a softdepend; the module stands down without it). Module quest-beacon (/questbeacon) adds a per-player pillar of light at a tracked quest's destination (particle packets only to that player — no blocks are placed; it reads the quest-destinations table through the pack's destination API and stands down when that module or EliteMobs is absent). Module commands are registered dynamically at runtime, so a disabled module's commands do not exist; only /emfixes is declared here.
commands:
  emfixes:
    description: ExcelEMFixes status and reload.
    usage: /emfixes [reload]
    permission: excelemfixes.admin
permissions:
  excelemfixes.admin:
    description: Reload ExcelEMFixes and its modules.
    default: op

name: ExcelTrainingWheels
version: 0.1.7
main: com.winkreyes.exceltrainingwheels.ExcelTrainingWheels
api-version: '1.13'
softdepend: [EliteMobs, ExcelGuildGate, ExcelRaidBuff, floodgate, ExcelTips, ExcelMobVeil]
author: WinkReyesValley
description: 'Gentler start for players: door guard, safety tweaks, and Night Hearing after Seal 2. Zombies break wooden doors, copper and iron doors fall to sieges.'
commands:
  trainingwheels:
    description: Training Wheels admin (list / add / remove / setfactor / reload).
    usage: /trainingwheels list | add <player> [factor] | remove <player> | setfactor <player> <factor> | reload
    permission: exceltrainingwheels.admin
    aliases: [tw]
permissions:
  exceltrainingwheels.admin:
    default: op

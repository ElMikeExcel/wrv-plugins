# ExcelTrainingWheels — the Training Wheels Protocol.
# Protection follows the listed player, invisibly: no messages, titles,
# particles or sounds are ever shown to a protected player. Admins
# manage the list with /trainingwheels (alias /tw); edits persist
# to this file immediately (Bukkit rewrites it, comments included
# here will be lost on the first command edit — the settings and
# the list are what matter).

# Master switch. false = shield scales nothing, door guard cancels
# nothing, no sieges run.
enabled: true

# Verbose console logging of shield scalings, door guards, siege
# resets, LIFESTEAL heals and BEDROCK GRACE windows. Console only — never anything in game.
debug: false

shield:
  # Factor used by "/trainingwheels add <player>" when none is given.
  default-factor: 0.5

  # SEAL COMPENSATION (0.1.1 — Mike's ABSOLUTE LINE, Oct 19, 2026):
  # a protected player takes HALF (their base factor) OF A MOB'S
  # NORMAL, UNSCALED DAMAGE, at every seal state, in every world.
  # EliteMobs multiplies an ELITE's outgoing damage by the ladder
  # step below (its MobCombatSettings scaledDamageToPlayerMultiplier),
  # so against elite damagers the shield divides the player's base
  # factor by the CURRENT step: factor = base / dealt. Non-elite
  # mobs are never ladder-scaled and always use the flat base
  # factor. The seal count is read live from ExcelGuildGate
  # (cached; refreshed on join and every 30 seconds) — this table
  # must mirror the mob-scaling ladder whenever the ladder changes.
  compensation:
    # Master switch for the division above. false = 0.1.0 behavior
    # (flat base factor against everything, elites included).
    enabled: true
    # Seal count to assume when GuildGate's state cannot be read
    # (plugin absent or API unreachable). 0 = today's ladder step.
    # The shield NEVER guesses weaker than this silently: the
    # fallback is logged at enable and on every transition.
    assume-seal: 0
    # DIVISOR SOURCE (0.1.6, Oct 25, 2026). live = divide each
    # elite hit by the multiplier EliteMobs actually applied to it,
    # read live from EliteMobs: scaledDamageToPlayerMultiplier for
    # natural (ladder-scaled) elites, normalizedDamageToPlayerMultiplier
    # for dungeon / instanced bosses (normalized combat), and
    # damageToPlayerMultiplier for any other custom boss. If that
    # read ever fails, the table below is used (0.1.5 behavior) and
    # it is logged. table = always use the table (0.1.5 behavior).
    # The divisor never goes below 1.0. Missing key = live.
    source: live
    # Worlds where compensation does NOT apply (the flat base factor
    # governs elites there). With source: live, dungeon and
    # instanced bosses are divided by their own (normalized)
    # multiplier, so the EliteMobs worlds do NOT need to be listed.
    excluded-worlds: []
    # Seal ladder by seals broken (the Elite Seal Ladder, Mike,
    # Oct 25, 2026): EliteMobs scaledDamageToPlayerMultiplier at each
    # step. Seal 4 is the peak; Seal 5 is spawn-only (repeats 2.20).
    # With source: live this is the FALLBACK; a mismatch against
    # the live EliteMobs value is logged as a WARNING so the two
    # stay in sync. Keep it equal to the MobCombatSettings step.
    dealt-multipliers:
      "0": 1.60
      "1": 1.75
      "2": 1.90
      "3": 2.05
      "4": 2.20
      "5": 2.20

doors:
  # Door TIERS (Mike, Oct 19, 2026): the better the door, the
  # longer it buys you — time to get out and fight. Wooden doors
  # break at vanilla pace (~14s on Hard) and iron doors fall to
  # the 60s siege below; COPPER sits between at ~45s and rides
  # the same siege machinery as iron, at this threshold: while a
  # mob hunts an unprotected player (or a villager) at a copper
  # door, cracks and banging build for this many seconds, then
  # the door is destroyed with no drop. Vanilla NEVER completes
  # a copper break on its own — the completion is suppressed —
  # so the tier cannot be rushed. Tiers are a property of the
  # DOOR, not the mob or its target (zombie family, vindicators,
  # villager hunts — same tier); the one exception is the door
  # hold: a mob hunting a protected player never starts a siege
  # and its vanilla attempts are stopped outright — any door
  # holds indefinitely for a protected player. (An earlier draft
  # stretched vanilla by holding each completed break a counted
  # number of times; the rig proved a cancelled zombie does not
  # reliably re-attempt, so the deterministic siege won — see
  # BUILD.md.) 0 disables the tier (copper breaks at vanilla
  # pace again).
  copper-target-seconds: 45

  # ALL ZOMBIES BREAK DOORS (0.1.3 — Mike, Oct 23, 2026, 11:14 PM
  # CDT). Vanilla only lets up to 10% of zombies break doors (rolled
  # at spawn, scaled by regional difficulty), so most zombies just
  # stand at a wooden door forever. true = every zombie of the
  # types below can break doors (new spawns, plus older zombies as
  # their chunks load). EliteMobs elites are left alone. The door
  # hold above still wins: a mob hunting a protected player never
  # breaks any door. A missing key counts as true. false = vanilla.
  all-zombies-break-doors: true
  # Types granted (Bukkit entity names). Drowned have no door goal
  # and are always ignored. ZOMBIFIED_PIGLIN may be added (opt-in).
  break-door-types: [ZOMBIE, HUSK, ZOMBIE_VILLAGER]

  # WOOD-DOOR SAFETY NET (0.1.7, Oct 25, 2026). Vanilla zombies only
  # break wooden doors on Hard (the server's permanent setting), so
  # this normally does nothing. If the world is ever on Easy or
  # Normal, a zombie of the family above hunting an unprotected
  # player at a wooden door brings it down after this many seconds
  # (same siege machinery as copper and iron, no drop). The door
  # hold still wins. Missing keys = true / 12. The seconds also
  # time a wooden door worked by a zombie that Night Hearing sent to
  # it (night-hearing.steer-to-doors), on any difficulty.
  wood-fallback-off-hard: true
  wood-fallback-seconds: 12

lifesteal:
  # LIFESTEAL ON KILL (0.1.4 - Mike, Oct 24, 2026, 8:33 AM CDT): a
  # little passive sustain. A protected player who kills a hostile
  # mob regains mob-hp; killing an EliteMobs elite regains elite-hp
  # (2 HP = 1 heart). Capped at max health. Never from killing
  # players, passive animals, or mobs from a spawner cage (farm
  # guard). Projectile kills count when the player gets the kill.
  # Missing keys = the defaults below. Values clamp to 0..20.
  enabled: true
  mob-hp: 2.0
  elite-hp: 4.0
  # Small green "+1 heart" on the killer's action bar.
  show-actionbar: true

log:
  # DOOR LOG THROTTLE (0.1.5, Oct 24, 2026): door console lines
  # (siege started, door guard/tier, door-breaking grants, resets)
  # print at most once per door per this many seconds; repeats are
  # counted and the next line shows "+N similar". "Siege complete"
  # lines (a door was destroyed) are never throttled.
  # Missing key = 300. 0 = off (every line, the 0.1.4 behavior).
  door-throttle-seconds: 300

bedrock-grace:
  # BEDROCK LOADING-SCREEN GRACE (0.1.6, Mike, Oct 25, 2026, 12:47 PM
  # CDT). Bedrock (Floodgate) players sit on a loading screen after
  # joining, respawning or changing world while already standing in
  # the world, and can be hit before they can see. For this many
  # seconds after each of those moments, incoming damage is
  # cancelled and mobs cannot target them. VOID, KILL and SUICIDE
  # always still apply (and LAVA unless allow-lava is false), so
  # nobody can get stuck. The window ends early the moment the
  # player attacks something or breaks a block. Java players are
  # never affected. Missing keys = the defaults below.
  enabled: true
  # 0 = off; clamps to 0..30.
  seconds: 4
  # true = lava still burns inside the window.
  allow-lava: true
  # Small grey action-bar line when the window starts.
  show-actionbar: true
  actionbar-message: "Loading in... protected"

night-hearing:
  # NIGHT HEARING (0.1.7, Mike, Oct 25, 2026, 2:34 PM CDT). From
  # Seal 2 on, at night (world time 13000-23000), in the overworld,
  # zombies HEAR loud player actions and come for the player who
  # made them: doors, trapdoors and fence gates; breaking and
  # placing blocks; hitting and shooting; opening containers; note
  # blocks and jukeboxes. Walking and sprinting are silent (see
  # hear-footsteps). Only an idle zombie (no target) of the types
  # below hears, within range blocks of the noise (half while
  # sneaking). It never spawns mobs and never breaks anything by
  # itself: the door rules above do the rest (every zombie breaks
  # wood; copper 45s; iron 60s; any door holds for a protected
  # player). Protected players are never heard. Nor are creative,
  # spectator, the Bedrock loading grace, MobVeil, or sleepers.
  # EliteMobs elites never hear. Missing keys = the defaults below.
  enabled: true
  # Seals broken (ExcelGuildGate) before hearing starts. If the
  # seal count cannot be read, hearing stays OFF.
  min-seals: 2
  # Blocks a noise carries (clamps 1..48). Sneaking halves it.
  range: 16
  # true = footsteps and sprinting also count (very harsh).
  hear-footsteps: false
  types: [ZOMBIE, HUSK, ZOMBIE_VILLAGER]
  # At most this many zombies answer one noise, and at most this
  # many hunt one player at once.
  max-per-noise: 3
  max-per-player: 6
  # After a noise pulls a zombie, that player's next noise is not
  # heard for this many seconds.
  cooldown-seconds: 20
  # A pulled zombie gives up after this many seconds without
  # reaching the player AND without working on a door toward them
  # (a zombie busy at a door keeps its hunt, so the 45s copper and
  # 60s iron sieges finish).
  give-up-seconds: 60
  # Vanilla zombies do not walk through a closed door to reach you:
  # with no open way in, a zombie goes to the outside spot closest
  # to you (usually a bare wall) and stands there. With this on, a
  # heard zombie that has no way in is sent to the outside face of
  # a door within steer-radius blocks of you instead, and works
  # that door on its own siege: wooden doors wood-fallback-seconds
  # (doors section, default 12, about vanilla Hard), copper 45s,
  # iron 60s. When the door is down it comes in after you.
  steer-to-doors: true
  steer-radius: 12
  # While hearing is live, the bed always works, even with monsters
  # nearby. Getting into bed makes you silent and the zombies
  # hunting you lose interest.
  bed-always-works: true
  # Worlds never affected (the overworld only is affected anyway).
  excluded-worlds: []
  # Any world whose name starts with one of these is excluded
  # (EliteMobs dungeon and instanced worlds).
  excluded-world-prefixes: ["em_"]
  # Debug aid: log every vibration key heard while live (noisy).
  log-event-keys: false
  # One public tip through ExcelTips, at most once per night
  # (ExcelTips caps total shows). An ExcelTips tips.yml entry named
  # night-hearing overrides these words.
  tip:
    enabled: true
    title: "Night hearing"
    text: "The dead can hear you at night. Sneak, or sleep."

siege:
  # Seconds of accumulated siege (zombie at the door, hunting an
  # unprotected player) before an iron door is destroyed. Wooden
  # doors break far faster in vanilla — iron is the slow, loud one.
  threshold-seconds: 60
  # Seconds a siege may go unobserved (zombie knocked away, target
  # ducked out) before its progress resets to zero.
  grace-seconds: 3
  # Hard cap on doors under siege at once (performance guard).
  max-concurrent: 8
  # Siege evaluation cadence in ticks (10 = twice a second).
  cadence-ticks: 10

protected:
  # Protected players live here, keyed by UUID. Add them in-game or from
  # the console with /tw add <player> [factor]; that writes this section.
  # Example shape:
  #   "00000000-0000-0000-0000-000000000000":
  #     factor: 0.5
  #     name: "ExamplePlayer"
  players: {}

name: ExcelRewardGuard
version: '1.2'
main: com.winkreyes.rewardguard.ExcelRewardGuard
api-version: '1.21'
author: Moon (provenance candidate) and Argus (enforcement completion)
softdepend: [Jobs, mcMMO, EliteMobs]
description: >
  Farm-reward guard. Mobs born from spawners, spawn eggs or Nether portals are
  marked at birth, and a marked mob earns a reduced share of its rewards when
  killed: 65 percent by default, configurable from 0 (nothing, the original
  1.0 behavior) to 100 (full rewards) via farm-reward-percent in config.yml.
  Since 1.2 the guard also catches sky farms, whose mobs are born natural:
  a kill whose target's cumulative fall damage reached
  farm-fall-damage-percent (default 50) of its max health counts as farmed
  too and earns the same reduced share. Vanilla XP drops are never touched.
  Optional dependencies, each used only when present: Jobs (its payment and
  XP event amounts, money, points and XP, are scaled for farmed kills),
  mcMMO (its XP gain events are scaled for farmed kills before weekend or
  party multipliers can grow them), EliteMobs (verdict logging only, because
  EliteMobs 10.9.8 offers no cancellable reward event to scale through).
  With none of them installed it still records provenance and answers
  farmDecision queries for other plugins.

# ExcelRewardGuard 1.1 configuration.
# Every enforcement piece has its own off switch; turning one off re-opens
# that reward path for marked (spawner / spawn-egg / Nether-portal) mobs.

# The share of its Jobs and mcMMO rewards that a marked kill still earns,
# as a whole percent from 0 to 100 (Mike's decision, Oct 15, 2026: farmed
# kills are reduced, not zeroed, because the player still has to find or
# build the farm and land the kills).
#   65  = the default: a marked kill earns 65% of its normal rewards.
#   0   = block everything, exactly like ExcelRewardGuard 1.0.
#   100 = no reduction at all; marked kills earn full rewards.
# Anything outside 0-100 is clamped, and a value that is not a whole
# number falls back to 65; either way the startup log says what is in use.
farm-reward-percent: 65

# Scale Jobs payments and Jobs XP for marked kills (Jobs events carry the
# killed entity, so this reduction is exact).
jobs-veto: true

# Scale mcMMO XP for marked kills. mcMMO XP events carry no entity, so the
# guard plants a short window when a marked mob dies and scales kill XP
# (PVE and party-share SHARED_PVE gains) inside it.
mcmmo-veto: true

# Log deaths of marked elites. EliteMobs has no cancellable reward event in
# 10.9.8, so this is observability only, never a reduction.
elitemobs-verdict-logging: true

# How far from a marked kill a gaining player can be and still count as
# party-share range for the mcMMO reduction. The killer always matches, at
# any distance (bow kills). Party share on this server reaches about 32
# blocks; 40 gives a small safety margin.
party-share-radius-blocks: 40.0

# How many ticks after a marked death the mcMMO reduction window stays open.
# mcMMO grants the kill XP during the same death processing, so this only
# needs to cover same-tick ordering plus a small margin.
suppression-window-ticks: 2

# Log every reduction as it happens. Off by default; reductions are still
# counted either way.
debug-logging: false

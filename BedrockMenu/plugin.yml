name: ExcelBedrockMenu
provides: [BedrockMenu]
version: 1.4.3
author: Argus
main: com.winkreyes.bedrockmenu.BedrockMenu
api-version: "1.21"
description: /menu that works on Bedrock via native Geyser forms. Includes Spawn Shop and overworld-safe spawn fallback.
softdepend: [Geyser-Spigot, floodgate, DeluxeMenus, Essentials, EssentialsSpawn]
commands:
  menu:
    description: Open the server menu
    usage: /menu
  tpmenu:
    description: Pick an online player to send a teleport request to
    usage: /tpmenu

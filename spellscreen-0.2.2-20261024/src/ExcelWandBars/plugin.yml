name: ExcelWandBars
version: 0.2.2
main: com.winkreyes.excelwandbars.ExcelWandBars
api-version: '1.13'
author: WinkReyesValley
softdepend: [Magic, Geyser-Spigot, floodgate]
description: Wand controls per player (/wandstyle classic or sneakbars, classic by default; Sneak bars is Bedrock only). In Sneak bars, sneak once while your Magic wand's spell bar is open to flip to the next bar (1, 2, 3, back to 1). A short wand tip shows on the first 15 wand uses until OK. /spellinfo shows each spell's cost, cooldown, range, rank and progress to its next rank (Bedrock form or Java chat). New in 0.2.2, for Bedrock players on Classic controls the wand's spell list opens as the Spell Book form (with Use this spell); a short action-bar line after a cast shows progress to the next rank.
commands:
  spellinfo:
    description: Read your wand's spells (what they do, cost, cooldown, range, rank).
    usage: /spellinfo [spell | ok]
    aliases: [spellbook, wandspells]
    permission: excelwandbars.spells
  wandstyle:
    description: Pick your wand controls, Classic (right click = next spell) or Sneak bars (Bedrock, sneak flips the spell bar).
    usage: /wandstyle [classic | sneakbars | switch | ok]
    aliases: [wandcontrols]
    permission: excelwandbars.style
  wandbars:
    description: ExcelWandBars admin (status / reload / flip / info / style / tip / spelltip / progress / use / lastform / formtap / simbedrock <player>).
    usage: /wandbars [reload | flip <player> | info <player> | style <player> [classic|bars|clear|apply|unset] | tip <player> [reset] | spelltip <player> [reset] | progress <player> | use <player> <spell> | lastform <player> | formtap <player> <n> | simbedrock <player> [on|off]]
    permission: excelwandbars.admin
permissions:
  excelwandbars.spells:
    default: true
  excelwandbars.style:
    default: true
  excelwandbars.admin:
    default: op

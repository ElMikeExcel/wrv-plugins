name: Unpack ExcelMenu 3.0.1 record package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out record branch
        uses: actions/checkout@v4
        with:
          ref: record/excelmenu-3.0.1-20261113
      - name: Expand sources zip src tree
        run: |
          set -euo pipefail
          ZIP=packages/excelmenu-3.0.1-20261113/ExcelMenu-3.0.1-sources.zip
          DEST=packages/excelmenu-3.0.1-20261113/src
          test -f "$ZIP"
          sha256sum "$ZIP"
          unzip -l "$ZIP"
          rm -rf /tmp/emsrc "$DEST"
          mkdir -p /tmp/emsrc
          unzip -o "$ZIP" 'src/*' -d /tmp/emsrc
          COUNT=$(find /tmp/emsrc/src -type f | wc -l)
          echo "src files extracted: $COUNT"
          test "$COUNT" -eq 204
          mkdir -p packages/excelmenu-3.0.1-20261113
          mv /tmp/emsrc/src "$DEST"
          find "$DEST" -type f | sort | head -12
          echo "total files under src: $(find "$DEST" -type f | wc -l)"
      - name: Commit expanded src tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/excelmenu-3.0.1-20261113/src
          git status --short | wc -l
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Record ExcelMenu 3.0.1: expand sources zip src/ tree (204 files)" -m "Expand the src/ subtree of ExcelMenu-3.0.1-sources.zip into packages/excelmenu-3.0.1-20261113/src/ so the record PR carries the full source tree alongside the zip fallback."
            git push origin HEAD:record/excelmenu-3.0.1-20261113
          fi

name: Verify WealthBoard mobile layout
on:
  push:
    branches: [fix/wealthboard-mobile-2026-10-13]
    paths: ['WealthBoard/**', '.github/workflows/wealthboard-mobile.yml']
  pull_request:
    paths: ['WealthBoard/**', '.github/workflows/wealthboard-mobile.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: WealthBoard/pom.xml
      - name: Compile and test the layout candidate
        working-directory: WealthBoard
        run: ./mvnw --batch-mode verify
      - name: Record artifact identity
        working-directory: WealthBoard/target
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sha256sum WealthBoard-1.3.0-mobile.1.jar > SHA256SUMS
          printf '%s\n' "$SOURCE_COMMIT" > source-commit.txt
      - name: Upload candidate and test results (not deployed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wealthboard-mobile-${{ github.sha }}
          path: |
            WealthBoard/target/WealthBoard-1.3.0-mobile.1.jar
            WealthBoard/target/SHA256SUMS
            WealthBoard/target/source-commit.txt
            WealthBoard/target/surefire-reports/
          if-no-files-found: error

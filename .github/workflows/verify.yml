name: Verify source and artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify fail-closed Excel rename tooling
        run: |
          python3 -m pip install -r tools/excel_renames/requirements.txt
          cd tools/excel_renames
          python3 -m unittest discover -s tests -v
      - name: Bootstrap pinned ChestShop, build plugins, package guard and run checks
        run: ./build.sh
      - name: Package verified ExcelShops and guarded ChestShop pair (not deployed)
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          JAR=WRVShops/target/ExcelShops-0.1.4.jar
          GUARD=ChestShop-ConfirmationGuard/target/ChestShop-3.13-pre-1-build474-confirmation.1.jar
          SOURCES=ChestShop-ConfirmationGuard/target/ChestShop-3.13-pre-1-build474-confirmation.1-sources.zip
          python3 WRVShops/tools/package_candidate.py \
            --jar "$JAR" --expected-sha256 "$(sha256sum "$JAR" | cut -d' ' -f1)" \
            --guarded-jar "$GUARD" --expected-guarded-sha256 "$(sha256sum "$GUARD" | cut -d' ' -f1)" \
            --guard-sources "$SOURCES" --expected-sources-sha256 "$(sha256sum "$SOURCES" | cut -d' ' -f1)" \
            --source-commit "$CANDIDATE_COMMIT" \
            --output WRVShops/target/ExcelShops-0.1.4-install-candidate.zip
      - name: Upload source-built JARs and shop pack (not approved for rename-only deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrv-plugins-candidate-${{ github.sha }}
          path: |
            EXCEL-PLUGIN-RENAMES.md
            BedrockMenu/target/ExcelBedrockMenu-*.jar
            Leaderboard/target/ExcelLeaderboard-*.jar
            MenuJoin/target/ExcelMenuJoin-*.jar
            NoPhantoms/target/ExcelNoPhantoms-*.jar
            RestartCountdown/target/ExcelRestartCountdown-*.jar
            ShopVillager/target/ExcelShopVillager-*.jar
            WealthBoard/target/ExcelWealthBoard-*.jar
            WeekendXP/target/ExcelWeekendXP-*.jar
            WRVShops/target/ExcelShops-0.1.4.jar
            ChestShop-ConfirmationGuard/target/ChestShop-3.13-pre-1-build474-confirmation.1.jar
            ChestShop-ConfirmationGuard/target/ChestShop-3.13-pre-1-build474-confirmation.1-sources.zip
            ChestShop-ConfirmationGuard/target/guarded-artifacts.json
            WRVShops/target/ExcelShops-0.1.4-install-candidate.zip
          if-no-files-found: error

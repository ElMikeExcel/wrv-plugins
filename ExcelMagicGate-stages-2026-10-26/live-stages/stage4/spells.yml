boon:
  icon: boon
  alias: perk
  category: utility
  worth: 880
  earns: 6
  upgrade_required_path: beginner
  upgrade_required_casts: 40
  quick_cast: true
  toggle: cancel
  disable_mana_regeneration: true
  boss_bar: true
  # WRV boonfix v2 (Oct 23, 2026): Boon is a toggle. Casting turns it ON;
  # casting again, or running out of mana, turns it OFF. The wand's quiet: 1
  # hides Magic's "on" text and the built-in "off" text read "Boon
  # Interrupted", so we add a clear ON line and reword the OFF line.
  # Speed is now applied for 1.5 s and refreshed every 1 s while Boon is on
  # (was 30 s), so it ends within ~0.5-1.5 s of Boon turning off instead of
  # lingering up to 30 s. No forced removal: vanilla effect merging keeps a
  # longer or stronger Speed from a potion/beacon/other plugin.
  messages:
    cancel: "a:&eBoon is off"
  actions:
    cast:
    - class: Message
      message_type: action_bar
      message: "&aBoon on: Speed II while your mana lasts. Cast again to stop."
    - class: Repeat
      actions:
      - class: PotionEffect
        duration: 1500
      - class: Delay
        delay: 1000
  effects:
    cast:
    - sound: entity_experience_orb_pickup
      sound_pitch: 0.2
      sound_volume: 0.8
    - sound: entity_generic_drink
      sound_pitch: 1.75
      sound_volume: 0.6
    - sound: entity_generic_drink
      sound_pitch: 1.75
      sound_volume: 0.6
    - sound: block_beacon_activate
      sound_pitch: 1.5
      sound_volume: 0.75
    - location: origin
      source_location: body
      color_override: color
      effectlib:
        class: EquationEffect
        x_equation: 0
        y_equation: 0.4 * (cos(t/57.2958)  * (2.71828^(cos(t/57.2958)) - 2 * cos(4t/57.2958) - (sin(t/(12 * 57.2958)))^5))
        z_equation: 0.4 * (sin(t/57.2958)  * (2.71828^(cos(t/57.2958)) - 2 * cos(4t/57.2958) - (sin(t/(12 * 57.2958)))^5))
        particles: 50
        duration: 3600000
        relative_offset: -0.5,0,0
        disappear_with_origin_entity: true
  parameters:
    target: self
    effect_speed: 1
    cooldown: 6000
    cancel_on_death: true
    repeat: infinite
    bypass_mage_cooldown: true
  costs:
    mana: 20
  active_costs:
    mana: 1


#
# Wink Reyes Valley — Magic SEAL 4 — THE MASONS curated spells (CUMULATIVE packet).
# WRV-070. This file is the COMPLETE spell set for SEAL 4 — THE MASONS: every spell
# from the earlier seals plus this seal's additions. Deploy = replace the whole
# Magic config set with this packet (see INSTALL-RUNBOOK.md).
#
# Paired with config.yml: load_default_spells: false
# -> defaults/spells.defaults.yml is NOT loaded. Only the spells below exist.
#
# Every block is copied from Magic 11.2.5 defaults/spells.defaults.yml
# (the exact build scratch-tested Oct 17, 2026), except stormshackle, which is
# OURS (custom, from the Phase 1 packet). Two documented deviations, both about
# pacing only: (1) `worth` (the SP learn price) is re-scaled per rank band so
# each rank takes ~2 days of casual play - the math is in this packet's
# LADDER.md; (2) powerstone's gag price (worth 9999) was normalized first.
# Every other value in every block is the author's, untouched.
#
# Loaded total: 142 spell entries (incl. level variants and the hidden
# base_passive template, which is not castable).
#

heal:
  # WRV balance/Bedrock proposal Oct 23 2026 (staged only, not live)
  icon: heal
  category: light
  tags: noduel
  upgrade_required_path: student
  upgrade_required_casts: 50
  worth: 1200
  earns: 2
  actions:
    cast:
    - class: ChangeContext
      target_caster: true
      actions:
      - class: Modifier
        add_modifiers: wrv_focus
        duration: 5000
    - class: CheckModifiers
      blocked: wrv_renewed
      actions:
      - class: Modifier
        add_modifiers: wrv_renewed
        duration: 10000
      - class: Repeat
        actions:
        - class: Delay
        - class: Heal
      fail:
      - class: Message
        message_type: action_bar
        message: '&eYour Heal is already on them'
  effects:
    cast:
    - sound: entity_generic_drink
      sound_pitch: 0.1
      sound_volume: 0.4
    - sound: block_beacon_activate
      sound_pitch: 0.1
      sound_volume: 1.4
    - sound: entity_generic_drink
      sound_pitch: 0.3
      sound_volume: 0.2
      location: target
    - class: EffectSingle
      sound: magic.shimmer
      effectlib:
        class: ConeEffect
        iterations: 5
        lengthGrow: 0.12
        particle: heart
    - class: EffectSingle
      sound: magic.shimmer
      location: target
      effectlib:
        class: Modified
        period: 16
        duration: $total_duration
        parameters:
          radius: (t/i) * 1.5 + 1.5
          rings: (1 - (t/i)) * 3 + 1
        effect:
          class: WarpEffect
          particle: heart
          particles: 8
          grow: 0.5
    - class: EffectSingle
      location: target
      effectlib:
        class: Modified
        period: 2
        duration: $total_duration
        parameters:
          radius: (t/i) * 0.5 + 1
          rings: (1 - (t/i)) * 11 + 1
        effect:
          class: WarpEffect
          particle: end_rod
          particles: 7
    - class: EffectSingle
      effectlib:
        class: LineEffect
        particle: end_rod
        duration: 500
        particles: 10
        particle_count: 4
        particle_offset_x: 0.1
        particle_offset_y: 0.1
        particle_offset_z: 0.1
    - class: EffectSingle
      effectlib:
        class: LineEffect
        particle: heart
        duration: 1000
        particles: 4
        particle_count: 2
        particle_offset_x: 0.1
        particle_offset_y: 0.1
        particle_offset_z: 0.1
        period: 4
    cast_self:
    - sound: entity_generic_drink
      sound_pitch: 0.1
      sound_volume: 0.4
    - sound: block_beacon_activate
      sound_pitch: 0.1
      sound_volume: 1.4
    - class: EffectSingle
      sound: magic.shimmer
      location: target
      effectlib:
        class: Modified
        period: 16
        duration: $total_duration
        parameters:
          radius: (t/i) * 1.5 + 1.5
          rings: (1 - (t/i)) * 3 + 1
        effect:
          class: WarpEffect
          particle: heart
          particles: 8
          grow: 0.5
    - class: EffectSingle
      location: target
      effectlib:
        class: Modified
        period: 2
        duration: $total_duration
        parameters:
          radius: (t/i) * 0.5 + 1
          rings: (1 - (t/i)) * 11 + 1
        effect:
          class: WarpEffect
          particle: end_rod
          particles: 7
    cast_finish:
    - sound: block_beacon_activate
      sound_pitch: 1.2
      sound_volume: 0.5
      location: both
    - class: EffectSingle
      custom_sound: magic.shimmer_quiet
      sound_pitch: 5
      location: origin
      effectlib:
        class: AnimatedBall
        duration: 200
        particle: heart
        size: 3
  parameters:
    # Renew-style heal over time: 1 HP every 1 s for 10 s. Taking damage or
    # casting another spell no longer cancels it.
    cancel_on_damage: 0
    cancel_on_cast_other: false
    delay: 1000
    repeat: 10
    total_duration: 10000
    target_type: LivingEntity
    target: any_entity
    allow_max_range: false
    range: 8
    cooldown: 8000
    bypass_pvp: true
    bypass_friendly_fire: true
    only_friendly: true
    hitbox: true
    amount: 1
    cooldown_mage: 1000
  costs:
    mana: 12


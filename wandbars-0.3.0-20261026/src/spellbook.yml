# ExcelWandBars 0.3.0: Spell Book groups (Wink Reyes Valley).
# Each spell (Magic spell key, lower case) sits in one group. Order of groups = order in the Spell Book.
# A spell in no group shows under "Other" (last) and the server log lists it once at start and on
# /wandbars reload. A spell in two groups stays in the first one.
# Edit, then /wandbars reload (no restart). Group keys "other" and "all" are reserved.
# Not listed on purpose: disposal (taken off the wands, Oct 26, 2026).

name: ExcelTrash
version: '0.3.0'
main: com.winkreyes.trash.ExcelTrash
api-version: '1.21'
author: Wink Reyes Valley
license: MIT
softdepend: [GriefPrevention]
description: /trash bin with chest mode, two-tap OK to delete, and a 5-minute one-shot recover of your last batch.
commands:
  trash:
    aliases: [bin]
    description: Open the trash bin. /trash chest uses the chest you look at. /trash undo recovers your last batch. /trash help explains it.
    usage: /trash [chest|undo|help]
    permission: exceltrash.use
permissions:
  exceltrash.use:
    default: true
  exceltrash.admin:
    default: op

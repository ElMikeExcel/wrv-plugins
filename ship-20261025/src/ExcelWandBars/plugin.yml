name: ExcelWandBars
version: 0.2.0
main: com.winkreyes.excelwandbars.ExcelWandBars
api-version: '1.13'
author: WinkReyesValley
softdepend: [Magic, Geyser-Spigot, floodgate]
description: Wand controls per player (/wandstyle classic or bars, classic by default). In bars style, sneak once while your Magic wand's spell bar is open to flip to the next bar (1, 2, 3, back to 1). /spellinfo shows each spell's cost, cooldown, range and rank (Bedrock form or Java chat).
commands:
  spellinfo:
    description: Read your wand's spells (what they do, cost, cooldown, range, rank).
    usage: /spellinfo [spell]
    aliases: [spellbook, wandspells]
    permission: excelwandbars.spells
  wandstyle:
    description: Pick your wand controls, Classic (right click = next spell) or Spell bars (hotbar casting).
    usage: /wandstyle [classic | bars | switch]
    aliases: [wandcontrols]
    permission: excelwandbars.style
  wandbars:
    description: ExcelWandBars admin (status / reload / flip / info / style <player>).
    usage: /wandbars [reload | flip <player> | info <player> | style <player> [classic|bars|clear|apply|unset]]
    permission: excelwandbars.admin
permissions:
  excelwandbars.spells:
    default: true
  excelwandbars.style:
    default: true
  excelwandbars.admin:
    default: op

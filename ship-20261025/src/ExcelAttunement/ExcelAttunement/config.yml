# ExcelAttunement — Combat Attunement settings.
# The defaults ARE the design (Mike, Oct 19, 2026); the knobs exist
# so a balance pass never needs a rebuild.

# Master switch. false = the plugin watches nothing and blocks nothing.
enabled: true

# Stance window in seconds, refreshed by stance interactions
# (landing a hit, a qualifying cast, taking hostile damage).
# 30s by design: Superheal / Chain Lightning cooldowns are 20s.
window-seconds: 30

# "In combat" for support casts: the caster dealt or took damage
# within this many seconds. A support cast outside it is the accepted
# pre-fight opener and never attunes.
combat-context-seconds: 10

# Verbose logging of blocks, zeroes and stance transitions.
debug: false

# ---- 0.1.4 stance lock (Mike, Oct 24, 2026) ----
# Caster stance: a sword, axe, mace, trident, bow or crossbow cannot be
# moved into your main hand (hotbar switch, F swap, inventory click,
# pickup into an empty hand). A weapon already in hand still does 0.
weapon-lock: true
# Fighter stance: a Magic wand cannot be moved into your main hand.
# A wand already in hand is still blocked from casting.
wand-lock: true
# Stance line on the action bar with a countdown
# ("Caster stance: weapons locked 24s"), and "Stance clear" at the end.
actionbar: true
# Refresh that line every second while a stance is active.
# false = only show it on stance start / blocked attempts (0.1.2 style).
actionbar-live: true
# Short dull sound on a blocked attempt.
sounds: true

# ---- 0.1.5 guild ward (Mike, Oct 24, 2026) ----
# Magic (elMakers) is silent inside the EliteMobs (MagmaGuy) worlds:
# every cast is blocked, heals included, and attunement is ignored
# there (stance and weapon lock clear on arrival). The EliteMobs
# classes own combat in the guild. Normal worlds are unchanged.
magic-ward:
  # false = no ward at all (0.1.4 behavior everywhere).
  enabled: true
  # Ask EliteMobs' own world list (read-only) as well as the names below.
  use-elitemobs-registry: true
  # A world whose name starts with one of these is warded
  # (covers em_adventurers_guild and instanced dungeon copies).
  world-prefixes:
    - em_
  # Exact world names (premium packs without the em_ prefix).
  worlds:
    - em_adventurers_guild
    - GoblinKingdom_vf
  # The wand stays a plain item (no spell bar, no mana bar).
  block-wand: true
  # On arrival: stop running Magic spells and close the wand.
  stop-active-spells: true
  # On arrival: remove short buffs of these types (Magic's run 15s or
  # less; brewed potions and golden apples last longer and are kept).
  strip-buffs: true
  strip-buff-types:
    - resistance
    - absorption
    - regeneration
  strip-max-seconds: 15
  # Refuse Magic teleports (Recall, Warp spells) INTO these worlds.
  block-magic-teleport-in: true
  # Class-name prefixes that mark a teleport as Magic-driven.
  magic-class-prefixes:
    - com.elmakers.mine.bukkit.
  # Line shown on arrival (chat + action bar) and on a blocked cast.
  notice: "The guild's halls are warded. Magic falls silent inside."
  # Blocked-cast line at most once per this many seconds per player.
  notice-cooldown-seconds: 10

# ---- 0.1.6 arena locks (Mike, Oct 24, 2026) ----
# Some Magic (elMakers) movement spells are sealed near the Ender Dragon
# while she lives: inside the zone below, in a world whose dragon is
# alive, a locked spell cannot be cast (no mana, no cooldown spent).
# Outside the zone, or with no live dragon, every spell works. This
# follows the dragon, not a seal: the first fight, every re-fight and
# every crystal re-summon are covered. A missing section = these
# default rules.
arena-locks:
  # false = no arena locks at all (0.1.5 behavior).
  enabled: true
  # Dragon state unreadable (the fight could not be read)? true = treat
  # her as alive inside the zone (safe), false = open.
  block-if-dragon-unknown: true
  # Blocked-cast line (chat + action bar) at most once per this many
  # seconds per player, per spell.
  notice-cooldown-seconds: 3
  # How often (ticks) players in the zone are checked for a running
  # stop-running spell (Glide) - also catches a dragon re-summoned
  # while they stand inside.
  check-ticks: 5
  zone:
    # Worlds in scope: environments (THE_END, NETHER, NORMAL) and/or
    # exact world names.
    environments:
      - THE_END
    worlds: []
    # A vertical cylinder (every height, void included) around the
    # main island centre.
    center-x: 0
    center-z: 0
    # 200: the vanilla main island reaches about 100 blocks from 0,0,
    # the obsidian pillars stand 42 blocks out, the arrival platform is
    # at 100,49,0 (inside), and vanilla adds players to the dragon fight
    # within 192 blocks of 0,128,0; 200 covers all of that plus a void
    # margin, and stays far from the outer islands (1000+ blocks out).
    radius: 200
  # One entry per locked spell. A bare entry ("dash: {}") locks that
  # spell with the default line "<Spell> is sealed near the dragon while
  # she lives". Optional keys: spells (aliases / base keys, default the
  # entry name; levels like fling|4 always match), message, stop-running
  # (stop it if it is still running when the player is inside the
  # active zone), protect-targets-in-zone (also block casting it AT a
  # player who is inside the active zone, wherever the caster is).
  rules:
    glide:
      message: "Glide is sealed near the dragon while she lives"
      stop-running: true
    # Every Fling level; the leap alias casts as fling|4, so it is covered.
    fling:
      message: "Fling is sealed near the dragon while she lives"
    hulkleap:
      message: "Hulkleap is sealed near the dragon while she lives"
    lift:
      message: "Lift is sealed near the dragon while she lives"
      protect-targets-in-zone: true
    blink:
      message: "Blink is sealed near the dragon while she lives"
    # Open by default - uncomment one line to lock it too:
    # backflip: {}
    # recall: {}
    # gather: {}
    # dash: {}
    # evade: {}

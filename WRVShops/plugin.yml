name: WRVShops
version: 0.1.0
main: com.winkreyes.shops.WRVShops
api-version: '1.21'
author: Wink Reyes Valley
license: MIT
description: Chest-backed shops with guided setup and explicit final purchase confirmation.
softdepend: [Vault, GriefPrevention, ChestShop, Geyser-Spigot, floodgate, DeluxeMenus]
commands:
  wrvshop:
    description: Browse the confirmed Spawn Shop or manage your chest shop
    usage: /wrvshop [browse <item>|setup|manage|amount <number>]
    permission: wrvshops.use
permissions:
  wrvshops.use:
    default: true
  wrvshops.create:
    default: true

name: ExcelQuartermaster
version: 0.1.0
author: Argus
main: com.winkreyes.excelquartermaster.ExcelQuartermaster
api-version: "1.13"
description: The village Old Quartermaster tells his tales. Right-clicking his (deliberately trade-less) Shopkeepers villager cancels the empty trade window and instead gives the player the next tale from his rotation, per player, saved across restarts. Sneak-clicks pass through untouched so the Shopkeepers editor keeps working.

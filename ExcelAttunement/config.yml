# ExcelAttunement — Combat Attunement settings.
# The defaults ARE the design (Mike, Oct 19, 2026); the knobs exist
# so a balance pass never needs a rebuild.

# Master switch. false = the plugin watches nothing and blocks nothing.
enabled: true

# Stance window in seconds, refreshed by stance interactions
# (landing a hit, a qualifying cast, taking hostile damage).
# 30s by design: Superheal / Chain Lightning cooldowns are 20s.
window-seconds: 30

# "In combat" for support casts: the caster dealt or took damage
# within this many seconds. A support cast outside it is the accepted
# pre-fight opener and never attunes.
combat-context-seconds: 10

# Verbose logging of blocks, zeroes and stance transitions.
debug: false

# ---- 0.1.4 stance lock (Mike, Oct 24, 2026) ----
# Caster stance: a sword, axe, mace, trident, bow or crossbow cannot be
# moved into your main hand (hotbar switch, F swap, inventory click,
# pickup into an empty hand). A weapon already in hand still does 0.
weapon-lock: true
# Fighter stance: a Magic wand cannot be moved into your main hand.
# A wand already in hand is still blocked from casting.
wand-lock: true
# Stance line on the action bar with a countdown
# ("Caster stance: weapons locked 24s"), and "Stance clear" at the end.
actionbar: true
# Refresh that line every second while a stance is active.
# false = only show it on stance start / blocked attempts (0.1.2 style).
actionbar-live: true
# Short dull sound on a blocked attempt.
sounds: true

# ExcelAttunement — Combat Attunement settings.
# The defaults ARE the design (Mike, Oct 19, 2026); the knobs exist
# so a balance pass never needs a rebuild.

# Master switch. false = the plugin watches nothing and blocks nothing.
enabled: true

# Stance window in seconds, refreshed by stance interactions
# (landing a hit, a qualifying cast, taking hostile damage).
# 30s by design: Superheal / Chain Lightning cooldowns are 20s.
window-seconds: 30

# "In combat" for support casts: the caster dealt or took damage
# within this many seconds. A support cast outside it is the accepted
# pre-fight opener and never attunes.
combat-context-seconds: 10

# Verbose logging of blocks, zeroes and stance transitions.
debug: false

# ---- 0.1.4 stance lock (Mike, Oct 24, 2026) ----
# Caster stance: a sword, axe, mace, trident, bow or crossbow cannot be
# moved into your main hand (hotbar switch, F swap, inventory click,
# pickup into an empty hand). A weapon already in hand still does 0.
weapon-lock: true
# Fighter stance: a Magic wand cannot be moved into your main hand.
# A wand already in hand is still blocked from casting.
wand-lock: true
# Stance line on the action bar with a countdown
# ("Caster stance: weapons locked 24s"), and "Stance clear" at the end.
actionbar: true
# Refresh that line every second while a stance is active.
# false = only show it on stance start / blocked attempts (0.1.2 style).
actionbar-live: true
# Short dull sound on a blocked attempt.
sounds: true

# ---- 0.1.5 guild ward (Mike, Oct 24, 2026) ----
# Magic (elMakers) is silent inside the EliteMobs (MagmaGuy) worlds:
# every cast is blocked, heals included, and attunement is ignored
# there (stance and weapon lock clear on arrival). The EliteMobs
# classes own combat in the guild. Normal worlds are unchanged.
magic-ward:
  # false = no ward at all (0.1.4 behavior everywhere).
  enabled: true
  # Ask EliteMobs' own world list (read-only) as well as the names below.
  use-elitemobs-registry: true
  # A world whose name starts with one of these is warded
  # (covers em_adventurers_guild and instanced dungeon copies).
  world-prefixes:
    - em_
  # Exact world names (premium packs without the em_ prefix).
  worlds:
    - em_adventurers_guild
    - GoblinKingdom_vf
  # The wand stays a plain item (no spell bar, no mana bar).
  block-wand: true
  # On arrival: stop running Magic spells and close the wand.
  stop-active-spells: true
  # On arrival: remove short buffs of these types (Magic's run 15s or
  # less; brewed potions and golden apples last longer and are kept).
  strip-buffs: true
  strip-buff-types:
    - resistance
    - absorption
    - regeneration
  strip-max-seconds: 15
  # Refuse Magic teleports (Recall, Warp spells) INTO these worlds.
  block-magic-teleport-in: true
  # Class-name prefixes that mark a teleport as Magic-driven.
  magic-class-prefixes:
    - com.elmakers.mine.bukkit.
  # Line shown on arrival (chat + action bar) and on a blocked cast.
  notice: "The guild's halls are warded. Magic falls silent inside."
  # Blocked-cast line at most once per this many seconds per player.
  notice-cooldown-seconds: 10

name: ExcelAttunement
version: 0.1.3
main: com.winkreyes.excelattunement.ExcelAttunement
api-version: '1.13'
author: WinkReyesValley
softdepend: [Magic]
description: Combat Attunement - an effect lock, not an inventory lock. Landing a weapon hit stills your wand; casting in a fight stills your weapons. One fight, one commitment.
commands:
  attunement:
    description: Attunement admin (status / clear).
    usage: /attunement status | /attunement clear <player>
    permission: excelattunement.admin
permissions:
  excelattunement.admin:
    default: op

#
# STAGE 0 (DORMANT) DERIVATION - ExcelMagicGate, WRV-070.
# This file is the Phase 1 packet's wands.yml with the four rank wand
# templates (beginner, student, apprentice, master) REMOVED. Only the
# hidden, spell-less base templates remain (base_magic, base_undroppable,
# base_keep, base_bound, basic_wand, base_wand). No loaded wand template
# carries any spell, so at stage 0 there is no obtainable wand that can
# cast anything; stage 1 restores the packet's full wands.yml.
# Everything below the original packet header is byte-identical to the
# Phase 1 packet file up to the first rank wand.
#
#
# Wink Reyes Valley - Magic Phase 1 (HEALER RELEASE) wand templates.
# WRV-070. Paired with config.yml: load_default_wands: false
# -> defaults/wands.defaults.yml (200 templates) is NOT loaded.
#
# The hidden base templates (base_magic, base_undroppable, base_keep,
# base_bound, basic_wand, base_wand) are copied VERBATIM from Magic 11.2.5
# defaults/wands.defaults.yml - they define wand behavior only and hold no
# spells. The four rank wands keep their shipped properties (icon, colors,
# mana, level_spells_to_path) but their spells lists are replaced with the
# cumulative Phase 1 lists. The shipped rank wands embed the full default
# spell lists (the apprentice wand alone carries lava, grenade, wither,
# flamethrower, vengeance...) - that is why this file exists.
#
# Cumulative spell lists:
#   beginner  : cure, boon, feed, extinguish, aqualung
#   student   : + heal, shell, gills, stormshackle
#   apprentice: + superheal, recall
#   master    : + blessing, recall_death
# active_spell on the beginner wand is cure (the shipped default was
# missile, which does not exist in Phase 1).
#

base_magic:
  hidden: true
  effects:
    open:
    - sound: magic.wandup
      sound_broadcast: false
      sound_volume: 0.4
    - sound: block_chest_open
      sound_pitch: 1.5
      sound_volume: 0.1
      sound_broadcast: false
    close:
    - sound: magic.wanddown
      sound_broadcast: false
      sound_volume: 0.4
    - sound: block_chest_close
      sound_pitch: 1.5
      sound_volume: 0.1
      sound_broadcast: false
    cycle:
    - sound: magic.paperturn
      sound_broadcast: false
      sound_volume: 0.4
    - sound: item_book_page_turn
      sound_pitch: 1.5
      sound_volume: 0.2
      sound_broadcast: false
    cycle_spell:
    - sound: ui_button_click
      sound_pitch: 1.9
      sound_volume: 0.1
      sound_broadcast: false
    cycle_hotbar:
    - sound: magic.paperturn
      sound_broadcast: false
      sound_volume: 0.1
    - sound: item_spyglass_use
      sound_pitch: 0.3
      sound_volume: 1.5
      sound_broadcast: false

base_undroppable:
  inherit: base_magic
  hidden: true
  undroppable: true
  unstashable: false
  indestructible: true

base_keep:
  inherit: base_undroppable
  hidden: true
  keep: true
  invulnerable: true

base_bound:
  inherit: base_keep
  hidden: true
  bound: true
  immortal: true
  track: true

basic_wand:
  inherit: base_magic
  hidden: true
  mode: inventory
  drop: cycle_hotbar
  left_click: cast
  right_click: toggle
  swap: cycle_hotbar
  quiet: 1
  effect_bubbles: false
  item_attributes:
    GENERIC_ATTACK_SPEED: 10
  item_attribute_slot: mainhand

base_wand:
  hidden: true
  inherit: base_bound
  mode: inventory
  left_click: cast
  drop: toggle
  right_click: toggle
  swap: cycle_hotbar
  swap_sneak: cycle_hotbar_reverse
  quiet: 1
  effect_bubbles: false
  item_attributes:
    GENERIC_ATTACK_SPEED: 10
  item_attribute_slot: mainhand

#
# =====================================================================
# CUSTOM SPELL - Storm Shackle (stormshackle) - WRV-070, Oct 17, 2026
# =====================================================================
# Mike's design: "a chain lightning that does VERY LOW damage but SLOWS
# the enemies it arcs to." Built from Magic 11.2.5's chainlightning
# block (copied structure and effects), with these deliberate changes:
#
#   DAMAGE: every Damage action uses player_damage 0.5 / entity_damage
#     0.5 (chainlightning ships 1.5 / 2, plus a 0.5 / 1 repeat tick).
#     0.5 is the smallest damage value the shipped defaults themselves
#     use for a damage tick = a quarter-heart per strike. The `repeat`
#     parameter drops 4 -> 2, halving the repeat ticks. Worst case per
#     enemy is ~2 HP (one heart) if it eats every branch; a typical
#     single arc hit is 0.5-1 HP. This is a control spell, not a weapon.
#   SLOW: a PotionEffect action rides next to EVERY Damage action, so
#     each struck enemy is slowed. Format is Magic's own (verified
#     against the shipped defaults - frost and curse use the same
#     mechanism, and against the 11.2.5 bytecode): a bare PotionEffect
#     action reads `effect_<name>` + `duration` from its parameters.
#     Here, action-local parameters set:
#       effect_slow: 0   -> Slowness amplifier 0 = Slowness I
#       duration: 4000   -> 4000 ms = 4 seconds
#   COST: mana 50 (heal-tier; chainlightning ships 75), cooldown
#     10000 ms (half of chainlightning's 20000; in family with the
#     Phase 1 support spells). Not free, not spammable.
#   No upgrade variants (|2/|3) and no upgrade_required_*: Phase 1
#     ships exactly this one level, target_count stays 3 (the raw
#     spell's apprentice/master variants raise it to 5/8 - Phase 2
#     territory, not ours).
#   category: utility (control/support, not combat). icon reuses the
#     chainlightning icon, which still resolves from default icons.
#   Display name/description live in this packet's messages.yml.
#

stormshackle:
  icon: chainlightning
  category: utility
  worth: 1260
  earns: 6
  actions:
    cast:
    - class: CustomProjectile
      actions:
      - class: Electrify
      - class: Damage
      - class: PotionEffect
        duration: 4000
        effect_slow: 0
      - class: Delay
      - class: AreaOfEffect
        actions:
        - class: Asynchronous
          actions:
          - class: CustomProjectile
            velocity: 150
            actions:
            - class: Damage
            - class: PotionEffect
              duration: 4000
              effect_slow: 0
            - class: Electrify
            - class: Delay
            - class: AreaOfEffect
              target_count: 1
              actions:
              - class: CustomProjectile
                actions:
                - class: Damage
                - class: PotionEffect
                  duration: 4000
                  effect_slow: 0
            - class: Repeat
              actions:
              - class: Damage
                player_damage: 0.5
                entity_damage: 0.5
              - class: PotionEffect
                duration: 4000
                effect_slow: 0
              - class: Delay
      - class: Repeat
        actions:
        - class: Damage
        - class: PotionEffect
          duration: 4000
          effect_slow: 0
        - class: Delay
  effects:
    cast:
    - class: EffectSingle
      sound: magic.zap
      location: origin
    - sound: block_conduit_activate
      sound_pitch: 1.75
    projectile:
    - class: EffectSingle
      effectlib:
        class: LineEffect
        isZigZag: true
        zigZags: 2
        zigZagOffset: 0,0.05,0
        length: 10
        particles: 50
        particle: redstone
        color: FFF000
        duration: 2000
    - location: source
      effectlib:
        class: LineEffect
        isZigZag: true
        zigZags: 2
        zigZagOffset: 0,0.05,0
        length: 10
        particles: 20
        particle: fireworks_spark
        particle_count: 4
        particle_offset_x: 0.1
        particle_offset_y: 0.1
        particle_offset_z: 0.1
        duration: 2000
    tick:
    - particle: fireworks_spark
      particle_count: 2
      particle_offset_x: 0.2
      particle_offset_y: 0.2
      particle_offset_z: 0.2
      location: target
    hit:
    - sound: entity_guardian_attack
      sound_pitch: 2
      sound_volume: 0.5
      location: target
    - class: EffectSingle
      sound: magic.zap_crack
      sound_volume: 0.5
      location: target
      particle: fireworks_spark
      particle_count: 10
      particle_offset_x: 1
      particle_offset_y: 1
      particle_offset_z: 1
    - sound: block_conduit_activate
      sound_pitch: 1.8
      location: target
  parameters:
    tick_size: 5
    target: other
    target_self: false
    target_source: false
    range: 48
    velocity: 100
    radius: 8
    target_count: 3
    target_type: Damageable
    player_damage: 0.5
    entity_damage: 0.5
    delay: 250
    repeat: 2
    target_breakables: 1
    cooldown: 10000
    ignore_modified: true
  costs:
    mana: 50


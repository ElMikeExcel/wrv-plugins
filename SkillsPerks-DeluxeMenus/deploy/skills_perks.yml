# Skills & Perks info menu (DeluxeMenus, Java).
# Opened from the Server Menu's "Skills & Perks" button (server_menu slot 13).
# Info-only: nothing here teleports, so no confirm step applies
# (menu confirm standard covers teleport buttons only).
# Full ladders: website Skill Trees page (index.html #skill-trees).
menu_title: '&6&lSkills & Perks'
size: 27
items:
  mcmmo:
    material: EXPERIENCE_BOTTLE
    slot: 4
    display_name: '&a&lmcMMO Skills'
    lore:
      - '&7Live now: 19 skills, 83 perks'
      - '&7Levels run 1 to 1,000'
      - '&7New perks announce in chat'
      - '&7the moment you unlock them'
  check:
    material: PAPER
    slot: 11
    display_name: '&a&lCheck Your Skills'
    lore:
      - '&7Click to run /mcstats'
      - '&7Type /mining (any skill name)'
      - '&7for that skill''s own page'
      - '&7/mctop shows the leaderboards'
    left_click_commands:
      - '[player] mcstats'
      - '[close]'
  magic:
    material: BLAZE_ROD
    slot: 13
    display_name: '&8&lMagic (Sealed)'
    lore:
      - '&7Coming with the Adventurers'
      - '&7Guild seals (0 of 5 today)'
      - '&7See the full tree on the'
      - '&7website Skill Trees page'
  website:
    material: COMPASS
    slot: 15
    display_name: '&a&lSkill Trees Website'
    lore:
      - '&7Every ladder, every level'
      - '&7Tap for the address'
    left_click_commands:
      - '[json] {"text":"» Skill Trees: elmikeexcel.github.io/winkreyesvalley/#skill-trees","color":"aqua","underlined":true,"clickEvent":{"action":"open_url","value":"https://elmikeexcel.github.io/winkreyesvalley/#skill-trees"},"hoverEvent":{"action":"show_text","value":"Open the Skill Trees page"}}'
      - '[message] &bhttps://elmikeexcel.github.io/winkreyesvalley/#skill-trees'
  back:
    material: ARROW
    slot: 18
    display_name: '&7&lBack to Server Menu'
    left_click_commands:
      - '[openguimenu] server_menu'
  close:
    material: BARRIER
    slot: 22
    display_name: '&c&lClose'
    left_click_commands:
      - '[close]'

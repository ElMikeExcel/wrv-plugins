    - '[openguimenu] spawnshop_food'
    right_click_commands:
    - '[openguimenu] spawnshop_food'
  category_building:
    material: OAK_LOG
    slot: 1
    display_name: '&a&lBuilding'
    lore:
    - '&7Torches, oak logs, glass,'
    - '&7iron ingots and water buckets.'
    - '&e5 products'
    - '&8Tap to browse. No charge yet.'
    left_click_commands:
    - '[openguimenu] spawnshop_building'
    right_click_commands:
    - '[openguimenu] spawnshop_building'
  category_travel_animals:
    material: SADDLE
    slot: 2
    display_name: '&a&lTravel & Animals'
    lore:
    - '&7Saddles, name tags, leads,'
    - '&7ender pearls and fireworks.'
    - '&e5 products'
    - '&8Tap to browse. No charge yet.'

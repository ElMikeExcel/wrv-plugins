# ORGANIZATION CANDIDATE: 21 unchanged offers, grouped into five categories.
menu_title: '&eBalance $%vault_eco_balance_2dp% &8| &2Excel Shop'
open_command: shop
register_command: true
size: 9
update_interval: 1
inventory_type: DISPENSER
items:

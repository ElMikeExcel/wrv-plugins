# This is the Bukkit commands configuration file for Paper.
#
# If you need help with the configuration or have any questions related to Paper,
# join us in our Discord or check the docs page.
#
# File Reference: https://docs.papermc.io/paper/reference/bukkit-commands-configuration/
# Docs: https://docs.papermc.io/
# Discord: https://discord.gg/papermc
# Website: https://papermc.io/

command-block-overrides: []
ignore-vanilla-permissions: false
aliases:
  icanhasbukkit:
  - version $1-
  # Kid-safe trust (GriefPrevention). Run inside your claim:
  #   /childproof Rylie   (example; type the player's name) -> removes their trust here, then doors/buttons/levers/beds only
  #   /unchildproof Rylie -> removes their trust here
  # The last line prints a checked confirmation (ExcelBedrockMenu 1.5.16+; harmless "unknown command" without it).
  childproof:
  - untrust $1
  - accesstrust $1
  - childproofmenu done $1
  unchildproof:
  - untrust $1
  - childproofmenu undone $1

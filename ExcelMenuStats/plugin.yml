name: ExcelMenuStats
version: '0.1.0'
main: com.winkreyes.menustats.ExcelMenuStats
api-version: '1.21'
prefix: MenuStats
author: Wink Reyes Valley
license: MIT
softdepend: [ExcelMenu, floodgate]
description: Read-only click counter for ExcelMenu buttons. Appends clicks.csv; /menustats shows the top buttons. Never cancels or changes a click.
commands:
  menustats:
    description: Show the most-used ExcelMenu buttons
    usage: /menustats [days 1-3650] | /menustats reload
    aliases: [excelmenustats]
    permission: excelmenustats.admin
permissions:
  excelmenustats.admin:
    default: op

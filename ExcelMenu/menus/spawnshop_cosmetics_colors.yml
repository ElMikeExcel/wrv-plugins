# ExcelMenu definition: spawnshop_cosmetics_colors
# Migrated 2026-10-20 from DeluxeMenus gui_menus/spawnshop_cosmetics_colors.yml
# Chat colors v2 (2026-10-23, ExcelCosmetics 0.1.2 + ExcelMenu 0.1.5):
# 21 colors, each hex the EXACT RGB of one Bedrock chat code, so the
# name, the sample line and real chat match on Java and Bedrock.
# Needs ExcelMenu 0.1.5 (hex -> Bedrock code in forms, {sample} lines).
# Prices unchanged: $200/week, $700 for 4 weeks, $15,000 to own.
format: 1
title: '&e$%vault_eco_balance_2dp% &8| &dCosmetics - Colors'
size: 36

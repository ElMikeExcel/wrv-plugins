# Prices updated 2026-10-20 for ExcelCosmetics 0.1.1: flat own prices
# (colors $15,000 / emotes $20,000 / effects $25,000 / sets $30,000) and a
# 4-week tier on shift-left at 3.5x. The bedrock four-label is forward
# data for the ExcelMenu renderer extension; ExcelMenu 0.1.1 ignores it.
format: 1
title: '&e$%vault_eco_balance_2dp% &8| &dCosmetics - Colors'
size: 27
update-interval: 1
items:
  pink:
    material: PINK_DYE
    slot: 0
    name: '&d&lPink'
    lore:
    - '&7Your name & messages in pink.'
    - '&aLeft click: rent 1 week - $200'
    - '&bShift-left click: rent 4 weeks - $700'
    - '&eRight click: own forever - $15,000'
    - '&7Rentals end quietly; renewals stack.'
    clicks:
      left:
      - '[console] excelcosmetics buy %player_name% color pink'
      shift-left:
      - '[console] excelcosmetics buy %player_name% color pink 4'
      right:
      - '[console] excelcosmetics buy %player_name% color pink own'
    bedrock:
      mode: modal
      left-label: Rent 1 week - $200
      right-label: Own forever - $15,000

# ExcelAutoSort — configuration
# Every player-facing sentence the plugin speaks lives in this file
# (the house config-first rule), so wording can change without a
# rebuild. The behavioral switches are at the top; the words are
# below them under messages:.
# Adding something later (Mike's config posture, Nov 6, 2026): put a
# new knob in the section it belongs to and comment what it does and
# what changing it means; put new sentences under messages:. Nothing
# else needs restructuring — the file is meant to grow by addition.

sort:
  # Which containers tidy themselves for players with sorting on.
  # These four are the set the old AutoSort handled — the parity set.
  types: [CHEST, BARREL, ENDER_CHEST, SHULKER_BOX]
  # The names read out in the "Sorting enabled for: ..." line.
  type-names:
    CHEST: Chest
    BARREL: Barrel
    ENDER_CHEST: Ender Chest
    SHULKER_BOX: Shulker Box

filter:
  # Hoppers feeding a filter chest get filtered too — farms are the
  # headline use, so this ships ON (decided Nov 6, 2026). Turn it off
  # here if a redstone farm ever needs the chest left alone; no
  # rebuild needed. Removals by hopper are written down as hopper
  # removals and land in the chest owner's recovery box.
  hoppers: true
  # If this list is ever non-empty, hopper filtering happens ONLY in
  # these worlds. Empty = every world.
  hopper-worlds: []

recovery:
  # How long a removed stack waits in the recovery box before it is
  # really gone: 7 days (decided Nov 6, 2026 — the family plays
  # heaviest on weekends, and 24 hours was too easy to miss).
  hours: 168
  # The most stacks one player's box can hold — three double chests'
  # worth. Past the cap, the oldest entries go first, and every one
  # of those is written down too.
  max-stacks: 162

selector:
  # Chest kinds shown per page of the setup screen.
  page-size: 28

max-org:
  # Max Organization (the 0.2.0 feature): rent or buy the ability to
  # open and manage every chest around you that you may set up, all
  # in one view. The view stores nothing — it is a window onto the
  # real chests — so a rent lapse can never lose an item.
  enabled: true
  # Rent: this much money for this many days. When the days run out
  # the ability turns off; renting again turns it back on at once.
  # Nothing is ever charged on its own — every rent is a fresh,
  # confirmed purchase.
  rent-price: 1000
  rent-days: 30
  # Buy: this much money, once, and the ability is permanent. Rent
  # already paid never counts toward this — the player wording says
  # so before any charge.
  buy-price: 15000
  # How far the network reaches from where the player stands, in
  # blocks (a chest whose center is farther than this never appears).
  radius: 16
  # Stacks shown per page of the network view (54-slot screen, the
  # bottom row is buttons — keep this at 45 or below).
  page-size: 45


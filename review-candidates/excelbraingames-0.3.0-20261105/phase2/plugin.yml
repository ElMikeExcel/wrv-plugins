name: ExcelBrainGames
version: 0.2.0
author: Steve
main: com.winkreyes.excelbraingames.ExcelBrainGames
api-version: "1.21"
description: 'Brain Games for the family: tap-only puzzle games in a menu. The framework (/games, compass Brain Games door, save/resume sessions, the shared $1,500/day cap with streak bonuses, Vault payouts, console admin) plus Word Search (fresh generated grid every round, two-tap circling), Memory Match, and Sudoku (fresh unique-solution puzzle every round, palette-first placement, picture mode for kids, 9x9 two-view paging). Kid tiers enabled: Mike hand-checked the kid word lists Nov 4, 2026. Quick Math, Word Scramble and Riddle of the Day follow in Phase 3.'
depend: [Vault]
commands:
  games:
    description: Open the Brain Games menu, or run console admin commands
    usage: /games — or /games admin [status|reset|resetday|setkid|reload] (console or braingames.admin)
    aliases: [brain, puzzles]
permissions:
  braingames.play:
    description: Open the Brain Games menu and play
    default: true
  braingames.admin:
    description: Run /games admin (status, reset, resetday, setkid, reload) to help stuck players; the server console can always run it
    default: op

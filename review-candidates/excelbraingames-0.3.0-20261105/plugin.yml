name: ExcelBrainGames
version: 0.3.0
author: Steve
main: com.winkreyes.excelbraingames.ExcelBrainGames
api-version: "1.21"
description: 'Brain Games for the family: tap-and-chat puzzle games in a menu. All six games live: Word Search (fresh generated grid, two-tap circling), Memory Match, Sudoku (fresh unique-solution puzzles, picture mode for kids, 9x9 two-view paging), Quick Math, Word Scramble and Riddle of the Day — the text trio runs on one shared question loop (tap choices or type answers in chat). Framework: /games menu + compass door, save/resume sessions, the shared $1,500/day cap with streak bonuses, Vault payouts, full console admin including riddle + setriddle. Kid tiers enabled: Mike hand-checked the kid word lists Nov 4, 2026; kid tiers pay grown-ups half.'
depend: [Vault]
commands:
  games:
    description: Open the Brain Games menu, or run console admin commands
    usage: /games — or /games admin [status|reset|resetday|setkid|reload] (console or braingames.admin)
    aliases: [brain, puzzles]
permissions:
  braingames.play:
    description: Open the Brain Games menu and play
    default: true
  braingames.admin:
    description: Run /games admin (status, reset, resetday, setkid, reload) to help stuck players; the server console can always run it
    default: op

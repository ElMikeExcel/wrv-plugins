wrv_spark:
  icon: missile
  upgrade_required_path: beginner
  category: combat
  worth: 660
  earns: 6
  earns_cooldown_scale: 1
  actions:
    cast:
    - class: CustomProjectile
      actions:
      - class: Damage
        damage: 1.0
        player_damage: 1.0
        entity_damage: 1.0
  effects:
    cast:
    - sound: block_beacon_power_select
      sound_pitch: 1.8
      sound_volume: 0.9
    - sound: entity_arrow_shoot
      sound_pitch: 2
      sound_volume: 0.2
    - sound: entity_guardian_attack
      sound_pitch: 1.5
      sound_volume: 0.2
    - sound: magic.zap_crack
      sound_volume: 0.75
      location: origin
      color_override: color
      effectlib:
        class: ConeEffect
        iterations: 10
        particle: dust_color_transition
        to_color: '#222222'
        lengthGrow: 0.1
        radiusGrow: 0.003
        updateLocations: false
        updateDirections: false
        particle_count: 8
        particle_offset_y: 0.1
        particle_offset_x: 0.1
        particle_offset_z: 0.1
    tick:
    - particle: dust_color_transition
      color: '#FFFFFF'
      location: target
      particle_count: 4
      particle_offset_y: 0.2
      particle_offset_x: 0.2
      particle_offset_z: 0.2
      particle_size: 1
    break:
    - class: EffectSingle
      location: target
      particle: block_crack
      particle_count: 100
      particle_offset_x: 0.6
      particle_offset_y: 0.6
      particle_offset_z: 0.6
    hit_block:
    - class: EffectSingle
      location: target
      particle: block_crack
      particle_count: 30
      particle_offset_x: 0.2
      particle_offset_y: 1
      particle_offset_z: 0.2
    hit_entity:
    - class: EffectSingle
      location: target
      particle: redstone
      particle_count: 30
      particle_offset_x: 0.2
      particle_offset_y: 0.2
      particle_offset_z: 0.2
    hit:
    - sound: entity_player_attack_knockback
      sound_pitch: 2
      location: target
    - class: EffectSingle
      location: target
      particle: fireworks_spark
      particle_count: 10
      particle_offset_x: 0.3
      particle_offset_y: 0.3
      particle_offset_z: 0.3
      sound: magic.zap
      sound_volume: 0.3
      particle_data: 0.1
    headshot:
    - sound: entity_player_attack_knockback
      sound_pitch: 2
      location: target
    - class: EffectSingle
      location: target
      particle: fireworks_spark
      particle_count: 20
      particle_offset_y: 0.2
      particle_offset_x: 0.2
      particle_offset_z: 0.2
      particle_data: 0.1
      sound: magic.zap
      sound_volume: 0.3
    - sound: entity_player_attack_crit
      sound_pitch: 0.8
      location: target
      particle: crit_magic
      particle_count: 30
      particle_offset_y: 1
      particle_offset_x: 1
      particle_offset_z: 1
      particle_data: 0.5
  parameters:
    allow_max_range: true
    velocity: 200
    range: 24
    hitbox: true
    target_type: Damageable
    player_damage: 1.0
    entity_damage: 1.0
    target_breakables: 0
    cooldown: 3000
    reorient: false
    undo: 10000
    damage: 1.0
  costs:
    mana: 6
  name: Spark

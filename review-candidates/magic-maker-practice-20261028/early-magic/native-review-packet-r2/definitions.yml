stormshackle:
  icon: chainlightning
  category: utility
  worth: 1260
  earns: 6
  actions:
    cast:
    - class: ChangeContext
      target_caster: true
      actions:
      - class: Modifier
        add_modifiers: wrv_focus
        duration: 5000
    - class: CustomProjectile
      actions:
      - class: Damage
        damage: 0.5
        player_damage: 0.5
        entity_damage: 0.5
      - class: PotionEffect
        duration: 4000
        effect_slow: 0
      - class: Delay
      - class: AreaOfEffect
        actions:
        - class: Asynchronous
          actions:
          - class: CustomProjectile
            velocity: 150
            actions:
            - class: PotionEffect
              duration: 4000
              effect_slow: 0
            - class: Delay
            - class: AreaOfEffect
              target_count: 1
              actions:
              - class: CustomProjectile
                actions:
                - class: PotionEffect
                  duration: 4000
                  effect_slow: 0
            - class: Repeat
              actions:
              - class: PotionEffect
                duration: 4000
                effect_slow: 0
              - class: Delay
      - class: Repeat
        actions:
        - class: PotionEffect
          duration: 4000
          effect_slow: 0
        - class: Delay
  effects:
    cast:
    - class: EffectSingle
      sound: magic.zap
      location: origin
    - sound: block_conduit_activate
      sound_pitch: 1.75
    projectile:
    - class: EffectSingle
      effectlib:
        class: LineEffect
        isZigZag: true
        zigZags: 2
        zigZagOffset: 0,0.05,0
        length: 10
        particles: 50
        particle: redstone
        color: FFF000
        duration: 2000
    - location: source
      effectlib:
        class: LineEffect
        isZigZag: true
        zigZags: 2
        zigZagOffset: 0,0.05,0
        length: 10
        particles: 20
        particle: fireworks_spark
        particle_count: 4
        particle_offset_x: 0.1
        particle_offset_y: 0.1
        particle_offset_z: 0.1
        duration: 2000
    tick:
    - particle: fireworks_spark
      particle_count: 2
      particle_offset_x: 0.2
      particle_offset_y: 0.2
      particle_offset_z: 0.2
      location: target
    hit:
    - sound: entity_guardian_attack
      sound_pitch: 2
      sound_volume: 0.5
      location: target
    - class: EffectSingle
      sound: magic.zap_crack
      sound_volume: 0.5
      location: target
      particle: fireworks_spark
      particle_count: 10
      particle_offset_x: 1
      particle_offset_y: 1
      particle_offset_z: 1
    - sound: block_conduit_activate
      sound_pitch: 1.8
      location: target
  parameters:
    tick_size: 5
    target: other
    target_self: false
    target_source: false
    range: 48
    velocity: 100
    radius: 8
    target_count: 3
    target_type: Damageable
    player_damage: 0.5
    entity_damage: 0.5
    delay: 250
    repeat: 2
    target_breakables: 0
    cooldown: 8000
    ignore_modified: true
    cooldown_mage: 1000
    damage: 0.5
  costs:
    mana: 15
  upgrade_required_path: apprentice
  name: Storm Shackle
  earns_cooldown_scale: 1

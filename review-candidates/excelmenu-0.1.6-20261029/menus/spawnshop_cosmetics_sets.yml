    material: SHIELD
    slot: 0
    name: '&f&lTank Set'
    lore:
    - '&7Steel-silver color + bold name.'
    - '&aLeft click: rent 1 week - $600'
    - '&bShift-left click: rent 4 weeks - $2,100'
    - '&eRight click: own forever - $30,000'
    - '&7A set outranks single picks while it lasts.'
    clicks:
      left:
      - '[console] excelcosmetics buy %player_name% set tank'
      shift-left:
      - '[console] excelcosmetics buy %player_name% set tank 4'
      right:
      - '[console] excelcosmetics buy %player_name% set tank own'
    bedrock:
      mode: modal
      left-label: Rent 1 week - $600
      right-label: Own forever - $30,000
      four-label: Rent 4 weeks - $2,100

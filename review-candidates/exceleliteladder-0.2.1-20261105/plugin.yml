name: ExcelEliteLadder
version: 0.2.1
main: com.winkreyes.exceleliteladder.ExcelEliteLadder
api-version: '1.13'
softdepend: [EliteMobs, ExcelGuildGate]
author: WinkReyesValley
description: Elite Seal Ladder - when a GuildGate seal breaks, steps EliteMobs MobCombatSettings.yml up to the ladder values at the next empty-server moment (dated backup, verify, restore on failure, em reload). Up only. Since 0.2.0 the ladder table lives in ladder.yml (strictly validated on load; a malformed table is refused and the last-good table keeps running). Since 0.2.1 the built-in default table carries the Nov 5, 2026 retune, and natural elites get a Speed potion buff (config.yml elite-speed section; EliteMobs' own movement_speed channel).
commands:
  eliteladder:
    description: Elite Seal Ladder admin (status / check / retry / reload the ladder table).
    usage: /eliteladder status | check | retry | reload
    permission: exceleliteladder.admin
permissions:
  exceleliteladder.admin:
    default: op

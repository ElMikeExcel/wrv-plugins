name: ExcelProtect
version: '0.1.5'
main: com.winkreyes.excelprotect.ExcelProtect
api-version: '1.21'
author: Excel (Wink Reyes Valley)
website: https://winkreyesvalley.com
license: MIT
description: 'ExcelProtect — the all-in-one record + recovery system: append-only daily JSONL per stream (blocks, containers, entities, items, players, locations, economy, audit, combat, damage, dealt, healing, deaths), byte-exact item payloads, rollback, death restores and Lost & Found, plus 0.1.5 Clarity: delivery outcomes, item chains, the chain-of-custody query and per-player timelines. Query with /excelprotect export, where, playtime, item, timelines and inspect — no database.'
softdepend: [GriefPrevention, Vault, mcMMO, Magic, EliteMobs]
commands:
  excelprotect:
    description: Export, inspect, damage incidents, location timelines, item chains, player timelines, rollback, restores, import, status
    usage: /excelprotect export|inspect [player <name>|at <world> <x> <y> <z>]|damage <player> [hours]|dealt <player> [hours]|healing <player> [hours]|where <player> [hours]|playtime <player> [days]|item <player> <item> [hours]|timelines rebuild [day]|rollback|restore-stand|deaths|import|status ...
    permission: excelprotect.admin
  lostfound:
    description: Recover your own destroyed items from the ledger
    usage: /lostfound [claim <number>]
    aliases: [recover]
  deathrecord:
    description: Staff lookup of death snapshots and the burn ledger
    usage: /deathrecord <player>
    permission: excelprotect.admin
permissions:
  excelprotect.admin:
    description: Export, rollback, restores, import, status, /deathrecord
    default: op
  excelprotect.lostfound:
    description: Use /lostfound
    default: true

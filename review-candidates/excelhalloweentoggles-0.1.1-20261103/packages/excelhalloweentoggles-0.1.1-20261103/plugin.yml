name: ExcelHalloweenToggles
version: 0.1.1
main: com.winkreyesvalley.excelhalloweentoggles.ExcelHalloweenToggles
api-version: '1.21'
author: Excel (Wink Reyes Valley)
description: Per-player Halloween scare toggles — companion to Halloween_Softici 3.4.0. Each player picks their own scares.
softdepend: [Halloween_Softici, PlaceholderAPI, Geyser-Spigot]
commands:
  scares:
    description: Your Halloween scare switches — tap them in the form/GUI, list them, or flip one
    usage: /scares [list|<feature>|test <feature>]
    aliases: [halloweentoggles]
permissions:
  excelhalloweentoggles.test:
    description: Fire a scare at yourself through the real gate + fire path (proof seam)
    default: op

# ExcelTrainingWheels — the Training Wheels Protocol.
# Protection follows the CHILD, invisibly: no messages, titles,
# particles or sounds are ever shown to a protected player. Admins
# manage the list with /trainingwheels (alias /tw); edits persist
# to this file immediately (Bukkit rewrites it, comments included
# here will be lost on the first command edit — the settings and
# the list are what matter).

# Master switch. false = shield scales nothing, door hold cancels
# nothing, no sieges run.
enabled: true

# Verbose console logging of shield scalings, door holds and siege
# resets. Console only — never anything in game.
debug: false

shield:
  # Factor used by "/trainingwheels add <player>" when none is given.
  default-factor: 0.5

  # SEAL COMPENSATION (0.1.1 — Mike's ABSOLUTE LINE, Oct 19, 2026):
  # a protected player takes HALF (their base factor) OF A MOB'S
  # NORMAL, UNSCALED DAMAGE, at every seal state, in every world.
  # EliteMobs multiplies an ELITE's outgoing damage by the ladder
  # step below (its MobCombatSettings scaledDamageToPlayerMultiplier),
  # so against elite damagers the shield divides the player's base
  # factor by the CURRENT step: factor = base / dealt. Non-elite
  # mobs are never ladder-scaled and always use the flat base
  # factor. The seal count is read live from ExcelGuildGate
  # (cached; refreshed on join and every 30 seconds) — this table
  # must mirror the mob-scaling ladder whenever the ladder changes.
  compensation:
    # Master switch for the division above. false = 0.1.0 behavior
    # (flat base factor against everything, elites included).
    enabled: true
    # Seal count to assume when GuildGate's state cannot be read
    # (plugin absent or API unreachable). 0 = today's ladder step.
    # The shield NEVER guesses weaker than this silently: the
    # fallback is logged at enable and on every transition.
    assume-seal: 0
    # Worlds where ladder compensation does NOT apply (the flat
    # base factor governs elites there): content in these worlds
    # is not ladder-scaled. For the future EliteMobs GUILD world —
    # guild prep names it here when the world is created, as part
    # of its owed verification (see BUILD.md). Empty today: no
    # guild world exists yet.
    excluded-worlds: []
    # Cumulative damage-dealt multiplier by seals broken (ladder
    # v4: base 1.50, then +0.15 per seal, ending 2.25 at Seal 5).
    dealt-multipliers:
      "0": 1.50
      "1": 1.65
      "2": 1.80
      "3": 1.95
      "4": 2.10
      "5": 2.25

# BOSSTRIAL COMPENSATION (0.1.3 — Mike's ABSOLUTE LINE, restated
# Nov 2, 2026): the same quarter-of-UNSCALED rule against seal
# bosses. ExcelBossTrial scales a seal boss's outgoing damage in
# an open encounter (chapter multiplier x attrition ramp — up to
# x2.5 of vanilla on the Wither/Warden at ramp cap), so against a
# seal boss the shield divides the player's effective factor by
# the boss's CURRENT outgoing scale, read live through a
# reflective seam on ExcelBossTrialAPI.outgoingScaleFor (the
# division runs only where that pressure scale is the scaler
# that touched the event — the boss itself as damager; Wither
# skulls and the dragon's phase-2-axis shapes are never divided
# by it). false = the pre-0.1.3 behavior: flat factor against
# seal bosses, i.e. proportional takes (0.25 x chapter x ramp).
# The seam fails soft either way: BossTrial absent or older than
# 0.3.7 reads 1.0 and the flat factor applies, exactly as before.
compensate:
  bosstrial: true

doors:
  # Door TIERS (Mike, Oct 19, 2026): the better the door, the
  # longer it buys you — time to get out and fight. Wooden doors
  # break at vanilla pace (~14s on Hard) and iron doors fall to
  # the 60s siege below; COPPER sits between at ~45s and rides
  # the same siege machinery as iron, at this threshold: while a
  # mob hunts an unprotected player (or a villager) at a copper
  # door, cracks and banging build for this many seconds, then
  # the door is destroyed with no drop. Vanilla NEVER completes
  # a copper break on its own — the completion is suppressed —
  # so the tier cannot be rushed. Tiers are a property of the
  # DOOR, not the mob or its target (zombie family, vindicators,
  # villager hunts — same tier); the one exception is the door
  # hold: a mob hunting a protected player never starts a siege
  # and its vanilla attempts are stopped outright — any door
  # holds indefinitely for a protected player. (An earlier draft
  # stretched vanilla by holding each completed break a counted
  # number of times; the rig proved a cancelled zombie does not
  # reliably re-attempt, so the deterministic siege won — see
  # BUILD.md.) 0 disables the tier (copper breaks at vanilla
  # pace again).
  copper-target-seconds: 45

siege:
  # Seconds of accumulated siege (zombie at the door, hunting an
  # unprotected player) before an iron door is destroyed. Wooden
  # doors break far faster in vanilla — iron is the slow, loud one.
  threshold-seconds: 60
  # Seconds a siege may go unobserved (zombie knocked away, target
  # ducked out) before its progress resets to zero.
  grace-seconds: 3
  # Hard cap on doors under siege at once (performance guard).
  max-concurrent: 8
  # Siege evaluation cadence in ticks (10 = twice a second).
  cadence-ticks: 10

protected:
  players:
    # Rylie — .RylieDSunflower, Bedrock (Fire tablet). Floodgate

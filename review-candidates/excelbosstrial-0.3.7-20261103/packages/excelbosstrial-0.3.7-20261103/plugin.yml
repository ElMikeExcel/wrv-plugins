name: ExcelBossTrial
version: 0.3.7
author: Argus
main: com.winkreyes.excelbosstrial.ExcelBossTrial
api-version: "1.21"
description: The seal-boss rules of Wink Reyes Valley in one home - damage caps, the 70% player-damage share gate (config share-threshold), the presence rule, 6-hour credit cooldowns, the elder-guardian trio, participant spoils, the two-phase dragon trial (ExcelDragonTrial 0.1.2, ported in), participant growth (the boss rallies), and curated seal loot. 0.2.1 adds the seal-integrity fixes - the wither fought-free (cage) check, the warden horizontal range band, and the dragon share gate. 0.2.2 adds the seal-hardening pair - the warden gives up on a fight that never comes to it, and end crystals and respawn anchors answer to their placer. 0.2.3 adds the announcement window - while it is armed, seal attempts, fails, breaks and running cooldowns are announced in chat, repeated hourly, and rebroadcast to everyone on every join. 0.2.4 adds the XP band governor feed - every governed hit plants its band verdict for the XP listener (ExcelRewardGuard), so out-of-band hits pay 25% mcMMO XP in real time while in-band hits pay full; silent, fail-safe both ways. 0.2.5 makes the rewards mean something (spec 4.6) - the dragon gains a signature - "First Breath", one elytra per champion standing at the fall - and every seal's named signature gear is granted per champion, stamped with its earner's provenance, under the fairness rule. 0.2.6 splits the command gate - the status view is public, so any player can run /bosstrial status to check seal state and cooldowns, while reload and reset stay admin-only, enforced in the handler now that plugin.yml no longer gates the whole command. 0.2.7 keeps a fight when its boss is merely unloaded (the family went home, logged off or wiped) instead of forgetting it, holds the dragon trial while nobody is at the arena, and sets aside damage a lost ledger never saw so an honest finish can still earn the seal. 0.2.11 hardens the dragon flip with a second, final judgment at HIGHEST plus danger-zone logging, closes a saved trial out on version change instead of restoring it (archived, logged, counters kept), presents earned rewards automatically once per batch - with immunity frames on the auto-open only, never on a manual one - and pays every signature stack plus the dragon's breath and crystals per champion as personal claims, dragon XP included. 0.3.1 adds the fight record - at every verdict and every elder trio progress point the encounter's per-player table (damage dealt, damage taken, healing done where a heal-spell cast names its source, healing received) is written to fights/ and to the log - and the elder trio escalation, with each elder priced as an epic fight of its own, and the trio's third, seal-completing elder carries a pool multiplier (elder-guardian.trio, settled x1.3). 0.3.2 adds milestone beats - at 75/50/25% of a chapter's pool remaining, a broadcast line and one pulse surge, once per threshold per encounter (per phase for the dragon; the warden's lines are its progress display, the warden having no health bar) - and moves the dragon's add-wave thresholds into config (dragon.adds.wave-thresholds). 0.3.3 adds the elite sprinkle - at each milestone stamp an armed chapter rolls once (chance x stamp multiplier, capped) to send EliteMobs elites in as adds beside the boss, contained (no loot, no coins, no vanilla drops), announced on a pass, leashed to the fight, and removed when the encounter ends; every chapter ships disabled (<chapter>.sprinkle.enabled) until armed, and the plugin runs exactly as before when EliteMobs is absent. 0.3.4 adds the ExcelProtect emitter - at every verdict the encounter's full per-player fight table is published to ExcelProtect, which records its combat fight summary and audit seal verdict from it; elder trio progress points publish as fight progress records; and chapter state changes (a fight started, a fight ended, an elder respawn scheduled, an elder respawned) publish as boss-state records so Protect can answer boss status. The adapter is one replaceable class, config-gated under protect-emit, fail-soft throughout, and BossTrial runs exactly as before when ExcelProtect is absent. 0.3.5 retires guardian spike reflect for tracked seal elders (elder-guardian.reflect.multiplier, settled 0.0) - the vanilla 3 HP spike return, trivial against a normal elder, compounded into a melee-only tax against the governed epic pools, and the attrition ramp silently doubled it late in long fights - so spike hits from a tracked elder during an encounter are scaled by the chapter multiplier instead of the pressure scale, and cancel outright at 0.0; guardians outside seal encounters, sprinkle adds, player Thorns armor and every other chapter are untouched. 0.3.6 adds damage feedback (the feel patch) - the boss bar title carries the true pool numbers on every chapter, the warden gains the numbered bar vanilla never gave it, the dragon title is priced per phase, and each champion's action bar carries their own last hit and running damage total, so the gear progression the governor always preserved in the ledger is finally visible on every hit (a wood sword reads 4, a Sharpness V netherite sword 11, a crit 16.5). Display only - fight math, pools, verdicts, rewards and the ExcelProtect fight-table feed are untouched - with a per-player opt-out at /bosstrial feedback on or off, and every display behavior a key under feedback in the config. 0.3.7 closes the TrainingWheels pulse gap - the attrition pulse is source-less MAGIC damage that TrainingWheels' own damage listener never sees, so a protected player ate the full pulse; BossTrial now reads the protected player's shield factor through a reflective seam and scales their pulse by it (per-chapter key <chapter>.pressure.pulse-respect-training-wheels, settled on), restoring the absolute line that a protected player takes their factor of the UNSCALED damage - regular pulse and milestone surge alike, since both ride the one application site. It also publishes BossTrial's current outgoing scale (chapter multiplier under the attrition ramp) through ExcelBossTrialAPI.outgoingScaleFor, the getter ExcelTrainingWheels 0.1.3's compensation seam divides by, so direct boss hits are judged against the same unscaled line. Fail-soft throughout, in the house adapter shape; with TrainingWheels absent the pulse lands at full amount exactly as before, and the getter reads 1.0 whenever no scale applies.
softdepend: [ExcelGuildGate, Magic, GriefPrevention, EliteMobs, ExcelProtect, ExcelTrainingWheels]
commands:
  bossrewards:
    description: Open your own earned boss rewards
    usage: /bossrewards
  bosstrial:
    description: ExcelBossTrial status and admin controls
    usage: /bosstrial [status|feedback on|off|reload|reset [all]|grantclaim <player> <material> <count>]
permissions:
  excelbosstrial.admin:
    description: Allows /bosstrial admin commands
    default: op

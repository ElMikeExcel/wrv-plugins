name: ExcelAutoSort
version: 0.1.0
api-version: '1.21'
main: com.winkreyes.excelautosort.ExcelAutoSort
description: Our own auto-sort and chest filters — chests tidy themselves, and a chest can keep only what you choose, or throw away the junk, with a recovery box so nothing is ever lost.
authors: [Iris, Mike]
softdepend: [GriefPrevention, ExcelProtect, PlaceholderAPI, floodgate]

commands:
  autosort:
    description: Toggle auto-sorting of your chests, or set up a chest filter
    usage: /autosort [status|chest|recover|admin]
    aliases: [sort]

permissions:
  excelautosort.toggle:
    description: Toggle auto-sort for yourself
    default: true
  excelautosort.chest:
    description: Open the chest filter setup for a chest you may configure
    default: true
  excelautosort.recover:
    description: Open your filter recovery box
    default: true
  excelautosort.admin:
    description: Staff tools (prune, reload) and filter setup inside admin claims
    default: op

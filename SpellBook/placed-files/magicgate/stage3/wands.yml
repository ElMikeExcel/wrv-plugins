base_magic:
  hidden: true
  effects:
    open:
    - sound: magic.wandup
      sound_broadcast: false
      sound_volume: 0.4
    - sound: block_chest_open
      sound_pitch: 1.5
      sound_volume: 0.1
      sound_broadcast: false
    close:
    - sound: magic.wanddown
      sound_broadcast: false
      sound_volume: 0.4
    - sound: block_chest_close
      sound_pitch: 1.5
      sound_volume: 0.1
      sound_broadcast: false
    cycle:
    - sound: magic.paperturn
      sound_broadcast: false
      sound_volume: 0.4
    - sound: item_book_page_turn
      sound_pitch: 1.5
      sound_volume: 0.2
      sound_broadcast: false
    cycle_spell:
    - sound: ui_button_click
      sound_pitch: 1.9
      sound_volume: 0.1
      sound_broadcast: false
    cycle_hotbar:
    - sound: magic.paperturn
      sound_broadcast: false
      sound_volume: 0.1
    - sound: item_spyglass_use
      sound_pitch: 0.3
      sound_volume: 1.5
      sound_broadcast: false
base_undroppable:
  inherit: base_magic
  hidden: true
  undroppable: true
  unstashable: false
  indestructible: true
base_keep:
  inherit: base_undroppable
  hidden: true
  keep: true
  invulnerable: true
base_bound:
  inherit: base_keep
  hidden: true
  bound: true
  immortal: true
  track: true
basic_wand:
  inherit: base_magic
  hidden: true
  mode: inventory
  drop: cycle_hotbar
  left_click: cast
  right_click: toggle
  swap: cycle_hotbar
  quiet: 1
  effect_bubbles: false
  item_attributes:
    GENERIC_ATTACK_SPEED: 10
  item_attribute_slot: mainhand
base_wand:
  hidden: true
  inherit: base_bound
  mode: chest
  inventory_rows: 6
  left_click: cast
  right_click: cycle
  right_click_sneak: toggle
  drop: cycle_reverse
  drop_sneak: toggle
  swap: cycle
  swap_sneak: cycle_reverse
  use_active_name: true
  action_bar:
    message: $spell
    interval: 3600000
  boss_bar:
    mode: mana
    bar_title: Mana @mana
    bar_color: blue
    bar_style: solid
  quiet: 1
  effect_bubbles: false
  item_attributes:
    GENERIC_ATTACK_SPEED: 10
  item_attribute_slot: mainhand
  cooldown_reduction: 0.2
